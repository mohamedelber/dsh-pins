<text x="90" y="782" font-size="21" font-weight="700" fill="#342E2A">No zone left? Let it go.</text>
<text x="90" y="810" font-size="18" fill="#6E645C">Donate clean, undamaged toys; throw away worn ones with loose eyes, torn seams or spilling stuffing.</text>
<text x="60" y="866" font-size="16" fill="#6E645C">Zone sizes are our own rule of thumb: let the play zone be one basket or tower, and rotate the rest.</text>
