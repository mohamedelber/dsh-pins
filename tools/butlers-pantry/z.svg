<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" font-family="Poppins, sans-serif" role="img" aria-labelledby="bp-t bp-d"><title id="bp-t">Butler's pantry layouts and sizes</title><desc id="bp-d">Three butler's pantry layouts drawn from above with typical sizes. Single wall: one run of 24-inch-deep base cabinets and at least a 36-inch walkway, so the space is about 60 inches, or 5 feet, wide. Galley: cabinets on both walls with a 42-inch work aisle between them, about 90 inches, or 7 and a half feet, wide in total. L-shape: cabinets on two walls meeting in a corner, with the same 42-inch aisle in front. Base cabinets are about 24 inches deep with a 25-inch countertop, and upper cabinets about 12 inches deep. Aisle guidance from the NKBA Kitchen Planning Guidelines.</desc><rect width="1200" height="800" fill="#F7F1E9"/><text x="60" y="88" font-size="44" font-weight="700" fill="#342E2A">Butler's Pantry Layouts and Sizes</text><text x="60" y="130" font-size="22" fill="#6E645C">Seen from above. Plan the aisle first, then the cabinets.</text><text x="1140" y="60" font-size="18" fill="#6E645C" text-anchor="end">dailyspacehacks.com</text><text x="80" y="195" font-size="24" font-weight="700" fill="#342E2A">1. Single wall</text><line x1="80" y1="215" x2="339.2" y2="215" stroke="#342E2A" stroke-width="8" stroke-linecap="square"/><rect x="80" y="219" width="259.2" height="86.4" fill="#D9B48A" stroke="#B98A5E" stroke-width="3"/><rect x="80" y="305.4" width="259.2" height="129.6" fill="#DCE5D6" opacity=".6"/><text x="209.6" y="268.2" font-size="16" fill="#342E2A" text-anchor="middle">base cabinets</text><text x="209.6" y="376.2" font-size="16" fill="#6E645C" text-anchor="middle">walkway</text><line x1="80" y1="435.0" x2="339.2" y2="435.0" stroke="#342E2A" stroke-width="8" stroke-linecap="square"/><line x1="361.2" y1="223" x2="361.2" y2="301.4" stroke="#C85A32" stroke-width="3"/><line x1="351.2" y1="219" x2="371.2" y2="219" stroke="#C85A32" stroke-width="3"/><line x1="351.2" y1="305.4" x2="371.2" y2="305.4" stroke="#C85A32" stroke-width="3"/><text x="375.2" y="268.2" font-size="17" font-weight="700" fill="#C85A32" text-anchor="start">24 in</text><line x1="361.2" y1="309.4" x2="361.2" y2="431.0" stroke="#C85A32" stroke-width="3"/><line x1="351.2" y1="305.4" x2="371.2" y2="305.4" stroke="#C85A32" stroke-width="3"/><line x1="351.2" y1="435.0" x2="371.2" y2="435.0" stroke="#C85A32" stroke-width="3"/><text x="375.2" y="376.2" font-size="17" font-weight="700" fill="#C85A32" text-anchor="start">36 in min</text><text x="80" y="477.0" font-size="18" font-weight="700" fill="#342E2A">About 5 ft wide</text><text x="80" y="501.0" font-size="15" fill="#6E645C">Pass-through between</text><text x="80" y="521.0" font-size="15" fill="#6E645C">kitchen and dining room</text><text x="495" y="195" font-size="24" font-weight="700" fill="#342E2A">2. Galley</text><line x1="495" y1="215" x2="754.2" y2="215" stroke="#342E2A" stroke-width="8" stroke-linecap="square"/><rect x="495" y="219" width="259.2" height="86.4" fill="#D9B48A" stroke="#B98A5E" stroke-width="3"/><rect x="495" y="305.4" width="259.2" height="151.2" fill="#DCE5D6" opacity=".6"/><rect x="495" y="456.6" width="259.2" height="86.4" fill="#D9B48A" stroke="#B98A5E" stroke-width="3"/><line x1="495" y1="547.0" x2="754.2" y2="547.0" stroke="#342E2A" stroke-width="8" stroke-linecap="square"/><text x="624.6" y="387.0" font-size="16" fill="#6E645C" text-anchor="middle">work aisle</text><line x1="776.2" y1="223" x2="776.2" y2="301.4" stroke="#C85A32" stroke-width="3"/><line x1="766.2" y1="219" x2="786.2" y2="219" stroke="#C85A32" stroke-width="3"/><line x1="766.2" y1="305.4" x2="786.2" y2="305.4" stroke="#C85A32" stroke-width="3"/><text x="790.2" y="268.2" font-size="17" font-weight="700" fill="#C85A32" text-anchor="start">24 in</text><line x1="776.2" y1="309.4" x2="776.2" y2="452.6" stroke="#C85A32" stroke-width="3"/><line x1="766.2" y1="305.4" x2="786.2" y2="305.4" stroke="#C85A32" stroke-width="3"/><line x1="766.2" y1="456.6" x2="786.2" y2="456.6" stroke="#C85A32" stroke-width="3"/><text x="790.2" y="387.0" font-size="17" font-weight="700" fill="#C85A32" text-anchor="start">42 in</text><line x1="776.2" y1="460.6" x2="776.2" y2="539.0" stroke="#C85A32" stroke-width="3"/><line x1="766.2" y1="456.6" x2="786.2" y2="456.6" stroke="#C85A32" stroke-width="3"/><line x1="766.2" y1="543.0" x2="786.2" y2="543.0" stroke="#C85A32" stroke-width="3"/><text x="790.2" y="505.8" font-size="17" font-weight="700" fill="#C85A32" text-anchor="start">24 in</text><text x="495" y="585.0" font-size="18" font-weight="700" fill="#342E2A">About 7.5 ft wide</text><text x="495" y="609.0" font-size="15" fill="#6E645C">Most storage and</text><text x="495" y="629.0" font-size="15" fill="#6E645C">counter space</text><text x="880" y="195" font-size="24" font-weight="700" fill="#342E2A">3. L-shape</text><line x1="880" y1="215" x2="1096.0" y2="215" stroke="#342E2A" stroke-width="8" stroke-linecap="square"/><line x1="880" y1="215" x2="880" y2="456.6" stroke="#342E2A" stroke-width="8" stroke-linecap="square"/><rect x="884" y="219" width="212.0" height="86.4" fill="#D9B48A" stroke="#B98A5E" stroke-width="3"/><rect x="884" y="305.4" width="86.4" height="151.2" fill="#D9B48A" stroke="#B98A5E" stroke-width="3"/><rect x="970.4" y="305.4" width="125.6" height="151.2" fill="#DCE5D6" opacity=".6"/><text x="1033.2" y="387.0" font-size="15" fill="#6E645C" text-anchor="middle">aisle</text><line x1="1118.0" y1="309.4" x2="1118.0" y2="452.6" stroke="#C85A32" stroke-width="3"/><line x1="1108.0" y1="305.4" x2="1128.0" y2="305.4" stroke="#C85A32" stroke-width="3"/><line x1="1108.0" y1="456.6" x2="1128.0" y2="456.6" stroke="#C85A32" stroke-width="3"/><text x="1132.0" y="387.0" font-size="17" font-weight="700" fill="#C85A32" text-anchor="start">42 in</text><text x="880" y="585.0" font-size="18" font-weight="700" fill="#342E2A">Fits a square room</text><text x="880" y="609.0" font-size="15" fill="#6E645C">Corner holds a sink</text><text x="880" y="629.0" font-size="15" fill="#6E645C">or a coffee station</text><rect x="60" y="651.0" width="345" height="62" rx="12" fill="#FFFFFF" stroke="#D8CBBB" stroke-width="2"/><text x="78" y="677.0" font-size="18" font-weight="700" fill="#342E2A">Base cabinets</text><text x="78" y="701.0" font-size="15" fill="#6E645C">24 in deep, 36 in high</text><rect x="425" y="651.0" width="345" height="62" rx="12" fill="#FFFFFF" stroke="#D8CBBB" stroke-width="2"/><text x="443" y="677.0" font-size="18" font-weight="700" fill="#342E2A">Upper cabinets</text><text x="443" y="701.0" font-size="15" fill="#6E645C">About 12 in deep</text><rect x="790" y="651.0" width="345" height="62" rx="12" fill="#FFFFFF" stroke="#D8CBBB" stroke-width="2"/><text x="808" y="677.0" font-size="18" font-weight="700" fill="#342E2A">Aisle</text><text x="808" y="701.0" font-size="15" fill="#6E645C">36 in to walk, 42 in to work</text><text x="60" y="775" font-size="14" fill="#6E645C">Aisle widths from the NKBA Kitchen Planning Guidelines (36 in walkway, 42 in work aisle for one cook). Cabinet sizes are typical US stock sizes.</text></svg>