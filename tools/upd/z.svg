<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" font-family="Poppins, sans-serif" role="img" aria-labelledby="wl-t wl-d"><title id="wl-t">Walk-in pantry layouts and aisle widths</title><desc id="wl-d">Three top-down walk-in pantry plans with 16 inch deep shelves. U-shape: shelves on three walls around a 36 to 48 inch aisle, so the room needs to be at least about 68 inches (5 ft 8 in) wide. Galley: shelves on two facing walls with the same aisle, also about 68 inches wide. Single wall: shelves on one wall only, about 52 inches wide. Notes: 36 inches is the minimum aisle, 42 to 48 inches is more comfortable, 60 inches or more for a wheelchair, and keep everyday food within about 69 to 76 inches of reach.</desc><rect width="1200" height="820" fill="#F7F1E9"/><text x="60" y="84" font-size="44" font-weight="700" fill="#342E2A">Walk-In Pantry Layouts</text><text x="60" y="124" font-size="22" fill="#6E645C">Top view with 16 in deep shelves: how wide the room needs to be</text><text x="1140" y="60" font-size="18" fill="#6E645C" text-anchor="end">dailyspacehacks.com</text><rect x="60" y="160" width="340" height="470" rx="18" fill="#FFFFFF" stroke="#D8CBBB" stroke-width="2"/><text x="230" y="204" font-size="26" font-weight="700" fill="#342E2A" text-anchor="middle">U-shape</text><rect x="121.2" y="240" width="217.6" height="290" fill="#FBF8F3" stroke="#342E2A" stroke-width="5"/><rect x="190" y="526" width="80" height="8" fill="#FBF8F3"/><text x="230" y="556" font-size="15" fill="#6E645C" text-anchor="middle">door</text><rect x="123.7" y="242.5" width="51.2" height="285" fill="#D9B48A" stroke="#B98A5E" stroke-width="2"/><rect x="285.1" y="242.5" width="51.2" height="285" fill="#D9B48A" stroke="#B98A5E" stroke-width="2"/><rect x="123.7" y="242.5" width="212.6" height="51.2" fill="#D9B48A" stroke="#B98A5E" stroke-width="2"/><line x1="180.9" y1="419.8" x2="279.1" y2="419.8" stroke="#C85A32" stroke-width="3"/><path d="M180.9,419.8 l12,-8 v16 z M279.1,419.8 l-12,-8 v16 z" fill="#C85A32"/><text x="230.0" y="405.8" font-size="17" font-weight="700" fill="#C85A32" text-anchor="middle">36–48 in</text><text x="230.0" y="447.8" font-size="14" fill="#6E645C" text-anchor="middle">aisle</text><text x="230" y="592" font-size="20" font-weight="700" fill="#342E2A" text-anchor="middle">At least ~68 in</text><text x="230" y="618" font-size="15" fill="#6E645C" text-anchor="middle">wide, with a 36 in aisle</text><rect x="430" y="160" width="340" height="470" rx="18" fill="#FFFFFF" stroke="#D8CBBB" stroke-width="2"/><text x="600" y="204" font-size="26" font-weight="700" fill="#342E2A" text-anchor="middle">Galley</text><rect x="491.2" y="240" width="217.6" height="290" fill="#FBF8F3" stroke="#342E2A" stroke-width="5"/><rect x="560" y="526" width="80" height="8" fill="#FBF8F3"/><text x="600" y="556" font-size="15" fill="#6E645C" text-anchor="middle">door</text><rect x="493.7" y="242.5" width="51.2" height="285" fill="#D9B48A" stroke="#B98A5E" stroke-width="2"/><rect x="655.1" y="242.5" width="51.2" height="285" fill="#D9B48A" stroke="#B98A5E" stroke-width="2"/><line x1="550.9" y1="419.8" x2="649.1" y2="419.8" stroke="#C85A32" stroke-width="3"/><path d="M550.9,419.8 l12,-8 v16 z M649.1,419.8 l-12,-8 v16 z" fill="#C85A32"/><text x="600.0" y="405.8" font-size="17" font-weight="700" fill="#C85A32" text-anchor="middle">36–48 in</text><text x="600.0" y="447.8" font-size="14" fill="#6E645C" text-anchor="middle">aisle</text><text x="600" y="592" font-size="20" font-weight="700" fill="#342E2A" text-anchor="middle">At least ~68 in</text><text x="600" y="618" font-size="15" fill="#6E645C" text-anchor="middle">wide, with a 36 in aisle</text><rect x="800" y="160" width="340" height="470" rx="18" fill="#FFFFFF" stroke="#D8CBBB" stroke-width="2"/><text x="970" y="204" font-size="26" font-weight="700" fill="#342E2A" text-anchor="middle">Single wall</text><rect x="886.8" y="240" width="166.4" height="290" fill="#FBF8F3" stroke="#342E2A" stroke-width="5"/><rect x="930" y="526" width="80" height="8" fill="#FBF8F3"/><text x="970" y="556" font-size="15" fill="#6E645C" text-anchor="middle">door</text><rect x="999.5" y="242.5" width="51.2" height="285" fill="#D9B48A" stroke="#B98A5E" stroke-width="2"/><line x1="895.3" y1="419.8" x2="993.5" y2="419.8" stroke="#C85A32" stroke-width="3"/><path d="M895.3,419.8 l12,-8 v16 z M993.5,419.8 l-12,-8 v16 z" fill="#C85A32"/><text x="944.4" y="405.8" font-size="17" font-weight="700" fill="#C85A32" text-anchor="middle">36–48 in</text><text x="944.4" y="447.8" font-size="14" fill="#6E645C" text-anchor="middle">aisle</text><text x="970" y="592" font-size="20" font-weight="700" fill="#342E2A" text-anchor="middle">At least ~52 in</text><text x="970" y="618" font-size="15" fill="#6E645C" text-anchor="middle">wide, with a 36 in aisle</text><rect x="60" y="655" width="1080" height="100" rx="14" fill="#DCE5D6" stroke="#8FA689" stroke-width="2"/><text x="88" y="696" font-size="19" fill="#342E2A"><tspan font-weight="700">Aisle:</tspan> 36 in minimum, 42–48 in is more comfortable, 60 in or more for a wheelchair.</text><text x="88" y="728" font-size="19" fill="#342E2A"><tspan font-weight="700">Reach:</tspan> keep everyday food below about 69–76 in; the top shelf (~84 in) is for backups.</text><text x="60" y="795" font-size="15" fill="#6E645C">Aisle and reach figures: dimensions.com. Room widths are our estimates: aisle + shelf depth on each shelved side.</text></svg>