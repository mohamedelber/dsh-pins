<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" font-family="Poppins, sans-serif" role="img" aria-labelledby="bo-t bo-d"><title id="bo-t">Rug size under a boho bed</title><desc id="bo-d">Top-down diagram of rug size under a boho bed. A queen bed, 60 by 80 inches, sits on an 8 by 10 foot rug turned sideways, leaving 30 inches of rug on each side and about 24 inches at the foot. A king bed, 76 by 80 inches, sits on a 9 by 12 foot rug, leaving 34 inches on each side and about 28 inches at the foot. Aim for 18 to 24 inches or more of rug showing on the sides and foot. Below is a boho color palette: cream, terracotta, rust, sage, rattan and white oak.</desc>
<rect width="1200" height="900" fill="#F7F1E9"/>
<text x="60" y="88" font-size="44" font-weight="700" fill="#342E2A">What Size Rug Goes Under the Bed?</text>
<text x="60" y="128" font-size="22" fill="#6E645C">The jute or wool rug that anchors a boho bedroom, from above</text>
<text x="1140" y="60" font-size="18" fill="#6E645C" text-anchor="end">dailyspacehacks.com</text>
