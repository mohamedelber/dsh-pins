<text x="880" y="534" font-size="24" font-weight="700" fill="#342E2A" text-anchor="middle">King bed <tspan font-weight="400" font-size="18" fill="#6E645C">76 x 80 in</tspan></text>
<rect x="780" y="550" width="200" height="44" rx="22" fill="#C85A32"/><text x="880" y="579" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">9 x 12 ft rug</text>
<rect x="60" y="626" width="1080" height="64" rx="14" fill="#fff" stroke="#D8CBBB" stroke-width="2"/>
<text x="84" y="666" font-size="19" fill="#342E2A"><tspan font-weight="700" fill="#C85A32">Rule of thumb:</tspan> let 18 to 24 in or more of rug show on both sides and at the foot of the bed.</text>
<text x="60" y="734" font-size="20" font-weight="700" fill="#342E2A">A simple boho palette</text>
<rect x="60" y="752" width="168" height="54" rx="10" fill="#F3E9DC" stroke="#D8CBBB" stroke-width="2"/><text x="144" y="830" font-size="16" fill="#6E645C" text-anchor="middle">Cream</text>
