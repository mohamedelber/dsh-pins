<rect x="250.0" y="232" width="66.0" height="36" rx="9" fill="#F7F1E9" stroke="#D8CBBB" stroke-width="2"/><rect x="324.0" y="232" width="66.0" height="36" rx="9" fill="#F7F1E9" stroke="#D8CBBB" stroke-width="2"/>
<rect x="242.0" y="322.4" width="156.0" height="93.60" rx="8" fill="#C85A32" fill-opacity="0.5"/>
