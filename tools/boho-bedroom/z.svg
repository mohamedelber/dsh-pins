<rect x="606" y="752" width="168" height="54" rx="10" fill="#9AAE8C" stroke="#D8CBBB" stroke-width="2"/><text x="690" y="830" font-size="16" fill="#6E645C" text-anchor="middle">Sage</text>
<rect x="788" y="752" width="168" height="54" rx="10" fill="#C9A46A" stroke="#D8CBBB" stroke-width="2"/><text x="872" y="830" font-size="16" fill="#6E645C" text-anchor="middle">Rattan</text>
<rect x="970" y="752" width="168" height="54" rx="10" fill="#D9BE94" stroke="#D8CBBB" stroke-width="2"/><text x="1054" y="830" font-size="16" fill="#6E645C" text-anchor="middle">White oak</text>
<text x="60" y="874" font-size="15" fill="#6E645C">Rug sizes and the 18 to 24 in guide from Ruggable and The Citizenry rug guides. Rug placed sideways under the bed, front legs of the nightstands on the rug.</text>
