<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" font-family="Poppins, sans-serif" role="img" aria-labelledby="ki-t ki-d"><title id="ki-t">Kitchen island clearances</title><desc id="ki-d">Top view of a 16 by 14 foot kitchen with an L-shaped run of cabinets and an island. The work aisle between the cabinets and the island is 42 inches for one cook or 48 inches for two. The island is 48 inches deep including a 15 inch overhang, with stools 24 inches apart on the far side and 44 inches behind the stools so people can walk past. A 36 inch walkway runs around the open end.</desc><rect width="1200" height="900" fill="#F7F1E9"/><text x="60" y="84" font-size="44" font-weight="700" fill="#342E2A">Kitchen Island Clearances</text><text x="60" y="124" font-size="22" fill="#6E645C">The spacing that makes an island work, from the NKBA guidelines</text><text x="1140" y="60" font-size="18" fill="#6E645C" text-anchor="end">dailyspacehacks.com</text><rect x="110" y="170" width="691.2" height="604.8000000000001" fill="#FBF8F3" stroke="#342E2A" stroke-width="3"/><rect x="110" y="170" width="691.2" height="90.0" fill="#CFDDCB" stroke="#8FA689" stroke-width="2"/><rect x="110" y="260.0" width="90.0" height="514.8000000000001" fill="#CFDDCB" stroke="#8FA689" stroke-width="2"/><text x="455.6" y="222.0" font-size="18" fill="#3F5E39" text-anchor="middle">cabinets and counter, 25 in deep</text><rect x="351.20000000000005" y="411.20000000000005" width="302.40000000000003" height="172.8" rx="6" fill="#E9D8BE" stroke="#B98A5E" stroke-width="2.5"/><line x1="351.20000000000005" y1="530.0" x2="653.6" y2="530.0" stroke="#B98A5E" stroke-width="2" stroke-dasharray="7 6"/><text x="502.40000000000003" y="475.8" font-size="19" font-weight="700" fill="#342E2A" text-anchor="middle">island 7 ft x 48 in</text><text x="502.40000000000003" y="564.8" font-size="15" fill="#6E645C" text-anchor="middle">15 in overhang</text><circle cx="416.0" cy="616.4000000000001" r="28.8" fill="#fff" stroke="#B98A5E" stroke-width="2.5"/><circle cx="502.40000000000003" cy="616.4000000000001" r="28.8" fill="#fff" stroke="#B98A5E" stroke-width="2.5"/><circle cx="588.8" cy="616.4000000000001" r="28.8" fill="#fff" stroke="#B98A5E" stroke-width="2.5"/><text x="358.4" y="674.0" font-size="16" fill="#6E645C">24 in per stool</text><line x1="639.2" y1="260.0" x2="639.2" y2="411.20000000000005" stroke="#C85A32" stroke-width="3"/><circle cx="639.2" cy="260.0" r="4" fill="#C85A32"/><circle cx="639.2" cy="411.20000000000005" r="4" fill="#C85A32"/><text x="627.2" y="346.4" font-size="18" font-weight="700" fill="#C85A32" text-anchor="end">42 to 48 in work aisle</text><line x1="639.2" y1="584.0" x2="639.2" y2="774.8000000000001" stroke="#C85A32" stroke-width="3"/><circle cx="639.2" cy="584.0" r="4" fill="#C85A32"/><circle cx="639.2" cy="774.8000000000001" r="4" fill="#C85A32"/><text x="627.2" y="735.2" font-size="18" font-weight="700" fill="#C85A32" text-anchor="end">44 in behind stools</text><line x1="200.0" y1="483.2" x2="351.20000000000005" y2="483.2" stroke="#C85A32" stroke-width="3"/><circle cx="200.0" cy="483.2" r="4" fill="#C85A32"/><circle cx="351.20000000000005" cy="483.2" r="4" fill="#C85A32"/><text x="275.6" y="473.2" font-size="18" font-weight="700" fill="#C85A32" text-anchor="middle">42 in</text><line x1="653.6" y1="483.2" x2="801.2" y2="483.2" stroke="#C85A32" stroke-width="3"/><circle cx="653.6" cy="483.2" r="4" fill="#C85A32"/><circle cx="801.2" cy="483.2" r="4" fill="#C85A32"/><text x="727.4" y="473.2" font-size="18" font-weight="700" fill="#C85A32" text-anchor="middle">36 in+</text><rect x="841.2" y="190" width="298.79999999999995" height="96" rx="14" fill="#fff" stroke="#E6DCCF" stroke-width="2"/><text x="863.2" y="230" font-size="21" font-weight="700" fill="#342E2A">Work aisle</text><text x="863.2" y="262" font-size="17" fill="#C85A32" font-weight="700">42 in for one cook, 48 in for two</text><rect x="841.2" y="302" width="298.79999999999995" height="96" rx="14" fill="#fff" stroke="#E6DCCF" stroke-width="2"/><text x="863.2" y="342" font-size="21" font-weight="700" fill="#342E2A">Walkway</text><text x="863.2" y="374" font-size="17" fill="#C85A32" font-weight="700">at least 36 in</text><rect x="841.2" y="414" width="298.79999999999995" height="96" rx="14" fill="#fff" stroke="#E6DCCF" stroke-width="2"/><text x="863.2" y="454" font-size="21" font-weight="700" fill="#342E2A">Behind stools</text><text x="863.2" y="486" font-size="17" fill="#C85A32" font-weight="700">44 in to walk past</text><rect x="841.2" y="526" width="298.79999999999995" height="96" rx="14" fill="#fff" stroke="#E6DCCF" stroke-width="2"/><text x="863.2" y="566" font-size="21" font-weight="700" fill="#342E2A">Each stool</text><text x="863.2" y="598" font-size="17" fill="#C85A32" font-weight="700">24 in of counter</text><rect x="841.2" y="638" width="298.79999999999995" height="96" rx="14" fill="#fff" stroke="#E6DCCF" stroke-width="2"/><text x="863.2" y="678" font-size="21" font-weight="700" fill="#342E2A">Knee space</text><text x="863.2" y="710" font-size="17" fill="#C85A32" font-weight="700">15 in at 36 in high</text><text x="110" y="818.8000000000001" font-size="18" fill="#6E645C">Example: a 16 x 14 ft kitchen with L-shaped cabinets. Sizes are minimums; more space feels better.</text></svg>