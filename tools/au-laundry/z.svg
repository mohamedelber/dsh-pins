<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" font-family="Poppins, sans-serif" role="img" aria-labelledby="al-t al-d"><title id="al-t">Small laundry layouts in mm</title><desc id="al-d">Top-down plans of three small Australian laundry layouts with typical sizes in millimetres. Layout 1, single wall: a washing machine with a dryer stacked on top in a 625 mm wide space next to a 499 mm tub cabinet, about 1,150 mm of wall, 650 mm deep, with about 900 mm of standing room in front. Layout 2, side by side: washer and dryer under a benchtop next to the tub, about 1,750 mm of wall. Layout 3, galley: machines and tub on one wall, 350 mm deep shelves on the opposite wall and about 900 mm of walkway between, about 1,900 mm wide in total. These are planning guides based on typical appliance sizes, not building rules.</desc><rect width="1200" height="900" fill="#F7F1E9"/><text x="60" y="80" font-size="44" font-weight="700" fill="#342E2A">Small Laundry Layouts in mm</text><text x="60" y="118" font-size="22" fill="#6E645C">Three plans seen from above, with typical Australian sizes</text><text x="1140" y="50" font-size="18" fill="#6E645C" text-anchor="end">dailyspacehacks.com</text><text x="70" y="180" font-size="22" font-weight="700" fill="#342E2A">1. Single wall</text><text x="70" y="204" font-size="15" fill="#6E645C">stacked washer and dryer</text><rect x="70" y="262" width="218.5" height="8" fill="#342E2A"/><rect x="70" y="270" width="118.75" height="123.5" rx="4" fill="#FFFFFF" stroke="#6E645C" stroke-width="2"/><circle cx="129.37" cy="346.57" r="26.12" fill="none" stroke="#6E645C" stroke-width="2"/><text x="129.37" y="290" font-size="14" font-weight="700" fill="#342E2A" text-anchor="middle">W + D</text><text x="129.37" y="385.5" font-size="11" fill="#6E645C" text-anchor="middle">stacked</text><rect x="188.75" y="270" width="94.81" height="119.7" rx="4" fill="#E3ECEF" stroke="#6E645C" stroke-width="2"/><text x="236.15" y="290" font-size="14" font-weight="700" fill="#342E2A" text-anchor="middle">Tub</text><text x="236.15" y="381.7" font-size="11" fill="#6E645C" text-anchor="middle">45 L</text><rect x="70" y="393.5" width="218.5" height="171.0" fill="#DCE5D6" opacity="0.7"/><text x="179.25" y="484.0" font-size="13" fill="#6E645C" text-anchor="middle">standing room</text><line x1="70" y1="248" x2="288.5" y2="248" stroke="#C85A32" stroke-width="2.5"/><line x1="70" y1="241" x2="70" y2="255" stroke="#C85A32" stroke-width="2.5"/><line x1="288.5" y1="241" x2="288.5" y2="255" stroke="#C85A32" stroke-width="2.5"/><text x="179.25" y="240" font-size="15" font-weight="700" fill="#C85A32" text-anchor="middle">~1,150</text><line x1="302.5" y1="270" x2="302.5" y2="393.5" stroke="#C85A32" stroke-width="2.5"/><line x1="295.5" y1="270" x2="309.5" y2="270" stroke="#C85A32" stroke-width="2.5"/><line x1="295.5" y1="393.5" x2="309.5" y2="393.5" stroke="#C85A32" stroke-width="2.5"/><text x="312.5" y="336.75" font-size="14" font-weight="700" fill="#C85A32">650</text><line x1="302.5" y1="393.5" x2="302.5" y2="564.5" stroke="#C85A32" stroke-width="2.5"/><line x1="295.5" y1="393.5" x2="309.5" y2="393.5" stroke="#C85A32" stroke-width="2.5"/><line x1="295.5" y1="564.5" x2="309.5" y2="564.5" stroke="#C85A32" stroke-width="2.5"/><text x="312.5" y="484.0" font-size="14" font-weight="700" fill="#C85A32">900</text><text x="420" y="180" font-size="22" font-weight="700" fill="#342E2A">2. Side by side</text><text x="420" y="204" font-size="15" fill="#6E645C">under one benchtop</text><rect x="420" y="262" width="332.5" height="8" fill="#342E2A"/><rect x="420" y="270" width="332.5" height="123.5" fill="#D9B48A" opacity="0.35"/><rect x="420" y="270" width="118.75" height="123.5" rx="4" fill="#FFFFFF" stroke="#6E645C" stroke-width="2"/><circle cx="479.37" cy="346.57" r="26.12" fill="none" stroke="#6E645C" stroke-width="2"/><text x="479.37" y="290" font-size="14" font-weight="700" fill="#342E2A" text-anchor="middle">W</text><rect x="538.75" y="270" width="118.75" height="123.5" rx="4" fill="#FFFFFF" stroke="#6E645C" stroke-width="2"/><text x="598.12" y="290" font-size="14" font-weight="700" fill="#342E2A" text-anchor="middle">D</text><rect x="657.5" y="270" width="94.81" height="119.7" rx="4" fill="#E3ECEF" stroke="#6E645C" stroke-width="2"/><text x="704.90" y="290" font-size="14" font-weight="700" fill="#342E2A" text-anchor="middle">Tub</text><text x="704.90" y="381.7" font-size="11" fill="#6E645C" text-anchor="middle">45 L</text><rect x="420" y="393.5" width="332.5" height="171.0" fill="#DCE5D6" opacity="0.7"/><text x="586.25" y="484.0" font-size="13" fill="#6E645C" text-anchor="middle">standing room</text><line x1="420" y1="248" x2="752.5" y2="248" stroke="#C85A32" stroke-width="2.5"/><line x1="420" y1="241" x2="420" y2="255" stroke="#C85A32" stroke-width="2.5"/><line x1="752.5" y1="241" x2="752.5" y2="255" stroke="#C85A32" stroke-width="2.5"/><text x="586.25" y="240" font-size="15" font-weight="700" fill="#C85A32" text-anchor="middle">~1,750</text><line x1="766.5" y1="270" x2="766.5" y2="393.5" stroke="#C85A32" stroke-width="2.5"/><line x1="759.5" y1="270" x2="773.5" y2="270" stroke="#C85A32" stroke-width="2.5"/><line x1="759.5" y1="393.5" x2="773.5" y2="393.5" stroke="#C85A32" stroke-width="2.5"/><text x="776.5" y="336.75" font-size="14" font-weight="700" fill="#C85A32">650</text><line x1="766.5" y1="393.5" x2="766.5" y2="564.5" stroke="#C85A32" stroke-width="2.5"/><line x1="759.5" y1="393.5" x2="773.5" y2="393.5" stroke="#C85A32" stroke-width="2.5"/><line x1="759.5" y1="564.5" x2="773.5" y2="564.5" stroke="#C85A32" stroke-width="2.5"/><text x="776.5" y="484.0" font-size="14" font-weight="700" fill="#C85A32">900</text><text x="860" y="180" font-size="22" font-weight="700" fill="#342E2A">3. Galley</text><text x="860" y="204" font-size="15" fill="#6E645C">shelves opposite</text><rect x="860" y="262" width="218.5" height="8" fill="#342E2A"/><rect x="860" y="270" width="118.75" height="123.5" rx="4" fill="#FFFFFF" stroke=