" stroke-width="2.5"/><text x="1102.5" y="602.75" font-size="14" font-weight="700" fill="#C85A32">350</text><text x="1148.5" y="661.0" font-size="15" font-weight="700" fill="#C85A32" text-anchor="end">~1,900 total</text><rect x="60" y="680" width="520" height="128" rx="12" fill="#FFFFFF" stroke="#D8CBBB" stroke-width="2"/><text x="78" y="708" font-size="17" font-weight="700" fill="#342E2A">Typical sizes used</text><text x="78" y="732" font-size="14" fill="#6E645C">Front loader and dryer: about 600 mm wide</text><text x="78" y="754" font-size="14" fill="#6E645C">Space for a machine: allow about 625 mm</text><text x="78" y="776" font-size="14" fill="#6E645C">45 L tub cabinet: about 499 mm wide</text><text x="78" y="798" font-size="14" fill="#6E645C">Slim tubs: 300–310 mm wide</text><rect x="620" y="680" width="520" height="128" rx="12" fill="#FFFFFF" stroke="#D8CBBB" stroke-width="2"/><text x="638" y="708" font-size="17" font-weight="700" fill="#342E2A">Before you build</text><text x="638" y="732" font-size="14" fill="#6E645C">New houses need a tub and washer space</text><text x="638" y="754" font-size="14" fill="#6E645C">Vented dryers must be ducted outside</text><text x="638" y="776" font-size="14" fill="#6E645C">Floor and wall behind taps: water resistant</text><text x="638" y="798" font-size="14" fill="#6E645C">Plumbing and power: licensed trades only</text><text x="60" y="880" font-size="13" fill="#6E645C">Planning guide from typical appliance sizes (Fisher &amp; Paykel, Haier, Clark) and NCC Housing Provisions; not building rules. Measure your own machines.</text></svg>