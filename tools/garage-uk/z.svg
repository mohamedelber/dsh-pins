<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" font-family="Poppins, sans-serif" role="img" aria-labelledby="gg-t gg-d"><title id="gg-t">How much room a UK single garage really has</title><desc id="gg-d">Top-down plan of a typical UK single garage, about 2.4 m wide by 4.9 m long, with a family car about 2 m wide including mirrors and 4.3 m long parked inside. That leaves only about 400 mm of width in total, far less than the 800 to 1000 mm needed on each side to open the doors, so a car and side shelving rarely fit together in a typical single garage. The car also leaves about 600 mm of length, enough for a shallow shelf or wall rack across the back wall. With no car, the whole garage can be used: deep shelving down one side, a workbench at the back and bikes and tools on the other wall, keeping a clear path down the middle.</desc><rect width="1200" height="900" fill="#F7F1E9"/><text x="60" y="80" font-size="42" font-weight="700" fill="#342E2A">Will a Car and Storage Both Fit?</text><text x="60" y="116" font-size="21" fill="#6E645C">Typical UK single garage, about 2.4 x 4.9 m, seen from above (mm)</text><text x="1140" y="30" font-size="18" fill="#6E645C" text-anchor="end">dailyspacehacks.com</text><text x="240.0" y="172" font-size="21" font-weight="700" fill="#342E2A" text-anchor="middle">With a car</text><rect x="120" y="190" width="240.0" height="490.0" fill="#FFFFFF" stroke="#342E2A" stroke-width="4"/><line x1="132" y1="680.0" x2="348.0" y2="680.0" stroke="#FFFFFF" stroke-width="6"/><text x="240.0" y="702.0" font-size="14" fill="#6E645C" text-anchor="middle">garage door</text><rect x="140.0" y="250.0" width="200.0" height="430.0" rx="18" fill="#ECCDA0" stroke="#B98A5E" stroke-width="2"/><text x="240.0" y="465.0" font-size="17" font-weight="700" fill="#342E2A" text-anchor="middle">Car</text><text x="240.0" y="487.0" font-size="14" fill="#342E2A" text-anchor="middle">~2,000 wide</text><text x="240.0" y="505.0" font-size="14" fill="#342E2A" text-anchor="middle">with mirrors</text><rect x="124" y="194" width="232.0" height="52.0" fill="#DCE5D6" stroke="#8FA689" stroke-width="2" stroke-dasharray="5 4"/><text x="80.0" y="400.0" font-size="13" fill="#C85A32">doors</text><path d="M140.0 310.0 A80.0 80.0 0 0 0 84.0 366.0" fill="none" stroke="#C85A32" stroke-width="2.5"/><path d="M340.0 310.0 A80.0 80.0 0 0 1 396.0 366.0" fill="none" stroke="#C85A32" stroke-width="2.5"/><rect x="400.0" y="200" width="330" height="120" rx="12" fill="#FFFFFF" stroke="#D8CBBB" stroke-width="2"/><rect x="400.0" y="200" width="8" height="120" rx="4" fill="#C85A32"/><text x="422.0" y="232" font-size="18" font-weight="700" fill="#342E2A">Only ~400 mm spare</text><text x="422.0" y="260" font-size="15" fill="#6E645C">in total across the width,</text><text x="422.0" y="284" font-size="15" fill="#6E645C">but doors need 800 to</text><text x="422.0" y="308" font-size="15" fill="#6E645C">1,000 mm on each side</text><rect x="400.0" y="340" width="330" height="96" rx="12" fill="#FFFFFF" stroke="#D8CBBB" stroke-width="2"/><rect x="400.0" y="340" width="8" height="96" rx="4" fill="#8FA689"/><text x="422.0" y="372" font-size="18" font-weight="700" fill="#342E2A">~600 mm at the back</text><text x="422.0" y="400" font-size="15" fill="#6E645C">room for one shallow</text><text x="422.0" y="424" font-size="15" fill="#6E645C">shelf or a wall rack</text><text x="880.0" y="172" font-size="21" font-weight="700" fill="#342E2A" text-anchor="middle">Storage only</text><rect x="760" y="190" width="240.0" height="490.0" fill="#FFFFFF" stroke="#342E2A" stroke-width="4"/><line x1="772" y1="680.0" x2="988.0" y2="680.0" stroke="#FFFFFF" stroke-width="6"/><text x="880.0" y="702.0" font-size="14" fill="#6E645C" text-anchor="middle">garage door</text><rect x="764" y="194" width="45.0" height="482.0" fill="#D9B48A" stroke="#B98A5E" stroke-width="2"/><text x="786.5" y="435.0" font-size="13" fill="#342E2A" text-anchor="middle" transform="rotate(-90 786.5 435.0)">shelving 450 deep</text><rect x="809.0" y="194" width="187.0" height="60.0" fill="#ECCDA0" stroke="#B98A5E" stroke-width="2"/><text x="902.5" y="229.0" font-size="13" fill="#342E2A" text-anchor="middle">workbench</text><rect x="966.0" y="254.0" width="30.0" height="422.0" fill="#DCE5D6" stroke="#8FA689" stroke-width="2"/><text x="981.0" y="495.0" font-size="13" fill="#342E2A" text-anchor="middle" transform="rotate(-90 981.0 495.0)">bikes and tools ~300</text><text x="889.0" y="515.0" font-size="14" font-weight="700" fill="#C85A32" text-anchor="middle">~1,600</text><text x="889.0" y="533.0" font-size="13" fill="#C85A32" text-anchor="middle">clear path</text><rect x="400" y="560" width="330" height="120" rx="12" fill="#FFFFFF" stroke="#D8CBBB" stroke-width="2"/><rect x="400" y="560" width="8" height="120" rx="4" fill="#8FA689"/><text x="422" y="592" font-size="18" font-weight="700" fill="#342E2A">No car? Use all of it</text><text x="422" y="620" font-size="15" fill="#6E645C">Deep shelving one side,</text><text x="422" y="644" font-size="15" fill="#6E645C">bikes and tools on the</text><text x="422" y="668" font-size="15" fill="#6E645C">other, bench at the back</text><text x="60" y="842" font-size="14" fill="#6E645C">Sizes: single garage 2.4 x 4.9 m, car about 2 m wide with mirrors, 80 to 100 cm door space each side (Homebuilding).</text><text x="60" y="862" font-size="14" fill="#6E645C">Car length 4.3 m (RAC Foundation). Bike racks take about 30 cm of wall per bike (GaragePride). Measure your own first.</text></svg>