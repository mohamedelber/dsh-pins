<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" font-family="Poppins, sans-serif" role="img" aria-labelledby="bc-t bc-d"><title id="bc-t">Pick a bedroom colour by the light</title><desc id="bc-d">Four cards show how window direction changes bedroom paint colours in the UK. North-facing: cool, bluish light makes colours look darker, so warm shades such as plaster pink, terracotta and warm white work, or go dark on purpose with a deep blue. South-facing: warm, bright light for most of the day, so cool shades such as mint, pale blue and cool white stay fresh. East-facing: bright morning light that turns cooler later. West-facing: cooler mornings and warm evening light; for both, judge colours at the times you use the room. Below, a light reflectance value scale from 0 (black, absorbs light) to 100 (white, reflects light), and the 60-30-10 rule: 60 percent main colour on the walls, 30 percent secondary colour on bedding, curtains or furniture, 10 percent accent in cushions, throws and art.</desc><rect width="1200" height="900" fill="#F7F1E9"/><text x="60" y="78" font-size="40" font-weight="700" fill="#342E2A">Pick a Bedroom Colour by the Light</text><text x="60" y="114" font-size="21" fill="#6E645C">Which way your window faces changes how the same paint looks</text><text x="1140" y="30" font-size="18" fill="#6E645C" text-anchor="end">dailyspacehacks.com</text><rect x="60" y="150" width="530" height="235" rx="16" fill="#FFFFFF" stroke="#D8CBBB" stroke-width="2"/><circle cx="104" cy="194" r="26" fill="#C85A32"/><text x="104" y="203" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle">N</text><text x="146" y="190" font-size="22" font-weight="700" fill="#342E2A">North-facing window</text><text x="146" y="216" font-size="15" fill="#6E645C">Cool, bluish light all day:</text><text x="146" y="236" font-size="15" fill="#6E645C">colours look darker and greyer</text><text x="84" y="272" font-size="16" font-weight="700" fill="#C85A32">Go warm</text><rect x="84" y="284" width="146" height="54" rx="8" fill="#D9B6A2" stroke="#D8CBBB"/><text x="157" y="358" font-size="14" fill="#342E2A" text-anchor="middle">plaster pink</text><rect x="244" y="284" width="146" height="54" rx="8" fill="#B0624A" stroke="#D8CBBB"/><text x="317" y="358" font-size="14" fill="#342E2A" text-anchor="middle">terracotta</text><rect x="404" y="284" width="146" height="54" rx="8" fill="#EFE5D8" stroke="#D8CBBB"/><text x="477" y="358" font-size="14" fill="#342E2A" text-anchor="middle">warm white</text><text x="570" y="376" font-size="13" font-style="italic" fill="#6E645C" text-anchor="end">or go dark on purpose: deep blue</text><rect x="610" y="150" width="530" height="235" rx="16" fill="#FFFFFF" stroke="#D8CBBB" stroke-width="2"/><circle cx="654" cy="194" r="26" fill="#C85A32"/><text x="654" y="203" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle">S</text><text x="696" y="190" font-size="22" font-weight="700" fill="#342E2A">South-facing window</text><text x="696" y="216" font-size="15" fill="#6E645C">Warm, bright light most of</text><text x="696" y="236" font-size="15" fill="#6E645C">the day: colours look warmer</text><text x="634" y="272" font-size="16" font-weight="700" fill="#C85A32">Cool shades stay fresh</text><rect x="634" y="284" width="146" height="54" rx="8" fill="#C4DCCB" stroke="#D8CBBB"/><text x="707" y="358" font-size="14" fill="#342E2A" text-anchor="middle">mint</text><rect x="794" y="284" width="146" height="54" rx="8" fill="#C4D3DF" stroke="#D8CBBB"/><text x="867" y="358" font-size="14" fill="#342E2A" text-anchor="middle">pale blue</text><rect x="954" y="284" width="146" height="54" rx="8" fill="#F2F4F1" stroke="#D8CBBB"/><text x="1027" y="358" font-size="14" fill="#342E2A" text-anchor="middle">cool white</text><text x="1120" y="376" font-size="13" font-style="italic" fill="#6E645C" text-anchor="end">strong sun can wash out pale tones</text><rect x="60" y="405" width="530" height="235" rx="16" fill="#FFFFFF" stroke="#D8CBBB" stroke-width="2"/><circle cx="104" cy="449" r="26" fill="#C85A32"/><text x="104" y="458" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle">E</text><text x="146" y="445" font-size="22" font-weight="700" fill="#342E2A">East-facing window</text><text x="146" y="471" font-size="15" fill="#6E645C">Bright, warm light in the</text><text x="146" y="491" font-size="15" fill="#6E645C">morning, cooler after midday</text><text x="84" y="527" font-size="16" font-weight="700" fill="#C85A32">Test at the hours you use it</text><rect x="84" y="539" width="146" height="54" rx="8" fill="#A9B59B" stroke="#D8CBBB"/><text x="157" y="613" font-size="14" fill="#342E2A" text-anchor="middle">sage</text><rect x="244" y="539" width="146" height="54" rx="8" fill="#CDBDA6" stroke="#D8CBBB"/><text x="317" y="613" font-size="14" fill="#342E2A" text-anchor="middle">stone</text><rect x="404" y="539" width="146" height="54" rx="8" fill="#AFC0CC" stroke="#D8CBBB"/><text x="477" y="613" font-size="14" fill="#342E2A" text-anchor="middle">soft blue</text><text x="570" y="631" font-size="13" font-style="italic" fill="#6E645C" text-anchor="end">in a bedroom, mornings and night</text><rect x="610" y="405" width="530" height="235" rx="16" fill="#FFFFFF" stroke="#D8CBBB" stroke-width="2"/><circle cx="654" cy="449" r="26" fill="#C85A32"/><text x="654" y="458" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle">W</text><text x="696" y="445" font-size="22" font-weight="700" fill="#342E2A">West-facing window</text><text x="696" y="471" font-size="15" fill="#6E645C">Cooler mornings, then warm</text><text x="696" y="491" font-size="15" fill="#6E645C">golden light in the evening</text><text x="634" y="527" font-size="16" font-weight="700" fill="#C85A32">Test at the hours you use it</text><rect x="634" y="539" width="146" height="54" rx="8" fill="#EDE2D2" stroke="#D8CBBB"/><text x="707" y="613" font-size="14" fill="#342E2A" text-anchor="middle">warm white</text><rect x="794" y="539" width="146" height="54" rx="8" fill="#D9B6A2" stroke="#D8CBBB"/><text x="867" y="613" font-size="14" fill="#342E2A" text-anchor="middle">plaster pink</text><rect x="954" y="539" width="146" height="54" rx="8" fill="#7E8457" stroke="#D8CBBB"/><text x="1027" y="613" font-size="14" fill="#342E2A" text-anchor="middle">olive</text><text x="1120" y="631" font-size="13" font-style="italic" fill="#6E645C" text-anchor="end">check under your lamps too</text><text x="60" y="676" font-size="19" font-weight="700" fill="#342E2A">Light reflectance value (LRV)</text><defs><linearGradient id="lrv"><stop offset="0" stop-color="#1E1E1E"/><stop offset="1" stop-color="#FFFFFF"/></linearGradient></defs><rect x="60" y="690" width="520" height="36" rx="8" fill="url(#lrv)" stroke="#D8CBBB"/><text x="60" y="748" font-size="14" font-weight="700" fill="#342E2A">0 = black</text><text x="580" y="748" font-size="14" font-weight="700" fill="#342E2A" text-anchor="end">100 = white</text><text x="60" y="772" font-size="14" fill="#6E645C">Low: absorbs light, feels cosy</text><text x="580" y="772" font-size="14" fill="#6E645C" text-anchor="end">High: reflects the light you have</text><text x="640" y="676" font-size="19" font-weight="700" fill="#342E2A">The 60-30-10 rule</text><rect x="640" y="690" width="300.0" height="36" fill="#A9B59B" stroke="#D8CBBB"/><text x="790.0" y="714" font-size="14" font-weight="700" fill="#342E2A" text-anchor="middle">60% walls</text><rect x="940.0" y="690" width="150.0" height="36" fill="#EFE5D8" stroke="#D8CBBB"/><text x="1015.0" y="714" font-size="14" font-weight="700" fill="#342E2A" text-anchor="middle">30% fabrics</text><rect x="1090.0" y="690" width="50.0" height="36" fill="#B0624A" stroke="#D8CBBB"/><text x="1115.0" y="714" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">10%</text><text x="640" y="748" font-size="14" fill="#6E645C">Main colour on the walls, a second colour in fabrics or</text><text x="640" y="770" font-size="14" fill="#6E645C">furniture, and a 10% accent in cushions, throws and art</text><text x="60" y="846" font-size="14" fill="#6E645C">Swatches are approximate screen colours, not paint matches: always test a real sample. Sources: Dulux, Dulux Heritage, Farrow &amp; Ball, Little Greene</text><text x="60" y="868" font-size="14" fill="#6E645C">and Lick experts via Homes &amp; Gardens, Livingetc and Ideal Home. Light direction is for the UK and other northern-hemisphere homes.</text></svg>