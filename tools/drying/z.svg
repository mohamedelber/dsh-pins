<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" font-family="Poppins, sans-serif" role="img" aria-labelledby="dr-t dr-d"><title id="dr-t">Cost to dry one load indoors</title><desc id="dr-d">Estimated cost to dry one load of washing indoors. Airer by an open window: about 0p; Heat pump tumble dryer: about 35p; Heated airer, 6 h: about 47p; Dehumidifier: about 52p; Condenser tumble dryer: about 89p. The heated airer cost is our estimate from its wattage and 6 hours; tumble dryer and dehumidifier costs are Which? figures.</desc><rect width="1200" height="900" fill="#F7F1E9"/><text x="60" y="80" font-size="42" font-weight="700" fill="#342E2A">What It Costs to Dry One Load</text><text x="60" y="116" font-size="21" fill="#6E645C">Heated airer at 26.32p per kWh; other figures from Which?</text><text x="1140" y="30" font-size="18" fill="#6E645C" text-anchor="end">dailyspacehacks.com</text><text x="454" y="196" font-size="19" font-weight="700" fill="#342E2A" text-anchor="end">Airer by an open window</text><text x="454" y="220" font-size="14" fill="#6E645C" text-anchor="end">no power, slowest</text><rect x="470" y="180" width="6.0" height="34" rx="8" fill="#8FA689"/><text x="488.0" y="205" font-size="20" font-weight="700" fill="#342E2A">0p</text><text x="454" y="306" font-size="19" font-weight="700" fill="#342E2A" text-anchor="end">Heat pump tumble dryer</text><text x="454" y="330" font-size="14" fill="#6E645C" text-anchor="end">Which? per load</text><rect x="470" y="290" width="206.3" height="34" rx="8" fill="#ECCDA0"/><text x="688.3" y="315" font-size="20" font-weight="700" fill="#342E2A">~35p</text><text x="454" y="416" font-size="19" font-weight="700" fill="#342E2A" text-anchor="end">Heated airer, 6 h</text><text x="454" y="440" font-size="14" fill="#6E645C" text-anchor="end">300 W, our estimate</text><rect x="470" y="400" width="279.3" height="34" rx="8" fill="#ECCDA0"/><text x="761.3" y="425" font-size="20" font-weight="700" fill="#342E2A">~47p</text><text x="454" y="526" font-size="19" font-weight="700" fill="#342E2A" text-anchor="end">Dehumidifier</text><text x="454" y="550" font-size="14" fill="#6E645C" text-anchor="end">Which?: 26p per litre, ~2 litres a load</text><rect x="470" y="510" width="306.5" height="34" rx="8" fill="#ECCDA0"/><text x="788.5" y="535" font-size="20" font-weight="700" fill="#342E2A">~52p</text><text x="454" y="636" font-size="19" font-weight="700" fill="#342E2A" text-anchor="end">Condenser tumble dryer</text><text x="454" y="660" font-size="14" fill="#6E645C" text-anchor="end">Which? per load</text><rect x="470" y="620" width="524.6" height="34" rx="8" fill="#ECCDA0"/><text x="1006.6" y="645" font-size="20" font-weight="700" fill="#342E2A">~89p</text><text x="60" y="800" font-size="15" fill="#6E645C">Heated airer figure is our estimate: 300 W x 6 hours x 26.32p. Drying times vary with the load, room and weather.</text><text x="60" y="824" font-size="15" fill="#6E645C">Tumble dryer and dehumidifier figures from Which?; heated airer wattage from Dunelm.</text></svg>