<rect x="60" y="640" width="340" height="170" rx="14" fill="#FFFFFF" stroke="#D8CBBB" stroke-width="2"/>
<text x="84" y="686" font-size="25" font-weight="700" fill="#342E2A">1  Rainbow</text>
<text x="84" y="728" font-size="19" fill="#6E645C">Neutrals at both ends,</text>
<text x="84" y="756" font-size="19" fill="#6E645C">colors in rainbow order.</text>
<text x="84" y="784" font-size="19" fill="#6E645C">Best for colorful wardrobes.</text>
<rect x="430" y="640" width="340" height="170" rx="14" fill="#FFFFFF" stroke="#D8CBBB" stroke-width="2"/>
<text x="454" y="686" font-size="25" font-weight="700" fill="#342E2A">2  Light to dark</text>
<text x="454" y="728" font-size="19" fill="#6E645C">One smooth gradient.</text>
<text x="454" y="756" font-size="19" fill="#6E645C">Reverse it for the KonMari</text>
<text x="454" y="784" font-size="19" fill="#6E645C">look: lighter to the right.</text>
<rect x="800" y="640" width="340" height="170" rx="14" fill="#FFFFFF" stroke="#D8CBBB" stroke-width="2"/>
<text x="824" y="686" font-size="25" font-weight="700" fill="#C85A32">3  Category first</text>
<text x="824" y="728" font-size="19" fill="#6E645C">Tops, pants, dresses,</text>
<text x="824" y="756" font-size="19" fill="#6E645C">then color inside each</text>
<text x="824" y="784" font-size="19" fill="#6E645C">group. Easiest to keep.</text>
<text x="60" y="868" font-size="16" fill="#6E645C">Rainbow order follows the visible spectrum (IAU Office of Astronomy for Education). Light-to-dark tip: KonMari.</text>
</svg>