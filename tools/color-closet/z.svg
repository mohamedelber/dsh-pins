<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" font-family="Poppins, sans-serif" role="img" aria-labelledby="cc-t cc-d"><title id="cc-t">Color coded closet order</title><desc id="cc-d">Recommended color coded closet order on one hanging rail, left to right: White, Cream, Beige, Pink, Red, Orange, Yellow, Green, Blue, Navy, Purple, Grey, Brown, Black. Three ways to use it: rainbow order with neutrals at both ends; light to dark, which matches the KonMari advice that colors get lighter from left to right if reversed; and category first, then color inside each category.</desc>
<rect width="1200" height="900" fill="#F7F1E9"/>
<text x="60" y="88" font-size="44" font-weight="700" fill="#342E2A">The Color Coded Closet Order</text>
<text x="60" y="128" font-size="22" fill="#6E645C">Hang from left to right: light neutrals, the rainbow, dark neutrals</text>
<text x="1140" y="60" font-size="18" fill="#6E645C" text-anchor="end">dailyspacehacks.com</text>
