<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" font-family="Poppins, sans-serif" role="img" aria-labelledby="wc-t wc-d"><title id="wc-t">Walk-in closet sizes by layout</title><desc id="wc-d">Five top-down walk-in closet plans with their smallest comfortable sizes. Each side of hanging clothes needs about 24 inches of depth and the walkway needs about 36 inches, or 24 inches if tight. One wall: 5 feet wide. Two facing walls: 7 feet wide. L-shape: about 5 by 5 feet. U-shape: 7 feet wide. U-shape with a center island: about 12 by 12 feet.</desc><rect width="1200" height="900" fill="#F7F1E9"/><text x="60" y="84" font-size="44" font-weight="700" fill="#342E2A">Walk-In Closet Sizes by Layout</text><text x="60" y="124" font-size="22" fill="#6E645C">24 in for hanging clothes on each side + a 36 in walkway</text><text x="1140" y="60" font-size="18" fill="#6E645C" text-anchor="end">dailyspacehacks.com</text><rect x="130.0" y="185" width="120.0" height="164.0" fill="#B98A5E"/><rect x="135.0" y="190" width="110.0" height="154.0" fill="#FBF8F3"/><rect x="135.0" y="190" width="44.0" height="154.0" fill="#CFDDCB" stroke="#8FA689" stroke-width="2"/><rect x="184.5" y="343.0" width="55.0" height="7" fill="#F7F1E9"/><text x="212.0" y="366.0" font-size="14" fill="#6E645C" text-anchor="middle">door</text><line x1="182.0" y1="285.48" x2="242.0" y2="285.48" stroke="#C85A32" stroke-width="2.5"/><path d="M182.0 285.48 l9 -6 v12 z M242.0 285.48 l-9 -6 v12 z" fill="#C85A32"/><text x="212.0" y="276.48" font-size="14" font-weight="700" fill="#C85A32" text-anchor="middle">36 in</text><text x="157.0" y="236.2" font-size="12" fill="#3F5E39" text-anchor="middle" transform="rotate(-90 157.0 236.2)">24 in</text><text x="190" y="396.0" font-size="22" font-weight="700" fill="#342E2A" text-anchor="middle">One wall</text><text x="190" y="424.0" font-size="19" fill="#C85A32" font-weight="700" text-anchor="middle">5 ft wide</text><rect x="438.0" y="185" width="164.0" height="164.0" fill="#B