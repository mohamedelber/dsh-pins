<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" font-family="Poppins, sans-serif" role="img" aria-labelledby="cb-t cb-d"><title id="cb-t">Cosy small bedroom plan</title><desc id="cb-d">Top-down plan of a small UK double bedroom about 3.7 by 3.6 metres. A 135 cm double bed sits against the inside wall with a 245 cm wide rug under it, so about 55 cm of rug shows on each side, inside the 45 to 60 cm a Laura Ashley designer recommends. Warm white 2700 to 3000K lamps on both bedside tables. The radiator under the window is left uncovered and curtains stop clear of it. The wardrobe stands on an internal wall to reduce condensation. Aim for a bedroom temperature of about 16 to 18 degrees C.</desc><rect width="1200" height="900" fill="#F7F1E9"/><text x="60" y="80" font-size="42" font-weight="700" fill="#342E2A">A Cosy Small Bedroom, Measured</text><text x="60" y="116" font-size="21" fill="#6E645C">Example UK double bedroom, about 3.7 x 3.6 m, seen from above</text><text x="1140" y="30" font-size="18" fill="#6E645C" text-anchor="end">dailyspacehacks.com</text><rect x="90" y="170" width="481.0" height="468.0" fill="#FFFFFF" stroke="#342E2A" stroke-width="5"/><rect x="207.0" y="633.0" width="182.0" height="10" fill="#BFD4E0" stroke="#342E2A" stroke-width="2"/><rect x="220.0" y="612.0" width="156.0" height="12" fill="#FFFFFF" stroke="#C85A32" stroke-width="2"/><text x="298.0" y="604.0" font-size="12" fill="#C85A32" text-anchor="middle">radiator kept clear</text><rect x="194.0" y="624.0" width="16.900000000000002" height="10" fill="#8FA689"/><rect x="389.0" y="624.0" width="16.900000000000002" height="10" fill="#8FA689"/><rect x="171.25" y="287.0" width="318.5" height="279.5" fill="#ECCDA0" opacity="0.7" stroke="#B98A5E" stroke-width="2" stroke-dasharray="6 4"/><rect x="242.75" y="170.0" width="175.5" height="247.0" rx="8" fill="#F3ECE2" stroke="#342E2A" stroke-width="2"/><rect x="250.75" y="178.0" width="159.5" height="34" rx="6" fill="#FFFFFF" stroke="#D8CBBB"/><text x="330.5" y="301.5" font-size="15" font-weight="700" fill="#342E2A" text-anchor="middle">Bed 135 x 190</text><line x1="171.25" y1="365.0" x2="242.75" y2="365.0" stroke="#C85A32" stroke-width="2"/><text x="207.0" y="357.0" font-size="13" font-weight="700" fill="#C85A32" text-anchor="middle">55 cm</text><line x1="418.25" y1="365.0" x2="489.75" y2="365.0" stroke="#C85A32" stroke-width="2"/><text x="454.0" y="357.0" font-size="13" font-weight="700" fill="#C85A32" text-anchor="middle">55 cm</text><rect x="184.25" y="173.9" width="54.6" height="52.0" fill="#D9B48A" stroke="#B98A5E" stroke-width="2"/><circle cx="211.55" cy="199.9" r="11" fill="#FFE6B0" stroke="#C85A32" stroke-width="2"/><rect x="422.15000000000003" y="173.9" width="54.6" height="52.0" fill="#D9B48A" stroke="#B98A5E" stroke-width="2"/><circle cx="449.45" cy="199.9" r="11" fill="#FFE6B0" stroke="#C85A32" stroke-width="2"/><rect x="93.0" y="339.0" width="71.5" height="156.0" fill="#D9B48A" stroke="#B98A5E" stroke-width="2"/><text x="125.75" y="417.0" font-size="12" fill="#342E2A" text-anchor="middle" transform="rotate(-90 125.75 417.0)">wardrobe, inside wall</text><text x="330.5" y="666.0" font-size="13" fill="#6E645C" text-anchor="middle">window on outside wall</text><rect x="610" y="160" width="530" height="100" rx="12" fill="#FFFFFF" stroke="#D8CBBB" stroke-width="2"/><rect x="610" y="160" width="8" height="100" rx="4" fill="#C85A32"/><text x="634" y="192" font-size="19" font-weight="700" fill="#342E2A">Temperature: about 16 to 18°C</text><text x="634" y="220" font-size="15" fill="#6E645C">The Sleep Charity’s ideal range for a bedroom</text><rect x="610" y="276" width="530" height="100" rx="12" fill="#FFFFFF" stroke="#D8CBBB" stroke-width="2"/><rect x="610" y="276" width="8" height="100" rx="4" fill="#E8B04A"/><text x="634" y="308" font-size="19" font-weight="700" fill="#342E2A">Light: warm white 2700 to 3000K</text><text x="634" y="336" font-size="15" fill="#6E645C">Two low lamps instead of one bright ceiling light</text><rect x="610" y="392" width="530" height="124" rx="12" fill="#FFFFFF" stroke="#D8CBBB" stroke-width="2"/><rect x="610" y="392" width="8" height="124" rx="4" fill="#ECCDA0"/><text x="634" y="424" font-size="19" font-weight="700" fill="#342E2A">Rug: 45 to 60 cm showing</text><text x="634" y="452" font-size="15" fill="#6E645C">Laura Ashley’s design head; a 245 cm rug</text><text x="634" y="475" font-size="15" fill="#6E645C">under a 135 cm double gives about 55 cm</text><rect x="610" y="532" width="530" height="124" rx="12" fill="#FFFFFF" stroke="#D8CBBB" stroke-width="2"/><rect x="610" y="532" width="8" height="124" rx="4" fill="#8FA689"/><text x="634" y="564" font-size="19" font-weight="700" fill="#342E2A">Window: curtains, not radiator</text><text x="634" y="592" font-size="15" fill="#6E645C">Close curtains at night, but keep the</text><text x="634" y="615" font-size="15" fill="#6E645C">radiator uncovered (Energy Saving Trust)</text><rect x="610" y="672" width="530" height="100" rx="12" fill="#FFFFFF" stroke="#D8CBBB" stroke-width="2"/><rect x="610" y="672" width="8" height="100" rx="4" fill="#B98A5E"/><text x="634" y="704" font-size="19" font-weight="700" fill="#342E2A">Damp: wardrobe on an inside wall</text><text x="634" y="732" font-size="15" fill="#6E645C">Advice from Tandridge District Council</text><text x="60" y="860" font-size="14" fill="#6E645C">Example plan only. Rug width from Ruggable UK size guide; measure your own room before buying.</text></svg>