<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" font-family="Poppins, sans-serif" role="img" aria-labelledby="mc-t mc-d"><title id="mc-t">Garage man cave zone plan</title><desc id="mc-d">Top-down floor plan of an example two-car garage, 20 by 20 feet, turned into a man cave with five zones. A, lounge with a sofa on a rug facing a TV on the right wall. B, bar counter with two stools along the left wall. C, game table in the middle left. D, storage wall with a workbench and closed cabinets along the back wall. E, a clear 36 inch path from the house door to the lounge. A carbon monoxide alarm sits near the door to the house, outlets along the workbench are GFCI protected, and the insulated garage door is at the front.</desc>
