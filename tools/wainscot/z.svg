<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" font-family="Poppins, sans-serif" role="img" aria-labelledby="ws-t ws-d"><title id="ws-t">Wainscoting layout guide</title><desc id="ws-d">Front view of a 10 ft (120 in) wall with picture frame wainscoting 32 in high, a third of an 8 ft wall: four moulding boxes 26 1/4 in wide and 18 in tall, with 3 in gaps between the boxes, at the corners, under the chair rail and above the baseboard. A card shows the box width formula, the panel width formula for stiles and rails, and common wainscot heights.</desc><rect width="1200" height="900" fill="#F7F1E9"/><text x="60" y="84" font-size="44" font-weight="700" fill="#342E2A">Wainscoting Layout</text><text x="60" y="124" font-size="22" fill="#6E645C">Equal boxes, equal gaps, a third of the wall</text><text x="1140" y="60" font-size="18" fill="#6E645C" text-anchor="end">dailyspacehacks.com</text><rect x="70" y="211.20000000000005" width="636.0" height="508.79999999999995" fill="#FBF8F3" stroke="#342E2A" stroke-width="3"/><rect x="70" y="550.4" width="636.0" height="169.6" fill="#DCE6D8"/><rect x="70" y="690.85" width="636.0" height="29.15" fill="#B9CBB3" stroke="#8FA689" stroke-width="1.5"/><rect x="64" y="550.4" width="648.0" height="13.25" fill="#8FA689"/><rect x="85.9" y="579.55" width="139.125" height="95.39999999999999" fill="none" stroke="#5E7A57" stroke-width="5"/><rect x="240.92499999999998" y="579.55" width="139.125" height="95.39999999999999" fill="none" stroke="#5E7A57" stroke-width="5"/><rect x="395.95" y="579.55" width="139.125" height="95.39999999999999" fill="none" stroke="#5E7A57" stroke-width="5"/><rect x="550.9749999999999" y="579.55" width="139.125" height="95.39999999999999" fill="none" stroke="#5E7A57" stroke-width="5"/><line x1="50" y1="720" x2="726.0" y2="720" stroke="#B98A5E" stroke-width="6"/><line x1="225.025" y1="579.55" x2="225.025" y2="490.4" stroke="#C85A32" stroke-width="1.5" stroke-dasharray="5 4"/><line x1="240.92499999999998" y1="579.55" x2="240.92499999999998" y2="490.4" stroke="#C85A32" stroke-width="1.5" stroke-dasharray="5 4"/><text x="232.975" y="480.4" font-size="20" font-weight="700" fill="#C85A32" text-anchor="middle">3 in gap</text><line x1="85.9" y1="750" x2="225.025" y2="750" stroke="#C85A32" stroke-width="3"/><line x1="85.9" y1="740" x2="85.9" y2="760" stroke="#C85A32" stroke-width="3"/><line x1="225.025" y1="740" x2="225.025" y2="760" stroke="#C85A32" stroke-width="3"/><text x="155.4625" y="780" font-size="19" font-weight="700" fill="#C85A32" text-anchor="middle">box 26 1/4 in</text><text x="155.46249999999998" y="634.25" font-size="18" font-weight="700" fill="#3F5E39" text-anchor="middle">18 in tall</text><line x1="740.0" y1="550.4" x2="740.0" y2="720" stroke="#342E2A" stroke-width="3"/><line x1="730.0" y1="550.4" x2="750.0" y2="550.4" stroke="#342E2A" stroke-width="3"/><line x1="730.0" y1="720" x2="750.0" y2="720" stroke="#342E2A" stroke-width="3"/><text x="728.0" y="635.2" font-size="18" font-weight="700" fill="#342E2A" text-anchor="middle" transform="rotate(-90 728.0 635.2)">32 in</text><text x="694.0" y="536.4" font-size="20" font-weight="700" fill="#3F5E39" text-anchor="end">chair rail at 1/3 of an 8 ft wall</text><text x="388.0" y="820" font-size="20" font-weight="700" fill="#342E2A" text-anchor="middle">10 ft wall: 4 boxes, 5 gaps</text><rect x="800" y="170" width="350" height="650" rx="18" fill="#fff" stroke="#E6DCCF" stroke-width="2"/><text x="824" y="214" font-size="21" font-weight="700" fill="#342E2A">Picture frame boxes</text><text x="824" y="250" font-size="17" font-weight="700" fill="#C85A32" xml:space="preserve">Box width = (wall</text><text x="824" y="276" font-size="17" font-weight="700" fill="#C85A32" xml:space="preserve">  − (boxes + 1) × gap)</text><text x="824" y="302" font-size="17" font-weight="700" fill="#C85A32" xml:space="preserve">  ÷ boxes</text><text x="824" y="340" font-size="15" fill="#342E2A">(120 − 5 × 3) ÷ 4 = 26 1/4 in</text><text x="824" y="396" font-size="21" font-weight="700" fill="#342E2A">Raised or flat panels</text><text x="824" y="432" font-size="17" font-weight="700" fill="#C85A32" xml:space="preserve">Panel width = (wall</text><text x="824" y="458" font-size="17" font-weight="700" fill="#C85A32" xml:space="preserve">  − (panels + 1) × stile)</text><text x="824" y="484" font-size="17" font-weight="700" fill="#C85A32" xml:space="preserve">  ÷ panels</text><text x="824" y="522" font-size="15" fill="#342E2A">1x4 stiles (3 1/2 in), one more</text><text x="824" y="544" font-size="15" fill="#342E2A">stile than panels</text><text x="824" y="600" font-size="21" font-weight="700" fill="#342E2A">Height</text><rect x="812" y="614" width="326" height="38" rx="9" fill="#CFDDCB" fill-opacity="0.5"/><text x="824" y="640" font-size="17" fill="#342E2A">8 ft ceiling</text><text x="1126" y="640" font-size="17" font-weight="700" fill="#3F5E39" text-anchor="end">32 in</text><text x="824" y="680" font-size="17" fill="#342E2A">9 ft ceiling</text><text x="1126" y="680" font-size="17" font-weight="700" fill="#3F5E39" text-anchor="end">36 in</text><rect x="812" y="694" width="326" height="38" rx="9" fill="#CFDDCB" fill-opacity="0.5"/><text x="824" y="720" font-size="17" fill="#342E2A">Tall</text><text x="1126" y="720" font-size="17" font-weight="700" fill="#3F5E39" text-anchor="end">about 2/3</text><text x="824" y="760" font-size="17" fill="#342E2A">Avoid</text><text x="1126" y="760" font-size="17" font-weight="700" fill="#3F5E39" text-anchor="end">halfway</text><text x="824" y="802" font-size="14" fill="#6E645C">Add 10% extra moulding for mitres</text></svg>