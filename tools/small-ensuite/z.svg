<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" font-family="Poppins, sans-serif" role="img" aria-labelledby="se-t se-d"><title id="se-t">A small ensuite, measured</title><desc id="se-d">Plan of an example small ensuite 1.8 by 2.0 metres (3.6 square metres). A 900 by 900 mm shower with a frameless screen sits in one corner, a 600 mm wide by 460 mm deep wall-hung vanity beside it, and the toilet on the side wall. Because there is less than 1.2 m between the toilet pan and the doorway, the door is a 720 mm cavity slider, as the NCC requires a sliding, outward-opening or readily removable door in that case. Right: the rules that apply in Australia: shower walls waterproofed to at least 1800 mm, the whole shower floor waterproofed, the wall behind a vanity water resistant 150 mm above the basin where the basin is within 75 mm of the wall, a 25 litre per second exhaust fan ducted outside, no switches in the electrical zones closest to water, and licensed trades for plumbing, electrical and, in some states, waterproofing.</desc><rect width="1200" height="900" fill="#F7F1E9"/><text x="60" y="80" font-size="42" font-weight="700" fill="#342E2A">A Small Ensuite, Measured</text><text x="60" y="116" font-size="21" fill="#6E645C">An example 1.8 x 2.0 m layout and the Australian rules behind it</text><text x="1140" y="30" font-size="18" fill="#6E645C" text-anchor="end">dailyspacehacks.com</text><rect x="130" y="175" width="486.00000000000006" height="540.0" fill="#FBF7F0" stroke="#342E2A" stroke-width="8"/><rect x="130.0" y="175.0" width="243.00000000000003" height="243.00000000000003" fill="#DCE5D6"/><line x1="373.0" y1="175.0" x2="373.0" y2="364.0" stroke="#7FA9C2" stroke-width="5"/><line x1="130.0" y1="418.0" x2="373.0" y2="418.0" stroke="#6E645C" stroke-width="2" stroke-dasharray="6 5"/><text x="251.5" y="290.5" font-size="16" font-weight="700" fill="#342E2A" text-anchor="middle">Shower</text><text x="251.5" y="312.5" font-size="14" fill="#342E2A" text-anchor="middle">900 x 900 mm</text><rect x="170.5" y="175.0" width="162.0" height="10" fill="#9FC0A0"/><text x="251.5" y="205.0" font-size="12" fill="#6E645C" text-anchor="middle">niche</text><rect x="400.0" y="175.0" width="162.0" height="124.2" fill="#C9A06B"/><ellipse cx="481.0" cy="237.1" rx="54.0" ry="37.800000000000004" fill="#FFFFFF"/><text x="481.0" y="321.2" font-size="14" fill="#342E2A" text-anchor="middle">vanity 600 x 460</text><rect x="562.0" y="485.5" width="54.0" height="108.0" fill="#E8E8E8" stroke="#6E645C"/><ellipse cx="497.2" cy="539.5" rx="70.2" ry="48.6" fill="#FFFFFF" stroke="#6E645C" stroke-width="2"/><text x="494.5" y="473.5" font-size="14" fill="#342E2A" text-anchor="middle">toilet</text><rect x="400.0" y="711.0" width="194.4" height="8" fill="#FBF7F0"/><rect x="201.6" y="721.0" width="194.4" height="8" fill="#B0B0B0"/><line x1="400.0" y1="725.0" x2="205.6" y2="725.0" stroke="#C85A32" stroke-width="2" marker-end="url(#ar)"/><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8z" fill="#C85A32"/></marker></defs><text x="497.2" y="755.0" font-size="14" font-weight="700" fill="#C85A32" text-anchor="middle">720 mm cavity slider</text><line x1="475.6" y1="593.5" x2="475.6" y2="711.0" stroke="#C85A32" stroke-width="2" stroke-dasharray="4 4"/><text x="465.6" y="663.5" font-size="13" font-weight="700" fill="#C85A32" text-anchor="end">under 1.2 m</text><text x="465.6" y="681.5" font-size="13" fill="#C85A32" text-anchor="end">to the door</text><line x1="130" y1="151" x2="616.0" y2="151" stroke="#342E2A" stroke-width="2"/><text x="373.0" y="143" font-size="15" font-weight="700" fill="#342E2A" text-anchor="middle">1.8 m</text><line x1="106" y1="175" x2="106" y2="715.0" stroke="#342E2A" stroke-width="2"/><text x="98" y="445.0" font-size="15" font-weight="700" fill="#342E2A" text-anchor="middle" transform="rotate(-90 98 445.0)">2.0 m</text><text x="130" y="795.0" font-size="15" font-weight="700" fill="#342E2A">3.6 m²: within the 3 to 5 m² most Australian ensuites take</text><rect x="720" y="150" width="420" height="560" rx="16" fill="#FFFFFF" stroke="#D8CBBB" stroke-width="2"/><text x="742" y="192" font-size="18" font-weight="700" fill="#C85A32">Waterproofing (NCC Part 10.2)</text><text x="742" y="220" font-size="14.5" fill="#342E2A" xml:space="preserve">• Shower walls: at least 1800 mm up</text><text x="742" y="245" font-size="14.5" fill="#342E2A" xml:space="preserve">• The whole shower floor, including any hob</text><text x="742" y="270" font-size="14.5" fill="#342E2A" xml:space="preserve">• No screen? Waterstop 1500 mm from the rose</text><text x="742" y="295" font-size="14.5" fill="#342E2A" xml:space="preserve">• Basin near a wall: 150 mm above it</text><text x="742" y="334" font-size="18" font-weight="700" fill="#C85A32">Air and electrics</text><text x="742" y="362" font-size="14.5" fill="#342E2A" xml:space="preserve">• Exhaust fan: 25 L/s, ducted outside</text><text x="742" y="387" font-size="14.5" fill="#342E2A" xml:space="preserve">• Not naturally ventilated? 10-min run-on</text><text x="742" y="412" font-size="14.5" fill="#342E2A" xml:space="preserve">• No switches in zones 0 and 1;</text><text x="742" y="437" font-size="14.5" fill="#342E2A" xml:space="preserve">   zone 2 runs 0.6 m out from the shower</text><text x="742" y="476" font-size="18" font-weight="700" fill="#C85A32">Who does the work</text><text x="742" y="504" font-size="14.5" fill="#342E2A" xml:space="preserve">• Licensed plumber and electrician</text><text x="742" y="529" font-size="14.5" fill="#342E2A" xml:space="preserve">• NSW: licensed waterproofer over $5,000</text><text x="742" y="554" font-size="14.5" fill="#342E2A" xml:space="preserve">• QLD: QBCC waterproofing licence class</text><text x="742" y="593" font-size="18" font-weight="700" fill="#C85A32">Toilet door (NCC 10.4.2)</text><text x="742" y="621" font-size="14.5" fill="#342E2A" xml:space="preserve">• Under 1.2 m from pan to doorway:</text><text x="742" y="646" font-size="14.5" fill="#342E2A" xml:space="preserve">   door slides, opens out or is removable</text><text x="60" y="858" font-size="14" fill="#6E645C">Example only. Sources: NCC 2022 Housing Provisions, NSW Government (AS/NZS 3000 zones, waterproofing licence), QBCC, Blueleaf (sizes).</text><text x="60" y="880" font-size="14" fill="#6E645C">Layout and fixture positions: our worked example. Check your state’s rules and your certifier before you build.</text></svg>