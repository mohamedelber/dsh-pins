<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" font-family="Poppins, sans-serif" role="img" aria-labelledby="bw-t bw-d"><title id="bw-t">Built-in wardrobe interior heights</title><desc id="bw-d">Front view of an example built-in wardrobe 2,000 mm wide and 2,360 mm high, 600 mm deep, with the doors removed. Bay A, 800 mm wide, is long hanging with a rail at about 1,900 mm and a storage shelf above. Bay B, 600 mm wide, is double hanging with an upper rail at about 1,900 mm and a lower rail at about 900 mm. Bay C, 600 mm wide, has a drawer bank up to about 900 mm and adjustable shelves about 350 mm apart above it. Hinged doors should be no wider than about 600 mm each; allow at least 600 mm depth for hanging, or about 650 mm with sliding doors.</desc><rect width="1200" height="900" fill="#F7F1E9"/><text x="60" y="80" font-size="44" font-weight="700" fill="#342E2A">Built-In Wardrobe Interior Heights</text><text x="60" y="118" font-size="22" fill="#6E645C">A 2 m wardrobe, doors removed, typical UK sizes in mm</text><text x="1140" y="50" font-size="18" fill="#6E645C" text-anchor="end">dailyspacehacks.com</text><rect x="150.0" y="198.39999999999998" width="520.0" height="613.6" fill="#FFFFFF" stroke="#B98A5E" stroke-width="5"/><line x1="358.0" y1="198.39999999999998" x2="358.0" y2="812.0" stroke="#B98A5E" stroke-width="4"/><line x1="514.0" y1="198.39999999999998" x2="514.0" y2="812.0" stroke="#B98A5E" stroke-width="4"/><line x1="110" y1="812" x2="710.0" y2="812" stroke="#342E2A" stroke-width="4"/><rect x="152.0" y="288.0" width="204.0" height="8" fill="#D9B48A" stroke="#B98A5E" stroke-width="1.5"/><line x1="158.0" y1="318.0" x2="350.0" y2="318.0" stroke="#8C8C8C" stroke-width="6" stroke-linecap="round"/><path d="M177.33333333333334 318.0 l-3 -9" stroke="#6E645C" stroke-width="2" fill="none"/><path d="M164.45333333333335 326.0 L177.33333333333334 319.0 L190.21333333333334 326.0 L188.37333333333333 669.0 L166.29333333333335 669.0 Z" fill="#8FA689" stroke="#ff