<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" font-family="Poppins, sans-serif" role="img" aria-labelledby="ki-t ki-d"><title id="ki-t">Do you have room for a kitchen island?</title><desc id="ki-d">Two cross-sections of a galley-style kitchen with 60 cm deep units on both walls and a 1 metre walkway on each side of an island. A slim 60 cm deep prep island with no seating needs a room about 3.8 metres wide: 60 + 100 + 60 + 100 + 60 cm. A 90 cm deep island with a 30 cm worktop overhang for stools, and 1.2 metres behind the stools, needs about 4.3 metres: 60 + 100 + 90 + 120 + 60 cm. Planning numbers: 1 m walkways, 1.2 m for two cooks or a main route; smallest island about 100 by 100 cm, a butcher's block from 60 cm; worktop 90 cm high, breakfast bar 100 to 110 cm; about 30 cm overhang, more needs support; 60 cm per stool; pendants 70 to 80 cm above the worktop; sockets at least 30 cm from a sink and RCD protected.</desc><rect width="1200" height="900" fill="#F7F1E9"/><text x="60" y="78" font-size="40" font-weight="700" fill="#342E2A">Do You Have Room for an Island?</text><text x="60" y="114" font-size="20" fill="#6E645C">Room width needed, wall to wall, with 1 m walkways (cm, to scale)</text><text x="1140" y="30" font-size="18" fill="#6E645C" text-anchor="end">dailyspacehacks.com</text><text x="60" y="162" font-size="19" font-weight="700" fill="#C85A32">Slim prep island, no seating</text><rect x="60" y="180" width="78.0" height="110" fill="#E9DFD2" stroke="#6E645C" stroke-width="1.5"/><text x="99.0" y="232" font-size="14" font-weight="700" fill="#342E2A" text-anchor="middle">units</text><text x="99.0" y="252" font-size="12" fill="#6E645C" text-anchor="middle">60</text><rect x="138.0" y="180" width="130.0" height="110" fill="#DCE5D6" stroke="#6E645C" stroke-width="1.5"/><text x="203.0" y="232" font-size="14" font-weight="700" fill="#342E2A" text-anchor="middle">1 m walk</text><text x="203.0" y="252" font-size="12" fill="#6E645C" text-anchor="middle">100</text><rect x="268.0" y="180" width="78.0" height="110" fill="#C9A06B" stroke="#6E645C" stroke-width="1.5"/><text x="307.0" y="232" font-size="14" font-weight="700" fill="#342E2A" text-anchor="middle">island</text><text x="307.0" y="252" font-size="12" fill="#6E645C" text-anchor="middle">60</text><rect x="346.0" y="180" width="130.0" height="110" fill="#DCE5D6" stroke="#6E645C" stroke-width="1.5"/><text x="411.0" y="232" font-size="14" font-weight="700" fill="#342E2A" text-anchor="middle">1 m walk</text><text x="411.0" y="252" font-size="12" fill="#6E645C" text-anchor="middle">100</text><rect x="476.0" y="180" width="78.0" height="110" fill="#E9DFD2" stroke="#6E645C" stroke-width="1.5"/><text x="515.0" y="232" font-size="14" font-weight="700" fill="#342E2A" text-anchor="middle">units</text><text x="515.0" y="252" font-size="12" fill="#6E645C" text-anchor="middle">60</text><line x1="60" y1="308" x2="554.0" y2="308" stroke="#342E2A" stroke-width="2"/><text x="307.0" y="332" font-size="17" font-weight="700" fill="#342E2A" text-anchor="middle">about 3.8 m wide</text><text x="60" y="392" font-size="19" font-weight="700" fill="#C85A32">Island with stools on one side (30 cm overhang)</text><rect x="60" y="410" width="78.0" height="110" fill="#E9DFD2" stroke="#6E645C" stroke-width="1.5"/><text x="99.0" y="462" font-size="14" font-weight="700" fill="#342E2A" text-anchor="middle">units</text><text x="99.0" y="482" font-size="12" fill="#6E645C" text-anchor="middle">60</text><rect x="138.0" y="410" width="130.0" height="110" fill="#DCE5D6" stroke="#6E645C" stroke-width="1.5"/><text x="203.0" y="462" font-size="14" font-weight="700" fill="#342E2A" text-anchor="middle">1 m walk</text><text x="203.0" y="482" font-size="12" fill="#6E645C" text-anchor="middle">100</text><rect x="268.0" y="410" width="117.0" height="110" fill="#C9A06B" stroke="#6E645C" stroke-width="1.5"/><rect x="346.0" y="410" width="39.0" height="110" fill="#E6C998" stroke="#A97F4C" stroke-dasharray="4 3"/><text x="326.5" y="462" font-size="14" font-weight="700" fill="#342E2A" text-anchor="middle">island</text><text x="326.5" y="482" font-size="12" fill="#6E645C" text-anchor="middle">60 + 30</text><rect x="385.0" y="410" width="156.0" height="110" fill="#DCE5D6" stroke="#6E645C" stroke-width="1.5"/><text x="463.0" y="462" font-size="14" font-weight="700" fill="#342E2A" text-anchor="middle">1.2 m</text><text x="463.0" y="482" font-size="12" fill="#6E645C" text-anchor="middle">behind stools</text><rect x="541.0" y="410" width="78.0" height="110" fill="#E9DFD2" stroke="#6E645C" stroke-width="1.5"/><text x="580.0" y="462" font-size="14" font-weight="700" fill="#342E2A" text-anchor="middle">units</text><text x="580.0" y="482" font-size="12" fill="#6E645C" text-anchor="middle">60</text><line x1="60" y1="538" x2="619.0" y2="538" stroke="#342E2A" stroke-width="2"/><text x="339.5" y="562" font-size="17" font-weight="700" fill="#C85A32" text-anchor="middle">about 4.3 m wide</text><text x="60" y="640" font-size="15" fill="#342E2A">Too narrow? A trolley 43 cm deep, a drop-leaf island or a peninsula</text><text x="60" y="662" font-size="15" fill="#342E2A">joined to the units needs far less floor.</text><rect x="700" y="150" width="460" height="660" rx="16" fill="#FFFFFF" stroke="#D8CBBB" stroke-width="2"/><text x="724" y="190" font-size="21" font-weight="700" fill="#C85A32">Planning numbers</text><text x="724" y="232" font-size="15" font-weight="700" fill="#342E2A">Walkway</text><text x="880" y="232" font-size="15" fill="#342E2A">1 m; 1.2 m for two cooks</text><line x1="724" y1="248" x2="1136" y2="248" stroke="#D8CBBB"/><text x="724" y="288" font-size="15" font-weight="700" fill="#342E2A">Behind stools</text><text x="880" y="288" font-size="15" fill="#342E2A">90 cm to 1.2 m</text><line x1="724" y1="304" x2="1136" y2="304" stroke="#D8CBBB"/><text x="724" y="344" font-size="15" font-weight="700" fill="#342E2A">Smallest island</text><text x="880" y="344" font-size="15" fill="#342E2A">about 100 x 100 cm</text><line x1="724" y1="360" x2="1136" y2="360" stroke="#D8CBBB"/><text x="724" y="400" font-size="15" font-weight="700" fill="#342E2A">Butcher's block</text><text x="880" y="400" font-size="15" fill="#342E2A">from 60 cm</text><line x1="724" y1="416" x2="1136" y2="416" stroke="#D8CBBB"/><text x="724" y="456" font-size="15" font-weight="700" fill="#342E2A">Worktop height</text><text x="880" y="456" font-size="15" fill="#342E2A">90 cm</text><line x1="724" y1="472" x2="1136" y2="472" stroke="#D8CBBB"/><text x="724" y="512" font-size="15" font-weight="700" fill="#342E2A">Breakfast bar</text><text x="880" y="512" font-size="15" fill="#342E2A">100–110 cm</text><line x1="724" y1="528" x2="1136" y2="528" stroke="#D8CBBB"/><text x="724" y="568" font-size="15" font-weight="700" fill="#342E2A">Stool overhang</text><text x="880" y="568" font-size="15" fill="#342E2A">about 30 cm, more needs support</text><line x1="724" y1="584" x2="1136" y2="584" stroke="#D8CBBB"/><text x="724" y="624" font-size="15" font-weight="700" fill="#342E2A">Per stool</text><text x="880" y="624" font-size="15" fill="#342E2A">60 cm of worktop</text><line x1="724" y1="640" x2="1136" y2="640" stroke="#D8CBBB"/><text x="724" y="680" font-size="15" font-weight="700" fill="#342E2A">Pendants</text><text x="880" y="680" font-size="15" fill="#342E2A">70–80 cm above the top</text><line x1="724" y1="696" x2="1136" y2="696" stroke="#D8CBBB"/><text x="724" y="736" font-size="15" font-weight="700" fill="#342E2A">Sockets</text><text x="880" y="736" font-size="15" fill="#342E2A">30 cm from a sink, RCD</text><line x1="724" y1="752" x2="1136" y2="752" stroke="#D8CBBB"/><text x="60" y="852" font-size="14" fill="#6E645C">Example widths are our own sums with 60 cm units. Sources: Wren, Harvey Jones, Magnet, Wickes, Homebuilding, DFS, Tala, NICEIC.</text><text x="60" y="874" font-size="14" fill="#6E645C">Use our kitchen island size calculator for your own room.</text></svg>