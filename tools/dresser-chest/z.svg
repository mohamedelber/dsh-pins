<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" font-family="Poppins, sans-serif" role="img" aria-labelledby="dc-t dc-d"><title id="dc-t">Dresser vs chest of drawers: six drawers, two shapes</title><desc id="dc-d">Two white IKEA STORKLINTA 6-drawer units, drawn to scale: the wide one costs $249.99 and the tall one $229.99. The wide, low dresser is 55 1/8 inches wide, 18 7/8 deep and 29 1/2 tall; the tall chest of drawers is 27 1/2 wide, 18 7/8 deep and 47 1/4 tall. Both are taller than 27 inches, heavier than 30 pounds and hold more than 3.2 cubic feet, so the federal tip-over standard applies and both should be anchored to the wall. In plan, the dresser covers 7.2 square feet and the chest 3.6 square feet; with 36 inches clear in front to open drawers, they need about 21 and 10.5 square feet. The dresser holds 8.4 cubic feet and the chest 6.8 cubic feet, so the chest uses half the floor for 81 percent of the storage: 1.89 cubic feet per square foot of floor against 1.16.</desc><rect width="1200" height="900" fill="#F7F1E9"/><text x="60" y="78" font-size="40" font-weight="700" fill="#342E2A">Dresser vs Chest: Six Drawers, Two Shapes</text><text x="60" y="114" font-size="20" fill="#6E645C">IKEA STORKLINTA 6-drawer in white, wide and tall versions, drawn to scale</text><text x="1140" y="30" font-size="18" fill="#6E645C" text-anchor="end">dailyspacehacks.com</text><rect x="40" y="140" width="600" height="470" rx="16" fill="#FFFFFF" stroke="#D8CBBB" stroke-width="2"/><text x="64" y="178" font-size="19" font-weight="700" fill="#C85A32">Front view</text><rect x="100" y="371.2" width="352.8" height="188.8" rx="3" fill="#C9A06B" stroke="#A97F4C" stroke-width="2"/><rect x="106.0" y="377.2" width="168.4" height="56.26666666666667" rx="2" fill="#D9B786" stroke="#A97F4C" stroke-width="1"/><circle cx="190.2" cy="405.3333333333333" r="3.5" fill="#342E2A"/><rect x="106.0" y="437.46666666666664" width="168.4" height="56.26666666666667" rx="2" fill="#D9B786" stroke="#A97F4C" stroke-width="1"/><circle cx="190.2" cy="465.59999999999997" r="3.5" fill="#342E2A"/><rect x="106.0" y="497.73333333333335" width="168.4" height="56.26666666666667" rx="2" fill="#D9B786" stroke="#A97F4C" stroke-width="1"/><circle cx="190.2" cy="525.8666666666667" r="3.5" fill="#342E2A"/><rect x="278.4" y="377.2" width="168.4" height="56.26666666666667" rx="2" fill="#D9B786" stroke="#A97F4C" stroke-width="1"/><circle cx="362.59999999999997" cy="405.3333333333333" r="3.5" fill="#342E2A"/><rect x="278.4" y="437.46666666666664" width="168.4" height="56.26666666666667" rx="2" fill="#D9B786" stroke="#A97F4C" stroke-width="1"/><circle cx="362.59999999999997" cy="465.59999999999997" r="3.5" fill="#342E2A"/><rect x="278.4" y="497.73333333333335" width="168.4" height="56.26666666666667" rx="2" fill="#D9B786" stroke="#A97F4C" stroke-width="1"/><circle cx="362.59999999999997" cy="525.8666666666667" r="3.5" fill="#342E2A"/><rect x="470" y="257.59999999999997" width="176.0" height="302.40000000000003" rx="3" fill="#C9A06B" stroke="#A97F4C" stroke-width="2"/><rect x="476.0" y="263.59999999999997" width="164.0" height="45.06666666666667" rx="2" fill="#D9B786" stroke="#A97F4C" stroke-width="1"/><circle cx="558.0" cy="286.1333333333333" r="3.5" fill="#342E2A"/><rect x="476.0" y="312.66666666666663" width="164.0" height="45.06666666666667" rx="2" fill="#D9B786" stroke="#A97F4C" stroke-width="1"/><circle cx="558.0" cy="335.2" r="3.5" fill="#342E2A"/><rect x="476.0" y="361.7333333333333" width="164.0" height="45.06666666666667" rx="2" fill="#D9B786" stroke="#A97F4C" stroke-width="1"/><circle cx="558.0" cy="384.26666666666665" r="3.5" fill="#342E2A"/><rect x="476.0" y="410.79999999999995" width="164.0" height="45.06666666666667" rx="2" fill="#D9B786" stroke="#A97F4C" stroke-width="1"/><circle cx="558.0" cy="433.3333333333333" r="3.5" fill="#342E2A"/><rect x="476.0" y="459.8666666666667" width="164.0" height="45.06666666666667" rx="2" fill="#D9B786" stroke="#A97F4C" stroke-width="1"/><circle cx="558.0" cy="482.40000000000003" r="3.5" fill="#342E2A"/><rect x="476.0" y="508.9333333333333" width="164.0" height="45.06666666666667" rx="2" fill="#D9B786" stroke="#A97F4C" stroke-width="1"/><circle cx="558.0" cy="531.4666666666666" r="3.5" fill="#342E2A"/><line x1="60" y1="560" x2="620" y2="560" stroke="#342E2A" stroke-width="3"/><text x="276.4" y="359.2" font-size="16" font-weight="700" fill="#342E2A" text-anchor="middle">Dresser: 55 1/8 W x 29 1/2 H in</text><text x="558.0" y="223.59999999999997" font-size="16" font-weight="700" fill="#342E2A" text-anchor="middle">Chest of drawers:</text><text x="558.0" y="243.59999999999997" font-size="16" font-weight="700" fill="#342E2A" text-anchor="middle">27 1/2 W x 47 1/4 H in</text><line x1="60" y1="387.2" x2="620" y2="387.2" stroke="#C85A32" stroke-width="2" stroke-dasharray="8 6"/><text x="64" y="379.2" font-size="14" font-weight="700" fill="#C85A32">27 in</text><text x="64" y="590" font-size="14" fill="#342E2A">Both are over 27 in, 30 lb and 3.2 cu ft: the federal standard applies. Anchor both.</text><rect x="660" y="140" width="500" height="470" rx="16" fill="#FFFFFF" stroke="#D8CBBB" stroke-width="2"/><text x="684" y="178" font-size="19" font-weight="700" fill="#C85A32">Floor plan, with 36 in to open drawers</text><line x1="680" y1="220" x2="1140" y2="220" stroke="#342E2A" stroke-width="6"/><text x="910" y="212" font-size="13" fill="#6E645C" text-anchor="middle">wall</text><rect x="688" y="220" width="198.45000000000002" height="67.95" fill="#C9A06B" stroke="#A97F4C" stroke-width="2"/><rect x="688" y="287.95" width="198.45000000000002" height="129.6" fill="#DCE5D6" stroke="#8FA689" stroke-width="1.5" stroke-dasharray="6 4"/><text x="787.225" y="258.975" font-size="14" font-weight="700" fill="#342E2A" text-anchor="middle">7.2 sq ft</text><text x="787.225" y="352.75" font-size="13" fill="#4F6B49" text-anchor="middle">36 in clear</text><text x="787.225" y="443.54999999999995" font-size="15" font-weight="700" fill="#C85A32" text-anchor="middle">21 sq ft in use</text><rect x="926.45" y="220" width="99.0" height="67.95" fill="#C9A06B" stroke="#A97F4C" stroke-width="2"/><rect x="926.45" y="287.95" width="99.0" height="129.6" fill="#DCE5D6" stroke="#8FA689" stroke-width="1.5" stroke-dasharray="6 4"/><text x="975.95" y="258.975" font-size="14" font-weight="700" fill="#342E2A" text-anchor="middle">3.6 sq ft</text><text x="975.95" y="352.75" font-size="13" fill="#4F6B49" text-anchor="middle">36 in clear</text><text x="975.95" y="443.54999999999995" font-size="15" font-weight="700" fill="#C85A32" text-anchor="middle">10.5 sq ft in use</text><text x="684" y="560" font-size="14" fill="#342E2A">The chest frees about 10 sq ft of floor in a small</text><text x="684" y="582" font-size="14" fill="#342E2A">bedroom. Wayfair and Coleman suggest 36 in in front.</text><rect x="40" y="640" width="1120" height="170" rx="16" fill="#FFFFFF" stroke="#D8CBBB" stroke-width="2"/><text x="430" y="674" font-size="15" font-weight="700" fill="#6E645C" text-anchor="middle">Floor area</text><text x="430" y="692" font-size="12" fill="#6E645C" text-anchor="middle">sq ft</text><text x="600" y="674" font-size="15" font-weight="700" fill="#6E645C" text-anchor="middle">Storage</text><text x="600" y="692" font-size="12" fill="#6E645C" text-anchor="middle">cu ft</text><text x="770" y="674" font-size="15" font-weight="700" fill="#6E645C" text-anchor="middle">Storage per</text><text x="770" y="692" font-size="12" fill="#6E645C" text-anchor="middle">sq ft of floor</text><text x="950" y="674" font-size="15" font-weight="700" fill="#6E645C" text-anchor="middle">Price</text><text x="950" y="692" font-size="12" fill="#6E645C" text-anchor="middle">Oct 2026</text><text x="64" y="728" font-size="17" font-weight="700" fill="#342E2A">Wide dresser (6 drawers)</text><text x="430" y="728" font-size="17" font-weight="700" fill="#342E2A" text-anchor="middle">7.2</text><text x="600" y="728" font-size="17" font-weight="700" fill="#342E2A" text-anchor="middle">8.4</text><text x="770" y="728" font-size="17" font-weight="700" fill="#342E2A" text-anchor="middle">1.16</text><text x="950" y="728" font-size="17" font-weight="700" fill="#342E2A" text-anchor="middle">$249.99</text><text x="64" y="764" font-size="17" font-weight="700" fill="#C85A32">Tall chest (6 drawers)</text><text x="430" y="764" font-size="17" font-weight="700" fill="#C85A32" text-anchor="middle">3.6</text><text x="600" y="764" font-size="17" font-weight="700" fill="#C85A32" text-anchor="middle">6.8</text><text x="770" y="764" font-size="17" font-weight="700" fill="#C85A32" text-anchor="middle">1.89</text><text x="950" y="764" font-size="17" font-weight="700" fill="#C85A32" text-anchor="middle">$229.99</text><text x="64" y="796" font-size="15" font-style="italic" fill="#342E2A">The tall chest uses half the floor for 81% of the storage.</text><text x="60" y="846" font-size="14" fill="#6E645C">Sizes and storage capacity from IKEA US product pages (STORKLINTA 6-drawer, checked Oct 26, 2026; prices change). Clearance: Wayfair and</text><text x="60" y="868" font-size="14" fill="#6E645C">Coleman Furniture guides. 27 in threshold: CPSC clothing storage unit rule (16 CFR part 1261), in force since Sept 1, 2023.</text></svg>