<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" font-family="Poppins, sans-serif" role="img" aria-labelledby="dh-t dh-d"><title id="dh-t">Ergonomic desk height guide</title><desc id="dh-d">Side view of a person sitting at a desk with the ergonomic rules. The desk or keyboard is at elbow height so the elbows bend at about 90 degrees and the forearms are level. The chair is set so the feet are flat on the floor and the thighs are about level. The top of the screen is at or slightly below eye level, about an arm's length away. A table shows desk heights by person height.</desc><rect width="1200" height="900" fill="#F7F1E9"/><text x="60" y="84" font-size="44" font-weight="700" fill="#342E2A">The Right Desk Height</text><text x="60" y="124" font-size="22" fill="#6E645C">Desk at elbow height, feet flat, screen at eye level</text><text x="1140" y="60" font-size="18" fill="#6E645C" text-anchor="end">dailyspacehacks.com</text><line x1="60" y1="780" x2="700" y2="780" stroke="#B98A5E" stroke-width="4"/><rect x="170" y="674.6" width="110" height="12" rx="5" fill="#8FA689"/><rect x="164" y="538.2" width="14" height="136.4" rx="6" fill="#8FA689"/><line x1="225" y1="686.6" x2="225" y2="766" stroke="#6E645C" stroke-width="7"/><line x1="185" y1="772" x2="265" y2="772" stroke="#6E645C" stroke-width="7"/><rect x="360" y="615.7" width="300" height="12" fill="#D9B48A"/><line x1="375" y1="627.7" x2="375" y2="780" stroke="#B98A5E" stroke-width="8"/><line x1="645" y1="627.7" x2="645" y2="780" stroke="#B98A5E" stroke-width="8"/><rect x="600" y="482.4" width="14" height="86.8" fill="#342E2A"/><line x1="607" y1="569.2" x2="607" y2="615.7" stroke="#6E645C" stroke-width="6"/><rect x="580" y="609.7" width="54" height="6" fill="#6E645C"/><line x1="210" y1="656.0" x2="315" y2="656.0" stroke="#E9C46A" stroke-width="22" stroke-linecap="round"/><line x1="315" y1="656.0" x2="315" y2="774" stroke="#E9C46A" stroke-width="22" stroke-linecap="round"/><line x1="210" y1="656.0" x2="204" y2="525.8" stroke="#E9C46A" stroke-width="22" stroke-linecap="round"/><line x1="204" y1="525.8" x2="212" y2="606.4" stroke="#E9C46A" stroke-width="22" stroke-linecap="round"/><line x1="212" y1="606.4" x2="400" y2="606.4" stroke="#E9C46A" stroke-width="22" stroke-linecap="round"/><circle cx="208" cy="482.4" r="38" fill="#E9C46A"/><line x1="305" y1="772" x2="345" y2="772" stroke="#E9C46A" stroke-width="16" stroke-linecap="round"/><rect x="380" y="607.7" width="80" height="8" rx="2" fill="#342E2A"/><line x1="238" y1="482.4" x2="600" y2="482.4" stroke="#8FA689" stroke-width="3" stroke-dasharray="10 8"/><text x="360" y="442.4" font-size="20" font-weight="700" fill="#C85A32" text-anchor="start">Top of screen at eye level</text><text x="360" y="466.4" font-size="16" fill="#6E645C" text-anchor="start">about an arm’s length away</text><text x="392" y="679.7" font-size="20" font-weight="700" fill="#C85A32" text-anchor="start">Desk at elbow height</text><text x="392" y="703.7" font-size="16" fill="#6E645C" text-anchor="start">elbows at about 90°</text><text x="150" y="820" font-size="20" font-weight="700" fill="#C85A32" text-anchor="start">Feet flat, thighs level</text><text x="150" y="844" font-size="16" fill="#6E645C" text-anchor="start">raise the chair, add a footrest</text><rect x="760" y="200" width="380" height="520" rx="18" fill="#fff" stroke="#E6DCCF" stroke-width="2"/><text x="784" y="246" font-size="22" font-weight="700" fill="#342E2A">Desk height by height</text><text x="784" y="286" font-size="15" font-weight="700" fill="#6E645C">You</text><text x="896" y="286" font-size="15" font-weight="700" fill="#6E645C">Sitting</text><text x="1012" y="286" font-size="15" font-weight="700" fill="#6E645C">Standing</text><rect x="772" y="300" width="356" height="56" rx="10" fill="#CFDDCB" fill-opacity="0.5"/><text x="784" y="336" font-size="17" font-weight="700" fill="#342E2A">5 ft 0 in</text><text x="896" y="336" font-size="16" fill="#C85A32" font-weight="700">22.5-24.5 in</text><text x="1012" y="336" font-size="16" fill="#C85A32" font-weight="700">35.5-37.5 in</text><text x="784" y="406" font-size="17" font-weight="700" fill="#342E2A">5 ft 4 in</text><text x="896" y="406" font-size="16" fill="#C85A32" font-weight="700">23.5-25.5 in</text><text x="1012" y="406" font-size="16" fill="#C85A32" font-weight="700">37.5-39.5 in</text><rect x="772" y="440" width="356" height="56" rx="10" fill="#CFDDCB" fill-opacity="0.5"/><text x="784" y="476" font-size="17" font-weight="700" fill="#342E2A">5 ft 8 in</text><text x="896" y="476" font-size="16" fill="#C85A32" font-weight="700">25.5-27.5 in</text><text x="1012" y="476" font-size="16" fill="#C85A32" font-weight="700">40.5-42.5 in</text><text x="784" y="546" font-size="17" font-weight="700" fill="#342E2A">6 ft 0 in</text><text x="896" y="546" font-size="16" fill="#C85A32" font-weight="700">26.5-28.5 in</text><text x="1012" y="546" font-size="16" fill="#C85A32" font-weight="700">43-45 in</text><rect x="772" y="580" width="356" height="56" rx="10" fill="#CFDDCB" fill-opacity="0.5"/><text x="784" y="616" font-size="17" font-weight="700" fill="#342E2A">6 ft 4 in</text><text x="896" y="616" font-size="16" fill="#C85A32" font-weight="700">28.5-30.5 in</text><text x="1012" y="616" font-size="16" fill="#C85A32" font-weight="700">45.5-47.5 in</text><text x="784" y="690" font-size="14" fill="#6E645C">Estimates with normal shoes. Your own</text><text x="784" y="708" font-size="14" fill="#6E645C">elbow height is the best guide.</text></svg>