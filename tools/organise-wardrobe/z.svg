<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" font-family="Poppins, sans-serif" role="img" aria-labelledby="ow-t ow-d"><title id="ow-t">A wardrobe organised by height</title><desc id="ow-d">Elevation of an example fitted wardrobe 2.2 metres high and 2 metres wide, in three bays. Left: double hanging, with the lower rail at 90 cm and the upper rail at about 2 m, so each tier has room for shirts and folded trousers, which need about 90 cm. Middle: one rail at 180 cm for dresses and coats, which need 100 to 150 cm of drop. Right: shelves 30 to 40 cm apart, enough for a stack of about 10 jumpers (about 30 cm), with drawers below and boxes for out-of-season clothes on top. Hanging needs an internal depth of at least 60 cm. Most-worn clothes go in the middle zone, between knee and head height.</desc><rect width="1200" height="900" fill="#F7F1E9"/><text x="60" y="80" font-size="42" font-weight="700" fill="#342E2A">A Wardrobe, Organised by Height</text><text x="60" y="116" font-size="21" fill="#6E645C">Where each type of clothing fits, in cm</text><text x="1140" y="30" font-size="18" fill="#6E645C" text-anchor="end">dailyspacehacks.com</text><rect x="150" y="165.0" width="550.0" height="605.0" fill="#E9D8BE" stroke="#342E2A" stroke-width="4"/><line x1="333.33333333333337" y1="165.0" x2="333.33333333333337" y2="770" stroke="#342E2A" stroke-width="3"/><line x1="516.6666666666667" y1="165.0" x2="516.6666666666667" y2="770" stroke="#342E2A" stroke-width="3"/><line x1="150" y1="206.25" x2="700.0" y2="206.25" stroke="#342E2A" stroke-width="3"/><rect x="162.0" y="167.75" width="73.66666666666667" height="33.0" rx="4" fill="#D8CBBB" stroke="#B5A898"/><rect x="247.66666666666669" y="167.75" width="73.66666666666667" height="33.0" rx="4" fill="#D8CBBB" stroke="#B5A898"/><rect x="345.33333333333337" y="167.75" width="73.66666666666667" height="33.0" rx="4" fill="#D8CBBB" stroke="#B5A898"/><rect x="431.00000000000006" y="167.75" width="73.66666666666667" height="33.0" 