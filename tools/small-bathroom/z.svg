<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" font-family="Poppins, sans-serif" role="img" aria-labelledby="sb-t sb-d"><title id="sb-t">A 5x8 bathroom, measured</title><desc id="sb-d">Plan of an example 5 by 8 foot bathroom (40 square feet). A 60 by 30 inch tub runs across the back wall. The toilet and a 24 inch vanity, with its sink centerline 22 inches from the end wall, share the left wall, so all the plumbing is on one wall. The toilet centerline is 18 inches from the tub, the NKBA recommendation (code minimum 15 inches), and there are 32 inches clear in front of the toilet and 39 inches in front of the vanity, above the NKBA's 30 inches (code minimum 21). A 32 inch pocket door on the long wall saves the floor a swinging door would need. Right: code minimums compared with NKBA recommendations, and the fan, outlet and water-efficiency numbers for a small bathroom.</desc><rect width="1200" height="900" fill="#F7F1E9"/><text x="60" y="80" font-size="42" font-weight="700" fill="#342E2A">A 5 x 8 Bathroom, Measured</text><text x="60" y="116" font-size="21" fill="#6E645C">One plumbing wall, a pocket door and the clearances that matter</text><text x="1140" y="30" font-size="18" fill="#6E645C" text-anchor="end">dailyspacehacks.com</text><rect x="150" y="170" width="348.0" height="556.8" fill="#FBF7F0" stroke="#342E2A" stroke-width="8"/><rect x="150.0" y="170.0" width="348.0" height="174.0" fill="#FFFFFF" stroke="#6E645C" stroke-width="2"/><rect x="179.0" y="193.2" width="290.0" height="127.6" rx="40" fill="#DCE5D6"/><text x="324.0" y="262.8" font-size="15" font-weight="700" fill="#342E2A" text-anchor="middle">Tub 60 x 30 in</text><line x1="150.0" y1="344.0" x2="498.0" y2="344.0" stroke="#7FA9C2" stroke-width="5"/><rect x="150.0" y="396.2" width="46.4" height="104.39999999999999" fill="#E8E8E8" stroke="#6E645C"/><ellipse cx="254.39999999999998" cy="448.4" rx="58.0" ry="43.5" fill="#FFFFFF" stroke="#6E645C" stroke-width="2"/><text x="219.6" y="384.59999999999997" font-size="14" fill="#342E2A" text-anchor="middle">toilet</text><line x1="324.0" y1="344.0" x2="324.0" y2="448.4" stroke="#C85A32" stroke-width="2"/><line x1="161.6" y1="448.4" x2="341.4" y2="448.4" stroke="#C85A32" stroke-width="1.5" stroke-dasharray="4 4"/><text x="335.6" y="402.0" font-size="14" font-weight="700" fill="#C85A32">18 in to</text><text x="335.6" y="419.4" font-size="14" font-weight="700" fill="#C85A32">centerline</text><line x1="312.4" y1="518.0" x2="498.0" y2="518.0" stroke="#C85A32" stroke-width="2"/><text x="405.2" y="506.4" font-size="14" font-weight="700" fill="#C85A32" text-anchor="middle">32 in clear</text><rect x="150.0" y="529.5999999999999" width="121.8" height="139.2" fill="#C9A06B"/><ellipse cx="213.8" cy="599.1999999999999" rx="34.8" ry="46.4" fill="#FFFFFF"/><text x="213.8" y="521.5999999999999" font-size="14" fill="#342E2A" text-anchor="middle">vanity 24 x 21</text><line x1="271.8" y1="645.5999999999999" x2="498.0" y2="645.5999999999999" stroke="#C85A32" stroke-width="2"/><text x="382.0" y="633.9999999999999" font-size="14" font-weight="700" fill="#C85A32" text-anchor="middle">39 in clear</text><line x1="136" y1="170" x2="136" y2="726.8" stroke="#8FA689" stroke-width="8"/><text x="124" y="448.4" font-size="14" font-weight="700" fill="#4F6B49" text-anchor="middle" transform="rotate(-90 124 448.4)">one plumbing wall</text><rect x="494.0" y="506.4" width="8" height="185.6" fill="#FBF7F0"/><rect x="506.0" y="324.79999999999995" width="8" height="185.6" fill="#B0B0B0"/><text x="522.0" y="576.0" font-size="14" font-weight="700" fill="#C85A32">32 in</text><text x="522.0" y="593.4" font-size="14" font-weight="700" fill="#C85A32">pocket</text><text x="522.0" y="610.8" font-size="14" font-weight="700" fill="#C85A32">door</text><line x1="150" y1="148" x2="498.0" y2="148" stroke="#342E2A" stroke-width="2"/><text x="324.0" y="140" font-size="15" font-weight="700" fill="#342E2A" text-anchor="middle">5 ft (60 in)</text><text x="150" y="760.8" font-size="15" font-weight="700" fill="#342E2A">8 ft (96 in) deep: 40 sq ft</text><rect x="660" y="150" width="480" height="560" rx="16" fill="#FFFFFF" stroke="#D8CBBB" stroke-width="2"/><text x="682" y="190" font-size="19" font-weight="700" fill="#C85A32">Code minimum vs NKBA</text><text x="960" y="222" font-size="13" font-weight="700" fill="#6E645C" text-anchor="middle">Code</text><text x="1070" y="222" font-size="13" font-weight="700" fill="#6E645C" text-anchor="middle">NKBA</text><text x="682" y="254" font-size="15" fill="#342E2A">Clear space in front</text><text x="960" y="254" font-size="15" fill="#342E2A" text-anchor="middle">21 in</text><text x="1070" y="254" font-size="15" font-weight="700" fill="#C85A32" text-anchor="middle">30 in</text><line x1="682" y1="268" x2="1118" y2="268" stroke="#D8CBBB"/><text x="682" y="292" font-size="15" fill="#342E2A">Toilet center to side</text><text x="960" y="292" font-size="15" fill="#342E2A" text-anchor="middle">15 in</text><text x="1070" y="292" font-size="15" font-weight="700" fill="#C85A32" text-anchor="middle">18 in</text><line x1="682" y1="306" x2="1118" y2="306" stroke="#D8CBBB"/><text x="682" y="330" font-size="15" fill="#342E2A">Shower size</text><text x="960" y="330" font-size="15" fill="#342E2A" text-anchor="middle">30 x 30 in</text><text x="1070" y="330" font-size="15" font-weight="700" fill="#C85A32" text-anchor="middle">36 x 36 in</text><line x1="682" y1="344" x2="1118" y2="344" stroke="#D8CBBB"/><text x="682" y="368" font-size="15" fill="#342E2A">Sink center to wall</text><text x="960" y="368" font-size="15" fill="#342E2A" text-anchor="middle">15 in</text><text x="1070" y="368" font-size="15" font-weight="700" fill="#C85A32" text-anchor="middle">20 in</text><line x1="682" y1="382" x2="1118" y2="382" stroke="#D8CBBB"/><text x="682" y="406" font-size="15" fill="#342E2A">Door width</text><text x="960" y="406" font-size="15" fill="#342E2A" text-anchor="middle">—</text><text x="1070" y="406" font-size="15" font-weight="700" fill="#C85A32" text-anchor="middle">32 in</text><line x1="682" y1="420" x2="1118" y2="420" stroke="#D8CBBB"/><text x="682" y="470" font-size="19" font-weight="700" fill="#C85A32">Also check</text><text x="682" y="502" font-size="15" fill="#342E2A">• Fan: 1 CFM per sq ft, 50 CFM minimum</text><text x="682" y="532" font-size="15" fill="#342E2A">• Outlets: GFCI protected</text><text x="682" y="562" font-size="15" fill="#342E2A">• Toilet: WaterSense 1.28 gal per flush</text><text x="682" y="592" font-size="15" fill="#342E2A">• Showerhead: WaterSense 2.0 gal per min</text><text x="682" y="622" font-size="15" fill="#342E2A">• Shower valve: anti-scald, max 120°F</text><text x="682" y="652" font-size="15" fill="#342E2A">• Shower walls: water-resistant to 6 ft</text><text x="60" y="852" font-size="14" fill="#6E645C">Example only. Sources: Bob Vila (NKBA and code figures), HVI (fans), EPA WaterSense, NEC 210.8 (GFCI), IRC P2708 (showers). Local codes vary,</text><text x="60" y="874" font-size="14" fill="#6E645C">so check with your building department. Layout: our worked example.</text></svg>