<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" font-family="Poppins, sans-serif" role="img" aria-labelledby="vr-t vr-d"><title id="vr-t">How to store vinyl records: upright, supported and cool</title><desc id="vr-d">Left: records stored the right way, standing upright with full-height dividers every 4 to 6 inches, compared with records leaning at an angle or stacked flat, which can warp them. Right: the Library of Congress puts LPs at 35 to 45 pounds per shelf-foot, so a full 13-inch cube holds about 38 to 49 pounds by our estimate, against IKEA's listed 29 pound maximum load per KALLAX shelf, and a 3-foot shelf about 105 to 135 pounds. Library of Congress storage conditions: a steady 65 to 70 degrees F and 45 to 50 percent relative humidity, away from sunlight and heat.</desc><rect width="1200" height="900" fill="#F7F1E9"/><text x="60" y="80" font-size="42" font-weight="700" fill="#342E2A">Storing Vinyl, by the Numbers</text><text x="60" y="116" font-size="21" fill="#6E645C">How records should stand, and how much they weigh</text><text x="1140" y="30" font-size="18" fill="#6E645C" text-anchor="end">dailyspacehacks.com</text><rect x="60" y="150" width="520" height="620" rx="16" fill="#FFFFFF" stroke="#D8CBBB" stroke-width="2"/><text x="84" y="190" font-size="21" font-weight="700" fill="#342E2A">Upright, with dividers</text><rect x="90" y="400" width="460" height="10" fill="#B98A5E"/><rect x="100" y="230" width="12" height="170" fill="#C85A32" stroke="#FFFFFF" stroke-width="1"/><rect x="113" y="230" width="12" height="170" fill="#8FA689" stroke="#FFFFFF" stroke-width="1"/><rect x="126" y="230" width="12" height="170" fill="#E8B04A" stroke="#FFFFFF" stroke-width="1"/><rect x="139" y="230" width="12" height="170" fill="#6E645C" stroke="#FFFFFF" stroke-width="1"/><rect x="152" y="230" width="12" height="170" fill="#B98A5E" stroke="#FFFFFF" stroke-width="1"/><rect x="165" y="230" width="12" height="170" fill="#DCE5D6" stroke="#FFFFFF" stroke-width="1"/><rect x="178" y="230" width="12" height="170" fill="#C85A32" stroke="#FFFFFF" stroke-width="1"/><rect x="191" y="230" width="12" height="170" fill="#8FA689" stroke="#FFFFFF" stroke-width="1"/><rect x="204" y="230" width="12" height="170" fill="#E8B04A" stroke="#FFFFFF" stroke-width="1"/><rect x="217" y="222" width="8" height="178" fill="#342E2A"/><rect x="229" y="230" width="12" height="170" fill="#6E645C" stroke="#FFFFFF" stroke-width="1"/><rect x="242" y="230" width="12" height="170" fill="#B98A5E" stroke="#FFFFFF" stroke-width="1"/><rect x="255" y="230" width="12" height="170" fill="#DCE5D6" stroke="#FFFFFF" stroke-width="1"/><rect x="268" y="230" width="12" height="170" fill="#C85A32" stroke="#FFFFFF" stroke-width="1"/><rect x="281" y="230" width="12" height="170" fill="#8FA689" stroke="#FFFFFF" stroke-width="1"/><rect x="294" y="230" width="12" height="170" fill="#E8B04A" stroke="#FFFFFF" stroke-width="1"/><rect x="307" y="230" width="12" height="170" fill="#6E645C" stroke="#FFFFFF" stroke-width="1"/><rect x="320" y="230" width="12" height="170" fill="#B98A5E" stroke="#FFFFFF" stroke-width="1"/><rect x="333" y="230" width="12" height="170" fill="#DCE5D6" stroke="#FFFFFF" stroke-width="1"/><rect x="346" y="222" width="8" height="178" fill="#342E2A"/><rect x="358" y="230" width="12" height="170" fill="#C85A32" stroke="#FFFFFF" stroke-width="1"/><rect x="371" y="230" width="12" height="170" fill="#8FA689" stroke="#FFFFFF" stroke-width="1"/><rect x="384" y="230" width="12" height="170" fill="#E8B04A" stroke="#FFFFFF" stroke-width="1"/><rect x="397" y="230" width="12" height="170" fill="#6E645C" stroke="#FFFFFF" stroke-width="1"/><rect x="410" y="230" width="12" height="170" fill="#B98A5E" stroke="#FFFFFF" stroke-width="1"/><rect x="423" y="230" width="12" height="170" fill="#DCE5D6" stroke="#FFFFFF" stroke-width="1"/><rect x="436" y="230" width="12" height="170" fill="#C85A32" stroke="#FFFFFF" stroke-width="1"/><rect x="449" y="230" width="12" height="170" fill="#8FA689" stroke="#FFFFFF" stroke-width="1"/><rect x="462" y="230" width="12" height="170" fill="#E8B04A" stroke="#FFFFFF" stroke-width="1"/><rect x="475" y="222" width="8" height="178" fill="#342E2A"/><line x1="221" y1="430" x2="354" y2="430" stroke="#C85A32" stroke-width="2"/><text x="286" y="456" font-size="15" font-weight="700" fill="#C85A32" text-anchor="middle">dividers 4 to 6 in apart</text><text x="500" y="340" font-size="40" font-weight="700" fill="#8FA689" text-anchor="middle">✓</text><text x="84" y="500" font-size="21" font-weight="700" fill="#342E2A">Leaning or stacked flat</text><rect x="90" y="650" width="460" height="10" fill="#B98A5E"/><rect x="100" y="525" width="12" height="125" fill="#C85A32" transform="rotate(22 100 650)"/><rect x="114" y="525" width="12" height="125" fill="#8FA689" transform="rotate(22 114 650)"/><rect x="128" y="525" width="12" height="125" fill="#E8B04A" transform="rotate(22 128 650)"/><rect x="142" y="525" width="12" height="125" fill="#6E645C" transform="rotate(22 142 650)"/><rect x="156" y="525" width="12" height="125" fill="#B98A5E" transform="rotate(22 156 650)"/><rect x="170" y="525" width="12" height="125" fill="#DCE5D6" transform="rotate(22 170 650)"/><rect x="330" y="638" width="170" height="12" fill="#C85A32" stroke="#FFFFFF" stroke-width="1"/><rect x="330" y="625" width="170" height="12" fill="#8FA689" stroke="#FFFFFF" stroke-width="1"/><rect x="330" y="612" width="170" height="12" fill="#E8B04A" stroke="#FFFFFF" stroke-width="1"/><rect x="330" y="599" width="170" height="12" fill="#6E645C" stroke="#FFFFFF" stroke-width="1"/><rect x="330" y="586" width="170" height="12" fill="#B98A5E" stroke="#FFFFFF" stroke-width="1"/><rect x="330" y="573" width="170" height="12" fill="#DCE5D6" stroke="#FFFFFF" stroke-width="1"/><text x="530" y="590" font-size="40" font-weight="700" fill="#C85A32" text-anchor="middle">✗</text><text x="84" y="700" font-size="15" fill="#6E645C">Both put uneven weight on the discs and can warp them</text><text x="84" y="724" font-size="15" fill="#6E645C">(Library of Congress, National Archives)</text><rect x="620" y="150" width="520" height="380" rx="16" fill="#FFFFFF" stroke="#D8CBBB" stroke-width="2"/><text x="644" y="190" font-size="21" font-weight="700" fill="#342E2A">How much LPs weigh</text><text x="644" y="216" font-size="15" fill="#6E645C">35 to 45 lb per shelf-foot (Library of Congress)</text><text x="644" y="262" font-size="17" font-weight="700" fill="#342E2A">13-in cube, full</text><rect x="644" y="274" width="89.4" height="34" rx="6" fill="#ECCDA0"/><rect x="733.4" y="274" width="25.5" height="34" fill="#C85A32" opacity="0.55"/><text x="770.9" y="298" font-size="19" font-weight="700" fill="#342E2A">38-49 lb</text><text x="644" y="348" font-size="17" font-weight="700" fill="#342E2A">3-ft shelf, full</text><rect x="644" y="360" width="247.5" height="34" rx="6" fill="#ECCDA0"/><rect x="891.5" y="360" width="70.7" height="34" fill="#C85A32" opacity="0.55"/><text x="974.2" y="384" font-size="19" font-weight="700" fill="#342E2A">105-135 lb</text><line x1="712.4" y1="268" x2="712.4" y2="404" stroke="#342E2A" stroke-width="2" stroke-dasharray="6 4"/><text x="718.4" y="426" font-size="14" fill="#342E2A">29 lb: IKEA max load per KALLAX shelf</text><text x="644" y="464" font-size="14" fill="#6E645C">Cube and shelf totals: our estimate from the LoC figure.</text><rect x="620" y="550" width="520" height="220" rx="16" fill="#FFFFFF" stroke="#D8CBBB" stroke-width="2"/><text x="644" y="590" font-size="21" font-weight="700" fill="#342E2A">Where to keep them</text><rect x="644" y="612" width="8" height="26" rx="3" fill="#8FA689"/><text x="664" y="631" font-size="17" fill="#342E2A">Steady 65 to 70°F, 45 to 50% humidity</text><rect x="644" y="650" width="8" height="26" rx="3" fill="#E8B04A"/><text x="664" y="669" font-size="17" fill="#342E2A">Out of sunlight, away from heat</text><rect x="644" y="688" width="8" height="26" rx="3" fill="#C85A32"/><text x="664" y="707" font-size="17" fill="#342E2A">Not in the attic or garage</text><rect x="644" y="726" width="8" height="26" rx="3" fill="#B98A5E"/><text x="664" y="745" font-size="17" fill="#342E2A">Off the floor, never in a hot car</text><text x="60" y="820" font-size="14" fill="#6E645C">Sources: Library of Congress "Cylinder, Disc and Tape Care in a Nutshell"; National Archives; IKEA KALLAX product page.</text><text x="60" y="842" font-size="14" fill="#6E645C">Example only: check the rated load of your own shelf before filling it.</text></svg>