<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" font-family="Poppins, sans-serif" role="img" aria-labelledby="bb-t bb-d"><title id="bb-t">How to measure for baseboard</title><desc id="bb-d">How to work out baseboard for a 12 by 14 foot room with one door. Add the four walls: 12 + 14 + 12 + 14 = 52 feet. Take off about 3 feet for the doorway: 49 feet. Add 10 percent for waste and cuts: about 54 feet. That is five 12 foot boards.</desc><rect width="1200" height="900" fill="#F7F1E9"/><text x="60" y="84" font-size="44" font-weight="700" fill="#342E2A">How to Measure for Baseboard</text><text x="60" y="124" font-size="22" fill="#6E645C">Example: a 12 x 14 ft room with one door</text><text x="1140" y="60" font-size="18" fill="#6E645C" text-anchor="end">dailyspacehacks.com</text><rect x="110" y="200" width="420" height="360" fill="#FBF8F3" stroke="#8FA689" stroke-width="14"/><rect x="370.4" y="551" width="90" height="18" fill="#FBF8F3"/><path d="M370.4 560 A90 90 0 0 1 460.4 470" fill="none" stroke="#6E645C" stroke-width="2" stroke-dasharray="5 5"/><line x1="460.4" y1="560" x2="460.4" y2="470" stroke="#6E645C" stroke-width="3"/><text x="415.4" y="594" font-size="16" fill="#C85A32" font-weight="700" text-anchor="middle">door: minus 3 ft</text><text x="320.0" y="178" font-size="20" font-weight="700" fill="#342E2A" text-anchor="middle">14 ft</text><text x="215.0" y="594" font-size="20" font-weight="700" fill="#342E2A" text-anchor="middle">14 ft</text><text x="88" y="380.0" font-size="20" font-weight="700" fill="#342E2A" text-anchor="middle" transform="rotate(-90 88 380.0)">12 ft</text><text x="560" y="380.0" font-size="20" font-weight="700" fill="#342E2A" text-anchor="middle" transform="rotate(90 560 380.0)">12 ft</text><text x="320.0" y="374.0" font-size="20" fill="#3F5E39" text-anchor="middle">baseboard runs along</text><text x="320.0" y="402.0" font-size="20" fill="#3F5E39" text-anchor="middle">every wall</text><rect x="640" y="210" width="500" height="96" rx="16" fill="#fff" stroke="#E6DCCF" stroke-width="2"/><circle cx="688" cy="258" r="26" fill="#342E2A"/><text x="688" y="267" font-size="24" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="732" y="252" font-size="22" font-weight="700" fill="#342E2A">Add up the walls</text><text x="732" y="284" font-size="20" fill="#C85A32" font-weight="700">12 + 14 + 12 + 14 = 52 ft</text><rect x="640" y="328" width="500" height="96" rx="16" fill="#fff" stroke="#E6DCCF" stroke-width="2"/><circle cx="688" cy="376" r="26" fill="#342E2A"/><text x="688" y="385" font-size="24" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="732" y="370" font-size="22" font-weight="700" fill="#342E2A">Take off the doorways</text><text x="732" y="402" font-size="20" fill="#C85A32" font-weight="700">52 − 3 = 49 ft</text><rect x="640" y="446" width="500" height="96" rx="16" fill="#fff" stroke="#E6DCCF" stroke-width="2"/><circle cx="688" cy="494" r="26" fill="#342E2A"/><text x="688" y="503" font-size="24" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="732" y="488" font-size="22" font-weight="700" fill="#342E2A">Add 10% for waste</text><text x="732" y="520" font-size="20" fill="#C85A32" font-weight="700">49 x 1.1 = about 54 ft</text><rect x="640" y="564" width="500" height="96" rx="16" fill="#fff" stroke="#E6DCCF" stroke-width="2"/><circle cx="688" cy="612" r="26" fill="#342E2A"/><text x="688" y="621" font-size="24" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="732" y="606" font-size="22" font-weight="700" fill="#342E2A">Round up to boards</text><text x="732" y="638" font-size="20" fill="#C85A32" font-weight="700">54 ÷ 12 = 4.5, so buy 5 boards of 12 ft</text><rect x="110" y="700" width="1030" height="110" rx="16" fill="#CFDDCB"/><text x="140" y="744" font-size="21" fill="#342E2A" font-weight="700">Tip: buy boards as long as your longest wall.</text><text x="140" y="780" font-size="19" fill="#6E645C">Cope inside corners, miter outside corners at 45 degrees, and nail into studs about every 16 in.</text></svg>