<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" font-family="Poppins, sans-serif" role="img" aria-labelledby="mb-t mb-d"><title id="mb-t">Moving box sizes and what to pack in each</title><desc id="mb-d">Six common moving boxes drawn from the front with typical sizes and what to pack in each. Small box, about 16 by 12.5 by 12.5 inches, 1.5 cubic feet: books, dishes, canned food and tools. Medium box, 18 by 18 by 16 inches, 3 cubic feet: kitchen items, toys, decor and shoes. Large box, 18 by 18 by 24 inches, 4.5 cubic feet: bedding, towels and pillows. Extra-large box, 24 by 18 by 24 inches, 6 cubic feet: comforters and light bulky items. Wardrobe box, about 24 inches wide, with a hanging bar: clothes on hangers. Dish pack, about 18 by 18 by 28 inches with double walls and dividers: plates and glasses. Rule: the heavier the item, the smaller the box.</desc><rect width="1200" height="900" fill="#F7F1E9"/><text x="60" y="88" font-size="44" font-weight="700" fill="#342E2A">Moving Box Sizes</text><text x="60" y="130" font-size="22" fill="#6E645C">Typical sizes. The heavier the item, the smaller the box.</text><text x="1140" y="60" font-size="18" fill="#6E645C" text-anchor="end">dailyspacehacks.com</text><line x1="40" y1="600" x2="1160" y2="600" stroke="#342E2A" stroke-width="4"/><polygon points="76,497.6 182.0,497.6 166.0,513.6 60,513.6" fill="#E8CFA6" stroke="#8C6A45" stroke-width="2"/><polygon points="166.0,513.6 182.0,497.6 182.0,584 166.0,600" fill="#C29A6B" stroke="#8C6A45" stroke-width="2"/><rect x="60" y="513.6" width="106.0" height="86.4" fill="#D9B48A" stroke="#8C6A45" stroke-width="2"/><rect x="104.0" y="513.6" width="18" height="25.9" fill="#EFE3CF" opacity=".9"/><text x="113.0" y="636" font-size="21" font-weight="700" fill="#342E2A" text-anchor="middle">Small</text><text x="113.0" y="662" font-size="16" fill="#C85A32" font-weight="700" text-anchor="middle">16.4 x 12.6 x 12.6 in</text><text x="113.0" y="684" font-size="15" fill="#6E645C" text-anchor="middle">1.5 cu ft</text><text x="113.0" y="716" font-size="15" fill="#342E2A" text-anchor="middle">Books</text><text x="113.0" y="738" font-size="15" fill="#342E2A" text-anchor="middle">Dishes</text><text x="113.0" y="760" font-size="15" fill="#342E2A" text-anchor="middle">Canned food</text><text x="113.0" y="782" font-size="15" fill="#342E2A" text-anchor="middle">Tools</text><polygon points="224.0,468.8 343.2,468.8 327.2,484.8 208.0,484.8" fill="#E8CFA6" stroke="#8C6A45" stroke-width="2"/><polygon points="327.2,484.8 343.2,468.8 343.2,584 327.2,600" fill="#C29A6B" stroke="#8C6A45" stroke-width="2"/><rect x="208.0" y="484.8" width="119.2" height="115.2" fill="#D9B48A" stroke="#8C6A45" stroke-width="2"/><rect x="258.6" y="484.8" width="18" height="34.6" fill="#EFE3CF" opacity=".9"/><text x="267.6" y="636" font-size="21" font-weight="700" fill="#342E2A" text-anchor="middle">Medium</text><text x="267.6" y="662" font-size="16" fill="#C85A32" font-weight="700" text-anchor="middle">18 x 18 x 16 in</text><text x="267.6" y="684" font-size="15" fill="#6E645C" text-anchor="middle">3 cu ft</text><text x="267.6" y="716" font-size="15" fill="#342E2A" text-anchor="middle">Kitchen items</text><text x="267.6" y="738" font-size="15" fill="#342E2A" text-anchor="middle">Toys</text><text x="267.6" y="760" font-size="15" fill="#342E2A" text-anchor="middle">Decor</text><text x="267.6" y="782" font-size="15" fill="#342E2A" text-anchor="middle">Shoes</text><polygon points="385.2,411.2 504.4,411.2 488.4,427.2 369.2,427.2" fill="#E8CFA6" stroke="#8C6A45" stroke-width="2"/><polygon points="488.4,427.2 504.4,411.2 504.4,584 488.4,600" fill="#C29A6B" stroke="#8C6A45" stroke-width="2"/><rect x="369.2" y="427.2" width="119.2" height="172.8" fill="#D9B48A" stroke="#8C6A45" stroke-width="2"/><rect x="419.8" y="427.2" width="18" height="40" fill="#EFE3CF" opacity=".9"/><text x="428.8" y="636" font-size="21" font-weight="700" fill="#342E2A" text-anchor="middle">Large</text><text x="428.8" y="662" font-size="16" fill="#C85A32" font-weight="700" text-anchor="middle">18 x 18 x 24 in</text><text x="428.8" y="684" font-size="15" fill="#6E645C" text-anchor="middle">4.5 cu ft</text><text x="428.8" y="716" font-size="15" fill="#342E2A" text-anchor="middle">Bedding</text><text x="428.8" y="738" font-size="15" fill="#342E2A" text-anchor="middle">Towels</text><text x="428.8" y="760" font-size="15" fill="#342E2A" text-anchor="middle">Pillows</text><text x="428.8" y="782" font-size="15" fill="#342E2A" text-anchor="middle">Lampshades</text><polygon points="546.4,411.2 705.4,411.2 689.4,427.2 530.4,427.2" fill="#E8CFA6" stroke="#8C6A45" stroke-width="2"/><polygon points="689.4,427.2 705.4,411.2 705.4,584 689.4,600" fill="#C29A6B" stroke="#8C6A45" stroke-width="2"/><rect x="530.4" y="427.2" width="159.0" height="172.8" fill="#D9B48A" stroke="#8C6A45" stroke-width="2"/><rect x="600.9" y="427.2" width="18" height="40" fill="#EFE3CF" opacity=".9"/><text x="609.9" y="636" font-size="21" font-weight="700" fill="#342E2A" text-anchor="middle">Extra-large</text><text x="609.9" y="662" font-size="16" fill="#C85A32" font-weight="700" text-anchor="middle">24 x 18 x 24 in</text><text x="609.9" y="684" font-size="15" fill="#6E645C" text-anchor="middle">6 cu ft</text><text x="609.9" y="716" font-size="15" fill="#342E2A" text-anchor="middle">Comforters</text><text x="609.9" y="738" font-size="15" fill="#342E2A" text-anchor="middle">Cushions</text><text x="609.9" y="760" font-size="15" fill="#342E2A" text-anchor="middle">Light, bulky</text><text x="609.9" y="782" font-size="15" fill="#342E2A" text-anchor="middle">items</text><polygon points="747.4,238.4 906.4,238.4 890.4,254.4 731.4,254.4" fill="#E8CFA6" stroke="#8C6A45" stroke-width="2"/><polygon points="890.4,254.4 906.4,238.4 906.4,584 890.4,600" fill="#C29A6B" stroke="#8C6A45" stroke-width="2"/><rect x="731.4" y="254.4" width="159.0" height="345.6" fill="#D9B48A" stroke="#8C6A45" stroke-width="2"/><line x1="741.4" y1="284.4" x2="880.4" y2="284.4" stroke="#342E2A" stroke-width="4"/><path d="M759.4,284.4 q-6,-10 0,-14 q6,4 0,14 l-18,18 h36 z" fill="none" stroke="#342E2A" stroke-width="2"/><rect x="743.4" y="302.4" width="32" height="265.6" rx="6" fill="#8FA689" stroke="#7E9578" stroke-width="1.5"/><path d="M793.7,284.4 q-6,-10 0,-14 q6,4 0,14 l-18,18 h36 z" fill="none" stroke="#342E2A" stroke-width="2"/><rect x="777.7" y="302.4" width="32" height="265.6" rx="6" fill="#DCE5D6" stroke="#7E9578" stroke-width="1.5"/><path d="M828.1,284.4 q-6,-10 0,-14 q6,4 0,14 l-18,18 h36 z" fill="none" stroke="#342E2A" stroke-width="2"/><rect x="812.1" y="302.4" width="32" height="265.6" rx="6" fill="#8FA689" stroke="#7E9578" stroke-width="1.5"/><path d="M862.4,284.4 q-6,-10 0,-14 q6,4 0,14 l-18,18 h36 z" fill="none" stroke="#342E2A" stroke-width="2"/><rect x="846.4" y="302.4" width="32" height="265.6" rx="6" fill="#DCE5D6" stroke="#7E9578" stroke-width="1.5"/><text x="810.9" y="636" font-size="21" font-weight="700" fill="#342E2A" text-anchor="middle">Wardrobe</text><text x="810.9" y="662" font-size="16" fill="#C85A32" font-weight="700" text-anchor="middle">about 24 in wide</text><text x="810.9" y="684" font-size="15" fill="#6E645C" text-anchor="middle">with a hanging bar</text><text x="810.9" y="716" font-size="15" fill="#342E2A" text-anchor="middle">Clothes on</text><text x="810.9" y="738" font-size="15" fill="#342E2A" text-anchor="middle">hangers</text><polygon points="948.4,382.4 1067.6,382.4 1051.6,398.4 932.4,398.4" fill="#E8CFA6" stroke="#8C6A45" stroke-width="2"/><polygon points="1051.6,398.4 1067.6,382.4 1067.6,584 1051.6,600" fill="#C29A6B" stroke="#8C6A45" stroke-width="2"/><rect x="932.4" y="398.4" width="119.2" height="201.6" fill="#D9B48A" stroke="#8C6A45" stroke-width="2"/><rect x="983.0" y="398.4" width="18" height="40" fill="#EFE3CF" opacity=".9"/><line x1="932.4" y1="465.6" x2="1051.6" y2="465.6" stroke="#8C6A45" stroke-width="1.5" stroke-dasharray="6 5"/><line x1="932.4" y1="532.8" x2="1051.6" y2="532.8" stroke="#8C6A45" stroke-width="1.5" stroke-dasharray="6 5"/><text x="992.0" y="636" font-size="21" font-weight="700" fill="#342E2A" text-anchor="middle">Dish pack</text><text x="992.0" y="662" font-size="16" fill="#C85A32" font-weight="700" text-anchor="middle">about 18 x 18 x 28 in</text><text x="992.0" y="684" font-size="15" fill="#6E645C" text-anchor="middle">double-wall</text><text x="992.0" y="716" font-size="15" fill="#342E2A" text-anchor="middle">Plates</text><text x="992.0" y="738" font-size="15" fill="#342E2A" text-anchor="middle">Glasses</text><text x="992.0" y="760" font-size="15" fill="#342E2A" text-anchor="middle">with dividers</text><line x1="60" y1="215" x2="690" y2="215" stroke="#C85A32" stroke-width="3"/><polygon points="690,207 706,215 690,223" fill="#C85A32"/><text x="60" y="201" font-size="17" font-weight="700" fill="#C85A32">Small to extra-large: the bigger the box, the lighter the items</text><text x="60" y="880" font-size="14" fill="#6E645C">Typical US moving box sizes (U-Haul). Sizes vary by store; keep every box light enough to lift safely.</text></svg>