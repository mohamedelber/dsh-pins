<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" font-family="Poppins, sans-serif" role="img" aria-labelledby="al-t al-d"><title id="al-t">Alcove shelving measurements</title><desc id="al-d">Left: front view of an example 100 cm wide alcove beside a chimney breast, with a cupboard below and four shelves above spaced about 30 cm apart, a 150 mm cable zone marked along the ceiling and the corners, and a note that 18 mm MDF starts to sag visibly at about 600 to 700 mm, so wider alcoves need 25 mm boards or a mid support. Right: shelf depth compared with a typical alcove depth of 300 to 450 mm: books 200 to 250 mm, media and storage 300 to 400 mm, a drinks cabinet 300 to 350 mm, and a hanging wardrobe at least 600 mm, which stands proud of most alcoves.</desc><rect width="1200" height="900" fill="#F7F1E9"/><text x="60" y="80" font-size="42" font-weight="700" fill="#342E2A">An Alcove, Measured</text><text x="60" y="116" font-size="21" fill="#6E645C">Shelf spacing, spans and depths for a UK chimney-breast alcove</text><text x="1140" y="30" font-size="18" fill="#6E645C" text-anchor="end">dailyspacehacks.com</text><rect x="80" y="165" width="70" height="552" fill="#DCE5D6" stroke="#D8CBBB"/><text x="115" y="441" font-size="14" fill="#6E645C" text-anchor="middle" transform="rotate(-90 115 441)">chimney breast</text><rect x="150" y="165" width="230" height="552" fill="#FFFFFF" stroke="#342E2A" stroke-width="3"/><rect x="150" y="165" width="230" height="34.5" fill="#C85A32" opacity="0.15"/><rect x="150" y="165" width="34.5" height="552" fill="#C85A32" opacity="0.15"/><rect x="345.5" y="165" width="34.5" height="552" fill="#C85A32" opacity="0.15"/><rect x="150" y="522" width="230" height="195" fill="#8FA689" stroke="#342E2A" stroke-width="2"/><line x1="265" y1="528" x2="265" y2="713.0" stroke="#342E2A" stroke-width="2"/><rect x="146" y="514" width="238" height="8" fill="#C9A06B"/><rect x="150" y="446" width="230" height="7" fill="#C9A06B"/><rect x="150" y="378" width="230" height="7" fill="#C9A06B"/><rect x="150" y="309" width="230" height="7" fill="#C9A06B"/><rect x="150" y="240" width="230" height="7" fill="#C9A06B"/><line x1="398.0" y1="452" x2="398.0" y2="384" stroke="#C85A32" stroke-width="2"/><text x="406.0" y="423" font-size="15" font-weight="700" fill="#C85A32">~30 cm</text><line x1="150" y1="739.0" x2="380" y2="739.0" stroke="#342E2A" stroke-width="2"/><text x="265" y="763.0" font-size="15" font-weight="700" fill="#342E2A" text-anchor="middle">example: 100 cm wide</text><text x="265" y="619" font-size="14" fill="#FFFFFF" text-anchor="middle">cupboard</text><rect x="480.0" y="187" width="8" height="48" rx="3" fill="#C85A32"/><text x="498.0" y="205" font-size="15" font-weight="700" fill="#342E2A">Cable zone: 150 mm from</text><text x="498.0" y="227" font-size="15" fill="#6E645C">ceiling and corners</text><rect x="480.0" y="279" width="8" height="48" rx="3" fill="#C9A06B"/><text x="498.0" y="297" font-size="15" font-weight="700" fill="#342E2A">Shelves 20 to 30 cm</text><text x="498.0" y="319" font-size="15" fill="#6E645C">apart for books</text><rect x="480.0" y="371" width="8" height="48" rx="3" fill="#342E2A"/><text x="498.0" y="389" font-size="15" font-weight="700" fill="#342E2A">18 mm MDF sags at</text><text x="498.0" y="411" font-size="15" fill="#6E645C">about 600-700 mm</text><rect x="480.0" y="463" width="8" height="48" rx="3" fill="#342E2A"/><text x="498.0" y="481" font-size="15" font-weight="700" fill="#342E2A">Over 800 mm span?</text><text x="498.0" y="503" font-size="15" fill="#6E645C">25 mm board or a support</text><rect x="700" y="150" width="440" height="610" rx="16" fill="#FFFFFF" stroke="#D8CBBB" stroke-width="2"/><text x="724" y="190" font-size="21" font-weight="700" fill="#342E2A">How deep? (mm)</text><text x="724" y="216" font-size="15" fill="#6E645C">Shaded band: typical alcove depth 300-450 mm</text><rect x="859.0" y="232" width="67.5" height="440" fill="#ECCDA0" opacity="0.55"/><text x="724" y="262" font-size="17" font-weight="700" fill="#342E2A">Books</text><rect x="724" y="274" width="90.0" height="30" rx="5" fill="#8FA689"/><rect x="814.0" y="274" width="22.5" height="30" fill="#8FA689" opacity="0.5"/><text x="846.5" y="296" font-size="16" font-weight="700" fill="#342E2A">200-250</text><text x="724" y="362" font-size="17" font-weight="700" fill="#342E2A">Media, storage</text><rect x="724" y="374" width="135.0" height="30" rx="5" fill="#8FA689"/><rect x="859.0" y="374" width="45.0" height="30" fill="#8FA689" opacity="0.5"/><text x="914.0" y="396" font-size="16" font-weight="700" fill="#342E2A">300-400</text><text x="724" y="462" font-size="17" font-weight="700" fill="#342E2A">Drinks cabinet</text><rect x="724" y="474" width="135.0" height="30" rx="5" fill="#8FA689"/><rect x="859.0" y="474" width="22.5" height="30" fill="#8FA689" opacity="0.5"/><text x="891.5" y="496" font-size="16" font-weight="700" fill="#342E2A">300-350</text><text x="724" y="562" font-size="17" font-weight="700" fill="#342E2A">Hanging wardrobe</text><rect x="724" y="574" width="270.0" height="30" rx="5" fill="#C85A32"/><rect x="994.0" y="574" width="36.0" height="30" fill="#C85A32" opacity="0.5"/><text x="1040.0" y="596" font-size="16" font-weight="700" fill="#342E2A">600-680</text><text x="724" y="666" font-size="14" fill="#6E645C">A wardrobe usually stands proud of the</text><text x="724" y="686" font-size="14" fill="#6E645C">chimney breast unless the alcove is deep.</text><text x="60" y="830" font-size="14" fill="#6E645C">Example layout only; measure your own alcove. Sources: Squote (depths, MDF sag), Bookabuilder and Homebuilding &amp; Renovating (shelf depths),</text><text x="60" y="852" font-size="14" fill="#6E645C">Hunker (spacing), FCI London (wardrobe depth), wiring regulations guidance (cable zones).</text></svg>