<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" font-family="Poppins, sans-serif" role="img" aria-labelledby="wa-t wa-d"><title id="wa-t">Front loader vs top loader in numbers</title><desc id="wa-d">Front loader versus top loader in numbers. Water for a normal cold wash in CHOICE tests of 8 kg machines: front loaders averaged about 56 litres, top loaders about 119 litres. Cycle time: front loaders averaged about 131 minutes, top loaders about 62 minutes. Fastest spin speeds: front loaders up to 1600 rpm, top loaders up to 1100 rpm. Space: a front loader can sit under a benchtop or have a dryer stacked on it, while a top loader needs clear space above for the lid, about 1440 to 1470 mm high with the lid open on one Fisher and Paykel model.</desc><rect width="1200" height="900" fill="#F7F1E9"/><text x="60" y="80" font-size="42" font-weight="700" fill="#342E2A">Front Loader vs Top Loader in Numbers</text><text x="60" y="116" font-size="21" fill="#6E645C">Typical figures from Australian tests and product guides</text><text x="1140" y="30" font-size="18" fill="#6E645C" text-anchor="end">dailyspacehacks.com</text><text x="60" y="190" font-size="20" font-weight="700" fill="#342E2A">Water per cold wash</text><text x="60" y="216" font-size="15" fill="#6E645C">litres, CHOICE average, 8 kg machines</text><text x="458" y="192" font-size="16" fill="#342E2A" text-anchor="end">Front</text><rect x="470" y="174" width="189.5" height="26" rx="6" fill="#8FA689"/><text x="669.5" y="193" font-size="17" font-weight="700" fill="#342E2A">56 L</text><text x="458" y="232" font-size="16" fill="#342E2A" text-anchor="end">Top</text><rect x="470" y="214" width="402.8" height="26" rx="6" fill="#C85A32"/><text x="882.8" y="233" font-size="17" font-weight="700" fill="#342E2A">119 L</text><text x="60" y="320" font-size="20" font-weight="700" fill="#342E2A">Cycle time</text><text x="60" y="346" font-size="15" fill="#6E645C">minutes, CHOICE average</text><text x="458" y="322" font-size="16" fill="#342E2A" text-anchor="end">Front</text><rect x="470" y="304" width="411.7" height="26" rx="6" fill="#8FA689"/><text x="891.7" y="323" font-size="17" font-weight="700" fill="#342E2A">131 min</text><text x="458" y="362" font-size="16" fill="#342E2A" text-anchor="end">Top</text><rect x="470" y="344" width="194.9" height="26" rx="6" fill="#C85A32"/><text x="674.9" y="363" font-size="17" font-weight="700" fill="#342E2A">62 min</text><text x="60" y="450" font-size="20" font-weight="700" fill="#342E2A">Fastest spin speed</text><text x="60" y="476" font-size="15" fill="#6E645C">rpm, faster spin = shorter drying</text><text x="458" y="452" font-size="16" fill="#342E2A" text-anchor="end">Front</text><rect x="470" y="434" width="414.1" height="26" rx="6" fill="#8FA689"/><text x="894.1" y="453" font-size="17" font-weight="700" fill="#342E2A">1,600 rpm</text><text x="458" y="492" font-size="16" fill="#342E2A" text-anchor="end">Top</text><rect x="470" y="474" width="284.7" height="26" rx="6" fill="#C85A32"/><text x="764.7" y="493" font-size="17" font-weight="700" fill="#342E2A">1,100 rpm</text><rect x="60" y="570" width="1080" height="230" rx="14" fill="#FFFFFF" stroke="#D8CBBB" stroke-width="2"/><text x="84" y="608" font-size="20" font-weight="700" fill="#342E2A">Space</text><rect x="90" y="640" width="200" height="12" fill="#D9B48A"/><rect x="110" y="652" width="120" height="120" rx="6" fill="#FFFFFF" stroke="#342E2A" stroke-width="2"/><circle cx="170" cy="716" r="36" fill="#DCE5D6" stroke="#342E2A" stroke-width="2"/><text x="340" y="680" font-size="17" font-weight="700" fill="#342E2A">Front loader</text><text x="340" y="708" font-size="15" fill="#6E645C">Fits under a benchtop</text><text x="340" y="732" font-size="15" fill="#6E645C">A dryer can stack on top</text><text x="340" y="756" font-size="15" fill="#6E645C">Loading means bending</text><rect x="640" y="652" width="120" height="120" rx="6" fill="#FFFFFF" stroke="#342E2A" stroke-width="2"/><line x1="646" y1="652" x2="670" y2="582" stroke="#342E2A" stroke-width="4" stroke-linecap="round"/><line x1="790" y1="582" x2="790" y2="772" stroke="#C85A32" stroke-width="2"/><line x1="782" y1="582" x2="798" y2="582" stroke="#C85A32" stroke-width="2"/><line x1="782" y1="772" x2="798" y2="772" stroke="#C85A32" stroke-width="2"/><text x="806" y="680" font-size="17" font-weight="700" fill="#342E2A">Top loader</text><text x="806" y="708" font-size="15" fill="#6E645C">Needs clear space above</text><text x="806" y="732" font-size="15" fill="#6E645C">Lid open: about 1,440 to</text><text x="806" y="756" font-size="15" fill="#6E645C">1,470 mm on one F&amp;P model</text><text x="806" y="780" font-size="15" fill="#6E645C">Loads from above</text><text x="60" y="842" font-size="14" fill="#6E645C">Sources: CHOICE test averages (water, time), Appliances Online (spin), Fisher &amp; Paykel WA1068G2 guide (lid height). Individual models vary.</text></svg>