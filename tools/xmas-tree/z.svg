<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" font-family="Poppins, sans-serif" role="img" aria-labelledby="xt-t xt-d"><title id="xt-t">Will your Christmas tree bag fit the closet?</title><desc id="xt-d">Side view, to scale, of three ways to store a 7.5 foot artificial tree in a closet with a 96 inch (8 foot) ceiling. A rolling duffel bag of about 51 by 15.5 by 23.5 inches lying flat takes 51 inches of floor; stood on end it needs 51 inches of height and a footprint of about 15.5 by 23.5 inches. An upright storage bag with a rolling stand, about 89 inches tall, 50 inches wide and 30 inches deep, keeps the tree assembled but needs a 50 by 30 inch footprint and at least 89 inches of height. Typical section counts: trees of 5 feet and under have 2 sections, 6 to 8 feet have 3, and 9 feet and up have 4 to 5.</desc><rect width="1200" height="900" fill="#F7F1E9"/><text x="60" y="80" font-size="42" font-weight="700" fill="#342E2A">Will the Tree Bag Fit Your Closet?</text><text x="60" y="116" font-size="21" fill="#6E645C">Bag sizes for a 7.5 ft tree, drawn to scale against an 8 ft ceiling</text><text x="1140" y="30" font-size="18" fill="#6E645C" text-anchor="end">dailyspacehacks.com</text><rect x="60" y="195" width="1080" height="6" fill="#D8CBBB"/><text x="70" y="223" font-size="15" fill="#6E645C">8 ft ceiling (96 in)</text><rect x="60" y="700" width="1080" height="8" fill="#B98A5E"/><rect x="90" y="577.8" width="265.2" height="122.2" rx="10" fill="#4F6B4A" opacity="0.9"/><text x="222.6" y="740" font-size="17" font-weight="700" fill="#342E2A" text-anchor="middle">Duffel, lying flat</text><text x="222.6" y="764" font-size="14" fill="#6E645C" text-anchor="middle">51 in of floor, 23.5 in high</text><rect x="470" y="434.8" width="80.6" height="265.2" rx="10" fill="#4F6B4A" opacity="0.9"/><text x="510.3" y="740" font-size="17" font-weight="700" fill="#342E2A" text-anchor="middle">Duffel, on end</text><text x="510.3" y="764" font-size="14" fill="#6E645C" text-anchor="middle">15.5 x 23.5 in footprint</text><rect x="800" y="237.2" width="260.0" height="462.8" rx="10" fill="#8FA689" opacity="0.9"/><text x="930.0" y="740" font-size="17" font-weight="700" fill="#342E2A" text-anchor="middle">Upright bag</text><text x="930.0" y="764" font-size="14" fill="#6E645C" text-anchor="middle">50 x 30 in footprint, 89 in tall</text><polygon points="930,253 816,658 1044,658" fill="#4F6B4A" opacity="0.5"/><line x1="565" y1="700" x2="565" y2="435" stroke="#C85A32" stroke-width="2"/><text x="573" y="570" font-size="16" font-weight="700" fill="#C85A32">51 in</text><line x1="1074" y1="700" x2="1074" y2="237" stroke="#C85A32" stroke-width="2"/><text x="1080" y="466" font-size="16" font-weight="700" fill="#C85A32" transform="rotate(-90 1088 466)">89 in</text><rect x="90" y="250" width="330" height="150" rx="14" fill="#FFFFFF" stroke="#D8CBBB" stroke-width="2"/><text x="110" y="284" font-size="18" font-weight="700" fill="#342E2A">Typical sections by tree height</text><text x="110" y="318" font-size="16" fill="#342E2A">5 ft and under: 2 sections</text><text x="110" y="346" font-size="16" fill="#342E2A">6 to 8 ft: 3 sections</text><text x="110" y="374" font-size="16" fill="#342E2A">9 ft and up: 4 to 5 sections</text><text x="60" y="820" font-size="14" fill="#6E645C">Bag sizes from Home Depot listings (Simple Living Solutions rolling bag; TreeKeeper upright bag with rolling stand). Sections: Treetime.</text><text x="60" y="842" font-size="14" fill="#6E645C">Example only: measure your closet and check the bag listing for your tree height and width.</text></svg>