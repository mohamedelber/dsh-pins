<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" font-family="Poppins, sans-serif" role="img" aria-labelledby="hw-t hw-d"><title id="hw-t">Hallway heights and widths, measured</title><desc id="hw-d">Left: elevation of a hallway wall 240 cm high, with a dado rail at 85 to 100 cm, roughly a third of the wall height, picture-frame panels below it with 3 to 7 cm gaps, wall lights at 170 to 180 cm and a picture centred at 145 cm. Right: plan of an example 100 cm wide hall. A 30 cm deep console leaves 70 cm, less than the 75 cm that new-home guidance allows beside a short obstruction such as a radiator, so a 20 to 25 cm shelf suits halls this narrow. A runner leaving 10 to 13 cm of floor each side is about 74 to 80 cm wide.</desc><rect width="1200" height="900" fill="#F7F1E9"/><text x="60" y="80" font-size="42" font-weight="700" fill="#342E2A">A Hallway, Measured</text><text x="60" y="116" font-size="21" fill="#6E645C">The heights and widths that make hallway ideas work</text><text x="1140" y="30" font-size="18" fill="#6E645C" text-anchor="end">dailyspacehacks.com</text><rect x="80" y="160.0" width="300.0" height="600.0" fill="#FBF7F0" stroke="#342E2A" stroke-width="3"/><rect x="80" y="530.0" width="300.0" height="230.0" fill="#8FA689"/><rect x="80" y="525.0" width="300.0" height="8" fill="#6F8A69"/><rect x="92" y="550" width="83" height="180" fill="none" stroke="#E9EFE6" stroke-width="3"/><rect x="188" y="550" width="83" height="180" fill="none" stroke="#E9EFE6" stroke-width="3"/><rect x="284" y="550" width="83" height="180" fill="none" stroke="#E9EFE6" stroke-width="3"/><rect x="190" y="348" width="80" height="100" fill="#ECCDA0" stroke="#C9A06B" stroke-width="4"/><circle cx="115" cy="322" r="11" fill="#FFE6B0" stroke="#C85A32" stroke-width="3"/><circle cx="345.0" cy="322" r="11" fill="#FFE6B0" stroke="#C85A32" stroke-width="3"/><rect x="70" y="760" width="320.0" height="8" fill="#B98A5E"/><line x1="440.0" y1="760" x2="440.0" y2="530" stroke="#C85A32" stroke-width="2"/><line x1="434.0" y1="530" x2="446.0" y2="530" stroke="#C85A32" stroke-width="2"/><text x="452.0" y="535" font-size="15" font-weight="700" fill="#C85A32">Dado rail 85-100 cm (roughly 1/3)</text><line x1="420.0" y1="760" x2="420.0" y2="398" stroke="#342E2A" stroke-width="2"/><line x1="414.0" y1="398" x2="426.0" y2="398" stroke="#342E2A" stroke-width="2"/><text x="432.0" y="402" font-size="15" font-weight="700" fill="#342E2A">Picture centre 145 cm</text><line x1="400.0" y1="760" x2="400.0" y2="322" stroke="#C85A32" stroke-width="2"/><line x1="394.0" y1="322" x2="406.0" y2="322" stroke="#C85A32" stroke-width="2"/><text x="412.0" y="328" font-size="15" font-weight="700" fill="#C85A32">Wall lights 170-180 cm</text><text x="80" y="796" font-size="15" fill="#6E645C">Picture-frame panels: leave 3-7 cm between boxes</text><rect x="736" y="150" width="404" height="640" rx="16" fill="#FFFFFF" stroke="#D8CBBB" stroke-width="2"/><text x="760" y="190" font-size="21" font-weight="700" fill="#342E2A">Plan: a 100 cm wide hall</text><rect x="760" y="230" width="300.0" height="420.0" fill="#FBF7F0" stroke="#342E2A" stroke-width="3"/><rect x="760" y="260" width="90.0" height="210.0" fill="#C9A06B"/><text x="805.0" y="365.0" font-size="13" fill="#342E2A" text-anchor="middle" transform="rotate(-90 805.0 365.0)">30 cm console</text><line x1="850.0" y1="380.0" x2="1060.0" y2="380.0" stroke="#C85A32" stroke-width="2"/><text x="955.0" y="372.0" font-size="15" font-weight="700" fill="#C85A32" text-anchor="middle">70 cm left</text><rect x="793.0" y="530.0" width="234.0" height="100" fill="#DCE5D6" stroke="#8FA689" stroke-width="2"/><text x="910.0" y="586.0" font-size="14" fill="#342E2A" text-anchor="middle">runner ~78 cm wide</text><text x="760" y="690.0" font-size="14" fill="#6E645C">New-home guidance: obstructions such</text><text x="760" y="712.0" font-size="14" fill="#6E645C">as radiators may narrow a hall to 750 mm.</text><text x="760" y="734.0" font-size="14" fill="#6E645C">Under ~1 m wide? A 20-25 cm shelf fits better.</text><text x="760" y="756.0" font-size="14" fill="#342E2A">Runners: leave 10-13 cm of floor each side.</text><text x="60" y="850" font-size="14" fill="#6E645C">Example only. Sources: Ideal Home (dado height), Orac (panel gaps), Tiffany Lighting Direct (wall lights), Livingetc (57-inch rule),</text><text x="60" y="872" font-size="14" fill="#6E645C">Approved Document M (hall widths, new homes), Ruglove (runner gaps). Console depth and walkway: our worked example.</text></svg>