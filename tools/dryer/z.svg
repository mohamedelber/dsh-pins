<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" font-family="Poppins, Arial, sans-serif" role="img" aria-labelledby="dt dd"><title id="dt">Where each tumble dryer can go</title><desc id="dd">Four setups: under a worktop, stacked on a washer with a stacking kit, in a ventilated cupboard with a drain hose, and a vented dryer with a hose to an outside wall.</desc><rect width="1200" height="900" fill="#F7F1E9"/><text x="40" y="62" font-size="40" fill="#342E2A" font-weight="bold" text-anchor="start">Where Each Tumble Dryer Can Go</text><text x="40" y="96" font-size="19" fill="#6E645C" font-weight="normal" text-anchor="start">Four common small-space setups, checked against UK manufacturer manuals</text><text x="1160" y="62" font-size="18" fill="#6E645C" font-weight="normal" text-anchor="end">dailyspacehacks.com</text><rect x="40" y="120" width="560" height="350" fill="#FFFFFF" stroke="#D8CBBB" stroke-width="2" rx="14"/><text x="60" y="158" font-size="24" fill="#342E2A" font-weight="bold" text-anchor="start">A. Under a worktop</text><text x="60" y="184" font-size="16" fill="#6E645C" font-weight="normal" text-anchor="start">Heat pump or condenser</text><rect x="100" y="230" width="440" height="22" fill="#D9B48A" stroke="#B98A5E" stroke-width="2" rx="0"/><line x1="100" y1="420" x2="540" y2="420" stroke="#6E645C" stroke-width="3" /><rect x="130" y="260" width="120" height="150" fill="#FFFFFF" stroke="#6E645C" stroke-width="2" rx="6"/><rect x="130" y="260" width="120" height="24" fill="#F2EDE6" stroke="#6E645C" stroke-width="1" rx="6"/><circle cx="190.0" cy="337.0" r="42.40" fill="#CFE3EA" stroke="#6E645C" stroke-width="2"/><text x="190.0" y="402" font-size="13" fill="#6E645C" font-weight="bold" text-anchor="middle">WASHER</text><rect x="340" y="260" width="120" height="150" fill="#FFFFFF" stroke="#6E645C" stroke-width="2" rx="6"/><rect x="340" y="260" width="120" height="24" fill="#F2EDE6" stroke="#6E645C" stroke-width="1" rx="6"/><circle cx="400.0" cy="337.0" r="42.40" fill="#FFFFFF" stroke="#6E645C" stroke-width="2"/><text x="400.0" y="402" font-size="13" fill="#6E645C" font-weight="bold" text-anchor="middle">DRYER</text><line x1="340" y1="256" x2="460" y2="256" stroke="#C85A32" stroke-width="2" /><text x="472" y="290" font-size="15" fill="#C85A32" font-weight="bold" text-anchor="start">gap above</text><text x="472" y="310" font-size="15" fill="#C85A32" font-weight="bold" text-anchor="start">and at sides:</text><text x="472" y="330" font-size="13" fill="#6E645C" font-weight="normal" text-anchor="start">see manual</text><line x1="334" y1="270" x2="334" y2="405" stroke="#C85A32" stroke-width="2" stroke-dasharray="5 4"/><line x1="466" y1="270" x2="466" y2="405" stroke="#C85A32" stroke-width="2" stroke-dasharray="5 4"/><text x="100" y="450" font-size="15" fill="#342E2A" font-weight="bold" text-anchor="start">Keep the front air intake and plinth clear</text><rect x="620" y="120" width="560" height="350" fill="#FFFFFF" stroke="#D8CBBB" stroke-width="2" rx="14"/><text x="640" y="158" font-size="24" fill="#342E2A" font-weight="bold" text-anchor="start">B. Stacked on a washer</text><text x="640" y="184" font-size="16" fill="#6E645C" font-weight="normal" text-anchor="start">Dryer always on top</text><line x1="680" y1="450" x2="920" y2="450" stroke="#6E645C" stroke-width="3" /><rect x="730" y="318" width="130" height="130" fill="#FFFFFF" stroke="#6E645C" stroke-width="2" rx="6"/><rect x="730" y="318" width="130" height="24" fill="#F2EDE6" stroke="#6E645C" stroke-width="1" rx="6"/><circle cx="795.0" cy="385.0" r="34.4" fill="#CFE3EA" stroke="#6E645C" stroke-width="2"/><text x="795.0" y="440" font-size="13" fill="#6E645C" font-weight="bold" text-anchor="middle">WASHER</text><rect x="724" y="304" width="142" height="14" fill="#ECCDA0" stroke="#B98A5E" stroke-width="2" rx="0"/><rect x="730" y="204" width="130" height="100" fill="#FFFFFF" stroke="#6E645C" stroke-width="2" rx="6"/><rect x="730" y="204" width="130" height="24" fill="#F2EDE6" stroke="#6E645C" stroke-width="1" rx="6"/><circle cx="795.0" cy="256.0" r="22.40" fill="#FFFFFF" stroke="#6E645C" stroke-width="2"/><text x="795.0" y="296" font-size="13" fill="#6E645C" font-weight="bold" text-anchor="middle">DRYER</text><text x="878" y="316" font-size="15" fill="#C85A32" font-weight="bold" text-anchor="start">stacking kit</text><text x="910" y="358" font-size="15" fill="#342E2A" font-weight="normal" text-anchor="start">Use the kit made</text><text x="910" y="378" font-size="15" fill="#342E2A" font-weight="normal" text-anchor="start">for your two models</text><text x="910" y="225" font-size="15" fill="#342E2A" font-weight="normal" text-anchor="start">Check the washer is</text><text x="910" y="245" font-size="15" fill="#342E2A" font-weight="normal" text-anchor="start">deep enough for</text><text x="910" y="265" font-size="15" fill="#342E2A" font-weight="normal" text-anchor="start">the dryer above</text><text x="910" y="416" font-size="15" fill="#C85A32" font-weight="bold" text-anchor="start">Never put the washer</text><text x="910" y="436" font-size="15" fill="#C85A32" font-weight="bold" text-anchor="start">on top of the dryer</text><rect x="40" y="490" width="560" height="350" fill="#FFFFFF" stroke="#D8CBBB" stroke-width="2" rx="14"/><text x="60" y="528" font-size="24" fill="#342E2A" font-weight="bold" text-anchor="start">C. In a cupboard or alcove</text><text x="60" y="554" font-size="16" fill="#6E645C" font-weight="normal" text-anchor="start">Heat pump or condenser</text><rect x="110" y="580" width="220" height="230" fill="#DCE5D6" stroke="#8FA689" stroke-width="3" rx="0"/><rect x="160" y="640" width="120" height="150" fill="#FFFFFF" stroke="#6E645C" stroke-width="2" rx="6"/><rect x="160" y="640" width="120" height="24" fill="#F2EDE6" stroke="#6E645C" stroke-width="1" rx="6"/><circle cx="220.0" cy="717.0" r="42.40" fill="#FFFFFF" stroke="#6E645C" stroke-width="2"/><text x="220.0" y="782" font-size="13" fill="#6E645C" font-weight="bold" text-anchor="middle">DRYER</text><line x1="340" y1="600" x2="370" y2="600" stroke="#8FA689" stroke-width="3" /><line x1="340" y1="614" x2="370" y2="614" stroke="#8FA689" stroke-width="3" /><line x1="340" y1="628" x2="370" y2="628" stroke="#8FA689" stroke-width="3" /><line x1="340" y1="642" x2="370" y2="642" stroke="#8FA689" stroke-width="3" /><line x1="340" y1="656" x2="370" y2="656" stroke="#8FA689" stroke-width="3" /><line x1="340" y1="670" x2="370" y2="670" stroke="#8FA689" stroke-width="3" /><text x="340" y="590" font-size="14" fill="#8FA689" font-weight="bold" text-anchor="start">vents</text><path d="M280 780 C340 790,340 740,370 740" fill="none" stroke="#C85A32" stroke-width="3"/><text x="380" y="736" font-size="15" fill="#C85A32" font-weight="bold" text-anchor="start">drain hose to waste</text><text x="380" y="756" font-size="13" fill="#6E645C" font-weight="normal" text-anchor="start">(no tank to empty)</text><text x="390" y="640" font-size="15" fill="#342E2A" font-weight="normal" text-anchor="start">Airflow in and out</text><text x="390" y="660" font-size="15" fill="#342E2A" font-weight="normal" text-anchor="start">Room temp: see manual</text><text x="390" y="680" font-size="15" fill="#342E2A" font-weight="normal" text-anchor="start">Not behind a</text><text x="390" y="700" font-size="15" fill="#342E2A" font-weight="normal" text-anchor="start">lockable door</text><rect x="620" y="490" width="560" height="350" fill="#FFFFFF" stroke="#D8CBBB" stroke-width="2" rx="14"/><text x="640" y="528" font-size="24" fill="#342E2A" font-weight="bold" text-anchor="start">D. Vented dryer</text><text x="640" y="554" font-size="16" fill="#6E645C" font-weight="normal" text-anchor="start">Needs an outside wall or window</text><rect x="1060" y="570" width="40" height="250" fill="#E9DFD3" stroke="#6E645C" stroke-width="2" rx="0"/><text x="1080" y="566" font-size="13" fill="#6E645C" font-weight="bold" text-anchor="middle">OUTSIDE</text><text x="1080" y="582" font-size="13" fill="#6E645C" font-weight="bold" text-anchor="middle">WALL</text><rect x="740" y="660" width="120" height="150" fill="#FFFFFF" stroke="#6E645C" stroke-width="2" rx="6"/><rect x="740" y="660" width="120" height="24" fill="#F2EDE6" stroke="#6E645C" stroke-width="1" rx="6"/><circle cx="800.0" cy="737.0" r="42.40" fill="#FFFFFF" stroke="#6E645C" stroke-width="2"/><text x="800.0" y="802" font-size="13" fill="#6E645C" font-weight="bold" text-anchor="middle">VENTED</text><path d="M860 700 C940 700,980 640,1060 640" fill="none" stroke="#ECCDA0" stroke-width="16" stroke-linecap="round"/><path d="M860 700 C940 700,980 640,1060 640" fill="none" stroke="#B98A5E" stroke-width="2" stroke-dasharray="4 5"/><text x="920" y="618" font-size="15" fill="#C85A32" font-weight="bold" text-anchor="start">hose max 2.4 m</text><text x="920" y="638" font-size="13" fill="#6E645C" font-weight="normal" text-anchor="start">(Hotpoint manual)</text><text x="660" y="610" font-size="15" fill="#342E2A" font-weight="normal" text-anchor="start">Hot damp air</text><text x="660" y="630" font-size="15" fill="#342E2A" font-weight="normal" text-anchor="start">goes outside</text><text x="40" y="880" font-size="16" fill="#6E645C" font-weight="normal" text-anchor="start">Gaps, temperatures and hose lengths vary by model: always follow the installation guide for your dryer.</text></svg>