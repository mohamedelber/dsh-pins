<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" font-family="Poppins, sans-serif" role="img" aria-labelledby="st-t st-d"><title id="st-t">Studio apartment zone plan</title><desc id="st-d">Top-down floor plan of an example 20 by 22 foot studio apartment, about 440 square feet, divided into six zones. A, entry drop zone by the door. B, kitchen along the bottom wall. C, a small round dining table for two near the kitchen. D, living zone with a sofa on a rug facing a TV console on the right wall. E, sleep zone with a queen bed in the top left corner, screened from the living zone by an open bookshelf divider. F, a small work desk on the left wall. A 36 inch walkway runs from the door to every zone.</desc>
<rect width="1200" height="900" fill="#F7F1E9"/>
