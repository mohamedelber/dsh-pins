<text x="360.0" y="834" font-size="17" fill="#6E645C" text-anchor="middle">20 ft (6.1 m)</text>
<text x="54" y="484.0" font-size="17" fill="#6E645C" text-anchor="middle" transform="rotate(-90 54 484.0)">22 ft (6.7 m)</text>
<circle cx="740" cy="196" r="19" fill="#342E2A"/><text x="740" y="203" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">A</text>
<text x="772" y="203" font-size="22" font-weight="700" fill="#342E2A">Entry drop zone</text>
<text x="772" y="230" font-size="17" fill="#6E645C">hooks, a bench, a tray for keys</text>
<circle cx="740" cy="274" r="19" fill="#342E2A"/><text x="740" y="281" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">B</text>
<text x="772" y="281" font-size="22" font-weight="700" fill="#342E2A">Kitchen</text>
<text x="772" y="308" font-size="17" fill="#6E645C">keep the counters clear</text>
<circle cx="740" cy="352" r="19" fill="#342E2A"/><text x="740" y="359" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">C</text>
<text x="772" y="359" font-size="22" font-weight="700" fill="#342E2A">Dining for two</text>
<text x="772" y="386" font-size="17" fill="#6E645C">a small round or drop-leaf table</text>
<circle cx="740" cy="430" r="19" fill="#342E2A"/><text x="740" y="437" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">D</text>
<text x="772" y="437" font-size="22" font-weight="700" fill="#342E2A">Living zone</text>
<text x="772" y="464" font-size="17" fill="#6E645C">sofa on a rug, TV on the wall</text>
<circle cx="740" cy="508" r="19" fill="#342E2A"/><text x="740" y="515" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">E</text>
<text x="772" y="515" font-size="22" font-weight="700" fill="#342E2A">Sleep zone</text>
<text x="772" y="542" font-size="17" fill="#6E645C">bed in the corner farthest from the door</text>
<circle cx="740" cy="586" r="19" fill="#342E2A"/><text x="740" y="593" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">F</text>
<text x="772" y="593" font-size="22" font-weight="700" fill="#342E2A">Work spot</text>
<text x="772" y="620" font-size="17" fill="#6E645C">a desk that is not your bed</text>
<rect x="720" y="650" width="420" height="104" rx="12" fill="#DCE5D6"/>
<rect x="738" y="670" width="16" height="60" rx="2" fill="#D9B48A" stroke="#B98A5E" stroke-width="2"/>
<text x="770" y="688" font-size="19" font-weight="700" fill="#342E2A">Open bookshelf divider</text>
<text x="770" y="714" font-size="17" fill="#6E645C">screens the bed but lets light through;</text>
<text x="770" y="738" font-size="17" fill="#6E645C">anchor it to the wall or floor</text>
<text x="60" y="878" font-size="16" fill="#6E645C">Example plan for a 20 x 22 ft (about 440 sq ft) studio. Our own sample layout: swap zones to fit your windows and door.</text>
</svg>