<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" font-family="Poppins, sans-serif" role="img" aria-labelledby="el-t el-d"><title id="el-t">European laundry sizes: side by side or stacked</title><desc id="el-d">Two common European laundry layouts drawn from the front, with typical sizes. Side by side: a front-loading washer and a dryer, each about 600 mm wide, sit under one benchtop, so the cupboard needs to be about 1,200 to 1,300 mm wide, or about 1,700 mm with a compact laundry tub. Stacked: the dryer sits on the washer on a stacking kit, so the cupboard can be about 700 mm wide but needs about 1,800 mm of height for the machines. In both layouts allow a cupboard depth of about 650 to 700 mm for the hoses and the door. A vented dryer must be ducted to outside air; condenser and heat pump dryers collect or drain the water instead. Sizes are typical; always check your own appliances.</desc><rect width="1200" height="900" fill="#F7F1E9"/><text x="60" y="88" font-size="44" font-weight="700" fill="#342E2A">European Laundry Sizes</text><text x="60" y="128" font-size="22" fill="#6E645C">Two common layouts, seen from the front</text><text x="1140" y="60" font-size="18" fill="#6E645C" text-anchor="end">dailyspacehacks.com</text><text x="90" y="200" font-size="24" font-weight="700" fill="#342E2A">1. Side by side</text><rect x="82" y="418" width="322" height="14" fill="#D9B48A" stroke="#B98A5E" stroke-width="2"/><text x="410" y="408" font-size="15" fill="#6E645C" text-anchor="middle">benchtop</text><rect x="90" y="448" width="150" height="212" rx="10" fill="#FFFFFF" stroke="#6E645C" stroke-width="3"/><rect x="100" y="458" width="130" height="26" rx="4" fill="#F0ECE6"/><circle cx="210" cy="471" r="8" fill="#FFFFFF" stroke="#6E645C" stroke-width="2"/><circle cx="165" cy="571" r="45" fill="#DDE7EC" stroke="#6E645C" stroke-width="4"/><circle cx="165" cy="571" r="31" fill="#C9D8DF"/><text x="165" y="648" font-size="15" fill="#6E645C" text-anchor="middle">washer</text><rect x="246" y="448" width="150" height="212" rx="10" fill="#FFFFFF" stroke="#6E645C" stroke-width="3"/><rect x="256" y="458" width="130" height="26" rx="4" fill="#F0ECE6"/><circle cx="366" cy="471" r="8" fill="#FFFFFF" stroke="#6E645C" stroke-width="2"/><circle cx="321" cy="571" r="45" fill="#FFFFFF" stroke="#6E645C" stroke-width="4"/><text x="321" y="648" font-size="15" fill="#6E645C" text-anchor="middle">dryer</text><line x1="60" y1="660" x2="560" y2="660" stroke="#342E2A" stroke-width="4"/><text x="165" y="400" font-size="15" fill="#C85A32" text-anchor="middle" font-weight="700">600 mm each</text><line x1="82" y1="686" x2="404" y2="686" stroke="#C85A32" stroke-width="3"/><line x1="82" y1="676" x2="82" y2="696" stroke="#C85A32" stroke-width="3"/><line x1="404" y1="676" x2="404" y2="696" stroke="#C85A32" stroke-width="3"/><text x="243" y="716" font-size="19" font-weight="700" fill="#C85A32" text-anchor="middle">about 1,200–1,300 mm</text><text x="430" y="554" font-size="17" fill="#342E2A">+ compact tub:</text><text x="430" y="578" font-size="17" font-weight="700" fill="#342E2A">about 1,700 mm</text><text x="700" y="200" font-size="24" font-weight="700" fill="#342E2A">2. Stacked</text><rect x="720" y="448" width="150" height="212" rx="10" fill="#FFFFFF" stroke="#6E645C" stroke-width="3"/><rect x="730" y="458" width="130" height="26" rx="4" fill="#F0ECE6"/><circle cx="840" cy="471" r="8" fill="#FFFFFF" stroke="#6E645C" stroke-width="2"/><circle cx="795" cy="571" r="45" fill="#DDE7EC" stroke="#6E645C" stroke-width="4"/><circle cx="795" cy="571" r="31" fill="#C9D8DF"/><text x="795" y="648" font-size="15" fill="#6E645C" text-anchor="middle">washer</text><rect x="716" y="436" width="158" height="10" fill="#6E645C"/><rect x="720" y="224" width="150" height="212" rx="10" fill="#FFFFFF" stroke="#6E645C" stroke-width="3"/><rect x="730" y="234" width="130" height="26" rx="4" fill="#F0ECE6"/><circle cx="840" cy="247" r="8" fill="#FFFFFF" stroke="#6E645C" stroke-width="2"/><circle cx="795" cy="347" r="45" fill="#FFFFFF" stroke="#6E645C" stroke-width="4"/><text x="795" y="424" font-size="15" fill="#6E645C" text-anchor="middle">dryer</text><text x="888" y="445" font-size="15" fill="#6E645C">stacking kit</text><line x1="660" y1="660" x2="1140" y2="660" stroke="#342E2A" stroke-width="4"/><line x1="695" y1="686" x2="895" y2="686" stroke="#C85A32" stroke-width="3"/><line x1="695" y1="676" x2="695" y2="696" stroke="#C85A32" stroke-width="3"/><line x1="895" y1="676" x2="895" y2="696" stroke="#C85A32" stroke-width="3"/><text x="795" y="716" font-size="19" font-weight="700" fill="#C85A32" text-anchor="middle">about 700 mm</text><line x1="990" y1="224" x2="990" y2="660" stroke="#C85A32" stroke-width="3"/><line x1="980" y1="224" x2="1000" y2="224" stroke="#C85A32" stroke-width="3"/><line x1="980" y1="660" x2="1000" y2="660" stroke="#C85A32" stroke-width="3"/><text x="1006" y="436" font-size="19" font-weight="700" fill="#C85A32">about</text><text x="1006" y="460" font-size="19" font-weight="700" fill="#C85A32">1,800 mm</text><rect x="60" y="780" width="530" height="66" rx="12" fill="#FFFFFF" stroke="#D8CBBB" stroke-width="2"/><text x="78" y="807" font-size="18" font-weight="700" fill="#342E2A">Depth</text><text x="78" y="832" font-size="15" fill="#6E645C">Allow about 650–700 mm for hoses and the door</text><rect x="610" y="780" width="530" height="66" rx="12" fill="#FFFFFF" stroke="#D8CBBB" stroke-width="2"/><text x="628" y="807" font-size="18" font-weight="700" fill="#342E2A">Dryer air</text><text x="628" y="832" font-size="15" fill="#6E645C">Vented dryers must be ducted outside; heat pump dryers need no duct</text><text x="60" y="870" font-size="13" fill="#6E645C">Typical sizes; check your appliances. Dryer venting: Energy Rating (Australian Government).</text></svg>