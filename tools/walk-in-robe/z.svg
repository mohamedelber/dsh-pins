<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" font-family="Poppins, sans-serif" role="img" aria-labelledby="wr-t wr-d"><title id="wr-t">Walk-in robe layouts and minimum widths</title><desc id="wr-d">Top-down plans of four walk-in robe layouts with typical Australian minimum room widths. Single-sided: one 600 mm deep run of robes plus a 900 mm walkway, about 1500 mm wide. Galley: robes on both long walls with a 900 mm walkway between, about 2100 mm wide. L-shape: robes on two walls meeting in a corner, with the walkway kept clear in front of both. U-shape: robes on three walls, a practical minimum of about 2400 mm wide and about 2600 mm or more to feel comfortable. Shelf-only or shoe sections can be 300 to 450 mm deep, which frees up walkway.</desc><rect width="1200" height="900" fill="#F7F1E9"/><text x="60" y="80" font-size="42" font-weight="700" fill="#342E2A">How Wide Does a Walk-In Robe Need to Be?</text><text x="60" y="116" font-size="21" fill="#6E645C">Seen from above: 600 mm deep robes, 900 mm walkway, typical sizes in mm</text><text x="1140" y="30" font-size="18" fill="#6E645C" text-anchor="end">dailyspacehacks.com</text><rect x="60" y="150" width="250" height="330" rx="14" fill="#FFFFFF" stroke="#D8CBBB" stroke-width="2"/><text x="185" y="188" font-size="21" font-weight="700" fill="#342E2A" text-anchor="middle">Single-sided</text><rect x="121.25" y="220" width="127.50000000000001" height="204.00000000000003" fill="#DCE5D6" stroke="#342E2A" stroke-width="3"/><rect x="121.25" y="220" width="51.00000000000001" height="204.00000000000003" fill="#D9B48A" stroke="#B98A5E" stroke-width="2"/><rect x="155.0" y="421.0" width="60" height="6" fill="#FFFFFF"/><text x="185.0" y="444.0" font-size="13" fill="#6E645C" text-anchor="middle">door</text><text x="185" y="466" font-size="19" font-weight="700" fill="#C85A32" text-anchor="middle">about 1,500 wide</text><rect x="335" y="150" width="250" height="330" rx="14" fill="#FFFFFF" stroke="#D8CBBB" stroke-width="2"/><text x="460" y="188" font-size="21" font-weight="700" fill="#342E2A" text-anchor="middle">Galley</text><rect x="370.75" y="220" width="178.5" height="204.00000000000003" fill="#DCE5D6" stroke="#342E2A" stroke-width="3"/><rect x="370.75" y="220" width="51.00000000000001" height="204.00000000000003" fill="#D9B48A" stroke="#B98A5E" stroke-width="2"/><rect x="498.25" y="220" width="51.00000000000001" height="204.00000000000003" fill="#D9B48A" stroke="#B98A5E" stroke-width="2"/><rect x="430.0" y="421.0" width="60" height="6" fill="#FFFFFF"/><text x="460.0" y="444.0" font-size="13" fill="#6E645C" text-anchor="middle">door</text><text x="460" y="466" font-size="19" font-weight="700" fill="#C85A32" text-anchor="middle">about 2,100 wide</text><rect x="610" y="150" width="250" height="330" rx="14" fill="#FFFFFF" stroke="#D8CBBB" stroke-width="2"/><text x="735" y="188" font-size="21" font-weight="700" fill="#342E2A" text-anchor="middle">L-shape</text><rect x="658.5" y="220" width="153.0" height="204.00000000000003" fill="#DCE5D6" stroke="#342E2A" stroke-width="3"/><rect x="658.5" y="220" width="51.00000000000001" height="204.00000000000003" fill="#D9B48A" stroke="#B98A5E" stroke-width="2"/><rect x="658.5" y="220" width="153.0" height="51.00000000000001" fill="#D9B48A" stroke="#B98A5E" stroke-width="2"/><rect x="705.0" y="421.0" width="60" height="6" fill="#FFFFFF"/><text x="735.0" y="444.0" font-size="13" fill="#6E645C" text-anchor="middle">door</text><text x="735" y="466" font-size="19" font-weight="700" fill="#C85A32" text-anchor="middle">2,400 x 1,800 room</text><rect x="885" y="150" width="250" height="330" rx="14" fill="#FFFFFF" stroke="#D8CBBB" stroke-width="2"/><text x="1010" y="188" font-size="21" font-weight="700" fill="#342E2A" text-anchor="middle">U-shape</text><rect x="908.0" y="220" width="204.00000000000003" height="204.00000000000003" fill="#DCE5D6" stroke="#342E2A" stroke-width="3"/><rect x="908.0" y="220" width="51.00000000000001" height="204.00000000000003" fill="#D9B48A" stroke="#B98A5E" stroke-width="2"/><rect x="1061.0" y="220" width="51.00000000000001" height="204.00000000000003" fill="#D9B48A" stroke="#B98A5E" stroke-width="2"/><rect x="908.0" y="220" width="204.00000000000003" height="51.00000000000001" fill="#D9B48A" stroke="#B98A5E" stroke-width="2"/><rect x="980.0" y="421.0" width="60" height="6" fill="#FFFFFF"/><text x="1010.0" y="444.0" font-size="13" fill="#6E645C" text-anchor="middle">door</text><text x="1010" y="466" font-size="19" font-weight="700" fill="#C85A32" text-anchor="middle">2,400 to 2,600+</text><rect x="60" y="530" width="28" height="22" fill="#D9B48A" stroke="#B98A5E" stroke-width="2"/><text x="100" y="548" font-size="18" fill="#342E2A">Robes, about 600 mm deep for hanging</text><rect x="520" y="530" width="28" height="22" fill="#DCE5D6" stroke="#342E2A" stroke-width="2"/><text x="560" y="548" font-size="18" fill="#342E2A">Walkway, 900 mm comfortable (800 mm absolute minimum)</text><rect x="60" y="590" width="520" height="160" rx="12" fill="#FFFFFF" stroke="#D8CBBB" stroke-width="2"/><rect x="60" y="590" width="8" height="160" rx="4" fill="#8FA689"/><text x="84" y="624" font-size="19" font-weight="700" fill="#342E2A">Save width with shallow sections</text><text x="84" y="654" font-size="16" fill="#6E645C">Shelves only: about 450 mm deep</text><text x="84" y="678" font-size="16" fill="#6E645C">Shoes and drawers: 300 to 380 mm deep</text><text x="84" y="702" font-size="16" fill="#6E645C">Hanging needs 520 to 550 mm inside the robe</text><rect x="620" y="590" width="520" height="160" rx="12" fill="#FFFFFF" stroke="#D8CBBB" stroke-width="2"/><rect x="620" y="590" width="8" height="160" rx="4" fill="#C85A32"/><text x="644" y="624" font-size="19" font-weight="700" fill="#342E2A">Rail heights</text><text x="644" y="654" font-size="16" fill="#6E645C">Long hanging: rail at about 1,800 mm</text><text x="644" y="678" font-size="16" fill="#6E645C">Double hanging: rails at about 1,800 and 900 mm</text><text x="644" y="702" font-size="16" fill="#6E645C">Shoe shelves: 220 to 260 mm apart</text><text x="60" y="800" font-size="14" fill="#6E645C">Widths add the robe depth and walkway: 600 + 900 = 1,500 mm; 600 + 900 + 600 = 2,100 mm. L-shape uses Kitchenfox&#8217;s 2,400 x 1,800 mm minimum room.</text><text x="60" y="822" font-size="14" fill="#6E645C">Sources: Silva Wardrobe Co, TNT Wardrobes, Kitchenfox and Houzz Australia. Check your own room before ordering.</text></svg>