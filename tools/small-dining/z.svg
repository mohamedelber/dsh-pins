<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" font-family="Poppins, sans-serif" role="img" aria-labelledby="sd-t sd-d"><title id="sd-t">Small dining room planning numbers</title><desc id="sd-d">Two floor plans of the same 120 by 80 cm table for four. With chairs on both long sides and 75 cm clear on every side, the dining area needs 270 by 230 cm. With a built-in banquette on one long side, 50 cm deep with the table overlapping the seat by 10 cm, the table edge sits 40 cm from the wall and the area needs 270 by 195 cm, saving 35 cm of room depth. Planning numbers: 60 cm of table edge per diner; a 90 to 100 cm round table seats four and 70 to 80 cm seats two; 60 cm from table to wall is a tight minimum, 75 cm comfortable, 100 to 110 cm to walk behind; banquette seat about 45 cm high and 45 to 50 cm deep; pendant 75 to 90 cm above the table, half to two thirds of the table width; rug at least 60 cm bigger than the table on each side; sideboard 30 to 40 cm deep.</desc><rect width="1200" height="900" fill="#F7F1E9"/><text x="60" y="78" font-size="40" font-weight="700" fill="#342E2A">Small Dining Room: The Numbers</text><text x="60" y="114" font-size="20" fill="#6E645C">One 120 x 80 cm table for four, planned two ways (to scale)</text><text x="1140" y="30" font-size="18" fill="#6E645C" text-anchor="end">dailyspacehacks.com</text><text x="90" y="162" font-size="18" font-weight="700" fill="#C85A32">With chairs all round</text><rect x="90" y="178" width="310.5" height="264.5" fill="#DCE5D6" stroke="#8FA689" stroke-width="2" stroke-dasharray="7 5"/><rect x="176.25" y="264.25" width="138.0" height="92.0" rx="4" fill="#C9A06B" stroke="#A97F4C" stroke-width="2" fill-opacity="0.92"/><text x="245.25" y="315.25" font-size="14" font-weight="700" fill="#342E2A" text-anchor="middle">120 x 80 cm</text><rect x="190.05" y="362.25" width="48.3" height="48.3" rx="6" fill="#E9DFD2" stroke="#A97F4C" stroke-width="1.5"/><rect x="190.05" y="209.95" width="48.3" height="48.3" 