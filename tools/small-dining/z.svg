x="6" fill="#E9DFD2" stroke="#A97F4C" stroke-width="1.5"/><rect x="252.14999999999998" y="684.0" width="48.3" height="48.3" rx="6" fill="#E9DFD2" stroke="#A97F4C" stroke-width="1.5"/><line x1="76" y1="540" x2="76" y2="764.25" stroke="#342E2A" stroke-width="1.5"/><text x="68" y="652.125" font-size="15" font-weight="700" fill="#342E2A" text-anchor="middle" transform="rotate(-90 68 652.125)">195 cm</text><line x1="90" y1="780.25" x2="400.5" y2="780.25" stroke="#342E2A" stroke-width="1.5"/><text x="245.25" y="800.25" font-size="15" font-weight="700" fill="#342E2A" text-anchor="middle">270 cm</text><text x="132.55" y="637.0" font-size="12" fill="#4F6B49" text-anchor="middle">75</text><text x="357.95" y="637.0" font-size="12" fill="#4F6B49" text-anchor="middle">75</text><text x="322.25" y="744.25" font-size="12" fill="#4F6B49">75 cm clear</text><text x="412.5" y="591.0" font-size="13" font-weight="700" fill="#C85A32">table edge 40 cm</text><text x="412.5" y="609.0" font-size="13" font-weight="700" fill="#C85A32">from the wall</text><text x="420" y="408" font-size="15" font-weight="700" fill="#342E2A">2.7 x 2.3 m</text><text x="420" y="430" font-size="13" fill="#6E645C">for four, chairs</text><text x="420" y="740" font-size="15" font-weight="700" fill="#C85A32">2.7 x 1.95 m</text><text x="420" y="762" font-size="13" fill="#6E645C">saves 35 cm of depth</text><rect x="600" y="150" width="560" height="660" rx="16" fill="#FFFFFF" stroke="#D8CBBB" stroke-width="2"/><text x="626" y="192" font-size="21" font-weight="700" fill="#C85A32">Planning numbers</text><text x="626" y="236" font-size="16" font-weight="700" fill="#342E2A">Per diner</text><text x="820" y="236" font-size="16" fill="#342E2A">60 cm of table edge</text><line x1="626" y1="252" x2="1134" y2="252" stroke="#D8CBBB"/><text x="626" y="290" font-size="16" font-weight="700" fill="#342E2A">Table for four</text><text x="820" y="290" font-size="16" fill="#342E2A">120 cm long, 80–90 cm wide</text><line x1="626" y1="306" x2="