<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" font-family="Poppins, sans-serif" role="img" aria-labelledby="hw-t hw-d"><title id="hw-t">Hallway storage depth budget</title><desc id="hw-d">Top-down depth budget for narrow hallways. Each bar is a hallway width: 90, 100, 110 and 120 cm. Keeping about 75 cm clear to walk through leaves room for storage on one wall of about 15 cm in a 90 cm hall (hooks, a peg rail or a picture-ledge shelf), about 25 cm in a 100 cm hall (a slim shoe cabinet 17 to 22 cm deep), about 35 cm in a 110 cm hall (a 28 to 30 cm shoe cabinet or a slim console table) and about 45 cm in a 120 cm hall (a storage bench). The 75 cm figure is the narrowest width Approved Document M allows at a short obstruction in new homes, used here as a rule of thumb.</desc><rect width="1200" height="900" fill="#F7F1E9"/><text x="60" y="80" font-size="44" font-weight="700" fill="#342E2A">How Deep Can Hallway Storage Be?</text><text x="60" y="118" font-size="22" fill="#6E645C">Seen from above: storage on one wall, about 75 cm kept clear to walk</text><text x="1140" y="50" font-size="18" fill="#6E645C" text-anchor="end">dailyspacehacks.com</text><rect x="70" y="190" width="12" height="96" fill="#B98A5E"/><rect x="568.0" y="190" width="12" height="96" fill="#B98A5E"/><rect x="82" y="190" width="81.0" height="96" fill="#C85A32" opacity="0.85"/><text x="122.5" y="246.0" font-size="22" font-weight="700" fill="#fff" text-anchor="middle">15</text><rect x="163.0" y="190" width="405.0" height="96" fill="#DCE5D6" stroke="#8FA689" stroke-width="2" stroke-dasharray="7 5"/><text x="365.5" y="246.0" font-size="20" fill="#342E2A" text-anchor="middle">75 cm clear</text><text x="596.0" y="230" font-size="24" font-weight="700" fill="#342E2A">90 cm hall</text><text x="596.0" y="260" font-size="17" fill="#6E645C">Hooks, peg rail, picture-ledge shelf</text><rect x="70" y="328" width="12" height="96" fill="#B98A5E"/><rect x="622.0" y="328" width="12" height="96" fill="#B98A5E"/><rect x="82" y="328" width="135.0" height="96" fill="#C85A32" opacity="0.85"/><text x="149.5" y="384.0" font-size="22" font-weight="700" fill="#fff" text-anchor="middle">25</text><rect x="217.0" y="328" width="405.0" height="96" fill="#DCE5D6" stroke="#8FA689" stroke-width="2" stroke-dasharray="7 5"/><text x="419.5" y="384.0" font-size="20" fill="#342E2A" text-anchor="middle">75 cm clear</text><text x="650.0" y="368" font-size="24" font-weight="700" fill="#342E2A">100 cm hall</text><text x="650.0" y="398" font-size="17" fill="#6E645C">Slim shoe cabinet 17–22 cm deep</text><rect x="70" y="466" width="12" height="96" fill="#B98A5E"/><rect x="676.0" y="466" width="12" height="96" fill="#B98A5E"/><rect x="82" y="466" width="189.0" height="96" fill="#C85A32" opacity="0.85"/><text x="176.5" y="522.0" font-size="22" font-weight="700" fill="#fff" text-anchor="middle">35</text><rect x="271.0" y="466" width="405.0" height="96" fill="#DCE5D6" stroke="#8FA689" stroke-width="2" stroke-dasharray="7 5"/><text x="473.5" y="522.0" font-size="20" fill="#342E2A" text-anchor="middle">75 cm clear</text><text x="704.0" y="506" font-size="24" font-weight="700" fill="#342E2A">110 cm hall</text><text x="704.0" y="536" font-size="17" fill="#6E645C">Shoe cabinet 28–30 cm or slim console</text><rect x="70" y="604" width="12" height="96" fill="#B98A5E"/><rect x="730.0" y="604" width="12" height="96" fill="#B98A5E"/><rect x="82" y="604" width="243.00000000000003" height="96" fill="#C85A32" opacity="0.85"/><text x="203.5" y="660.0" font-size="22" font-weight="700" fill="#fff" text-anchor="middle">45</text><rect x="325.0" y="604" width="405.0" height="96" fill="#DCE5D6" stroke="#8FA689" stroke-width="2" stroke-dasharray="7 5"/><text x="527.5" y="660.0" font-size="20" fill="#342E2A" text-anchor="middle">75 cm clear</text><text x="758.0" y="644" font-size="24" font-weight="700" fill="#342E2A">120 cm hall</text><text x="758.0" y="674" font-size="17" fill="#6E645C">Storage bench about 40–45 cm deep</text><rect x="70" y="748" width="28" height="22" fill="#C85A32" opacity="0.85"/><text x="110" y="766" font-size="18" fill="#342E2A">Storage depth (cm) on one wall</text><rect x="470" y="748" width="28" height="22" fill="#DCE5D6" stroke="#8FA689" stroke-width="2" stroke-dasharray="5 4"/><text x="510" y="766" font-size="18" fill="#342E2A">Walkway left clear</text><rect x="770" y="748" width="12" height="22" fill="#B98A5E"/><text x="794" y="766" font-size="18" fill="#342E2A">Wall</text><text x="60" y="866" font-size="14" fill="#6E645C">75 cm = narrowest point Approved Document M allows at a short obstruction in new homes; a rule of thumb, not a rule for older homes.</text><text x="60" y="886" font-size="14" fill="#6E645C">Measure at skirting height, and leave the door swing and any radiator clear. Cabinet depths: IKEA UK listings, October 2026.</text></svg>