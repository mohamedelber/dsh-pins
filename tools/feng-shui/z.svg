<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" font-family="Poppins, sans-serif" role="img" aria-labelledby="fs-t fs-d"><title id="fs-t">Feng shui bedroom layout: the commanding position, measured</title><desc id="fs-d">Left: plan of an example 12 by 12 foot bedroom with a queen bed (60 by 80 inches) in the commanding position: headboard against a solid wall, the door visible diagonally from the bed but not in line with it, nightstands on both sides, at least 24 inches of space on each side and at the foot, and the bed away from the window. Right: two layouts feng shui practitioners advise against, the feet pointing straight out of the door and the headboard under a window, and our worked minimum for a queen: 108 by 104 inches of clear floor, using the Sleep Foundation's 24 inch guideline.</desc><rect width="1200" height="900" fill="#F7F1E9"/><text x="60" y="80" font-size="42" font-weight="700" fill="#342E2A">The Commanding Position, Measured</text><text x="60" y="116" font-size="21" fill="#6E645C">An example 12 x 12 ft bedroom with a queen bed</text><text x="1140" y="30" font-size="18" fill="#6E645C" text-anchor="end">dailyspacehacks.com</text><rect x="70" y="170" width="489.59999999999997" height="489.59999999999997" fill="#FBF7F0" stroke="#342E2A" stroke-width="6"/><rect x="554.5999999999999" y="319.6" width="10" height="190.4" fill="#BFD9E6" stroke="#342E2A" stroke-width="2"/><text x="571.5999999999999" y="419.8" font-size="14" fill="#6E645C">window</text><line x1="410.0" y1="659.5999999999999" x2="518.8" y2="659.5999999999999" stroke="#FBF7F0" stroke-width="8"/><path d="M518.8 659.5999999999999 L518.8 550.8 A108.8 108.8 0 0 0 410.0 659.5999999999999" fill="none" stroke="#6E645C" stroke-width="2" stroke-dasharray="5 4"/><line x1="518.8" y1="659.5999999999999" x2="518.8" y2="550.8" stroke="#342E2A" stroke-width="3"/><text x="464.4" y="683.5999999999999" font-size="15" font-weight="700" fill="#342E2A" text-anchor="middle">door</text><rect x="70.0" y="272.0" width="272.0" height="204.0" rx="6" fill="#FFFFFF" stroke="#342E2A" stroke-width="3"/><rect x="70.0" y="272.0" width="20.4" height="204.0" fill="#C9A06B"/><rect x="100.6" y="285.6" width="47.6" height="81.6" rx="6" fill="#DCE5D6" stroke="#8FA689" stroke-width="2"/><rect x="100.6" y="380.79999999999995" width="47.6" height="81.6" rx="6" fill="#DCE5D6" stroke="#8FA689" stroke-width="2"/><rect x="172.0" y="272.0" width="170.0" height="204.0" rx="4" fill="#8FA689" opacity=".55"/><text x="257.0" y="368.0" font-size="17" font-weight="700" fill="#342E2A" text-anchor="middle">Queen bed</text><text x="257.0" y="390.0" font-size="14" fill="#342E2A" text-anchor="middle">60 x 80 in</text><rect x="76.8" y="197.2" width="61.199999999999996" height="61.199999999999996" fill="#C9A06B"/><rect x="76.8" y="482.8" width="61.199999999999996" height="61.199999999999996" fill="#C9A06B"/><line x1="274.0" y1="170.0" x2="274.0" y2="272.0" stroke="#C85A32" stroke-width="2"/><line x1="268.0" y1="170.0" x2="280.0" y2="170.0" stroke="#C85A32" stroke-width="2"/><line x1="268.0" y1="272.0" x2="280.0" y2="272.0" stroke="#C85A32" stroke-width="2"/><text x="284.0" y="226.0" font-size="14" font-weight="700" fill="#C85A32" text-anchor="start">30 in</text><line x1="274.0" y1="476.0" x2="274.0" y2="659.5999999999999" stroke="#C85A32" stroke-width="2"/><line x1="268.0" y1="476.0" x2="280.0" y2="476.0" stroke="#C85A32" stroke-width="2"/><line x1="268.0" y1="659.5999999999999" x2="280.0" y2="659.5999999999999" stroke="#C85A32" stroke-width="2"/><text x="284.0" y="572.8" font-size="14" font-weight="700" fill="#C85A32" text-anchor="start">54 in</text><line x1="342.0" y1="442.0" x2="559.5999999999999" y2="442.0" stroke="#C85A32" stroke-width="2"/><text x="450.79999999999995" y="434.0" font-size="14" font-weight="700" fill="#C85A32" text-anchor="middle">64 in at the foot</text><line x1="117.6" y1="374.0" x2="464.4" y2="646.0" stroke="#342E2A" stroke-width="2" stroke-dasharray="8 6"/><text x="301.0" y="544.0" font-size="14" fill="#342E2A" transform="rotate(38 301.0 544.0)">door in view, not in line</text><text x="70.0" y="715.5999999999999" font-size="14" fill="#6E645C">Solid wall behind, nightstands both sides, 24 in or more clear.</text><rect x="650" y="150" width="490" height="660" rx="16" fill="#FFFFFF" stroke="#D8CBBB" stroke-width="2"/><text x="674" y="190" font-size="21" font-weight="700" fill="#342E2A">Layouts practitioners avoid</text><rect x="674" y="215" width="180.0" height="180.0" fill="#FBF7F0" stroke="#342E2A" stroke-width="4"/><line x1="744.0" y1="395.0" x2="784.0" y2="395.0" stroke="#FBF7F0" stroke-width="7"/><rect x="726.5" y="215" width="75.0" height="100.0" fill="#8FA689" opacity=".55" stroke="#342E2A" stroke-width="2"/><line x1="764.0" y1="317.5" x2="764.0" y2="391.0" stroke="#B8432F" stroke-width="3" stroke-dasharray="6 5"/><g stroke="#B8432F" stroke-width="7" stroke-linecap="round"><line x1="820.0" y1="227" x2="842.0" y2="249"/><line x1="842.0" y1="227" x2="820.0" y2="249"/></g><rect x="912" y="215" width="180.0" height="180.0" fill="#FBF7F0" stroke="#342E2A" stroke-width="4"/><rect x="964.5" y="211" width="75.0" height="9" fill="#BFD9E6" stroke="#342E2A" stroke-width="2"/><rect x="964.5" y="221" width="75.0" height="100.0" fill="#8FA689" opacity=".55" stroke="#342E2A" stroke-width="2"/><line x1="1092.0" y1="340.0" x2="1092.0" y2="380.0" stroke="#FBF7F0" stroke-width="7"/><g stroke="#B8432F" stroke-width="7" stroke-linecap="round"><line x1="1058.0" y1="227" x2="1080.0" y2="249"/><line x1="1080.0" y1="227" x2="1058.0" y2="249"/></g><text x="674" y="423" font-size="15" font-weight="700" fill="#342E2A">Feet in line with</text><text x="674" y="443" font-size="15" font-weight="700" fill="#342E2A">the door</text><text x="912" y="423" font-size="15" font-weight="700" fill="#342E2A">Headboard under</text><text x="912" y="443" font-size="15" font-weight="700" fill="#342E2A">a window</text><rect x="674" y="490" width="442" height="290" rx="12" fill="#DCE5D6"/><text x="694" y="526" font-size="19" font-weight="700" fill="#342E2A">Room check for a queen bed</text><text x="694" y="566" font-size="16" fill="#342E2A">Bed (Sleep Foundation)</text><text x="1096" y="566" font-size="16" fill="#342E2A" text-anchor="end">60 x 80 in</text><text x="694" y="606" font-size="16" fill="#342E2A">Space each side</text><text x="1096" y="606" font-size="16" fill="#342E2A" text-anchor="end">24 in + 24 in</text><text x="694" y="646" font-size="16" fill="#342E2A">Space at the foot</text><text x="1096" y="646" font-size="16" fill="#342E2A" text-anchor="end">24 in</text><text x="694" y="686" font-size="16" fill="#342E2A" font-weight="700">Clear floor needed</text><text x="1096" y="686" font-size="16" fill="#C85A32" text-anchor="end" font-weight="700">108 x 104 in</text><text x="694" y="726" font-size="16" fill="#342E2A" font-weight="700">In feet</text><text x="1096" y="726" font-size="16" fill="#C85A32" text-anchor="end" font-weight="700">9 ft x 8 ft 8 in</text><text x="694" y="762" font-size="13" fill="#6E645C">Plus a 36 in clear path from the door (Hunker).</text><text x="60" y="850" font-size="14" fill="#6E645C">Example only. Placement rules: feng shui practitioners Anjie Cho, Rosanna Deflorian (Livingetc) and Sarah McAllister (Tom's Guide); a tradition,</text><text x="60" y="872" font-size="14" fill="#6E645C">not science. Clearance: Sleep Foundation (24 in) and Hunker (36 in from the door). Room check: our worked example.</text></svg>