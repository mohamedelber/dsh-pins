<text x="60" y="128" font-size="22" fill="#6E645C">One drawer or cabinet shelf, five zones, no more lid hunting</text>
<text x="1140" y="60" font-size="18" fill="#6E645C" text-anchor="end">dailyspacehacks.com</text>
