<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" font-family="Poppins, sans-serif" role="img" aria-labelledby="tw-t tw-d"><title id="tw-t">The container drawer map</title><desc id="tw-d">Top-down map of a kitchen drawer organized for food storage containers. Zone A along the back: lids filed upright in a divider, largest at the left. Zone B front left: rectangular containers nested largest to smallest. Zone C: square containers nested. Zone D: round containers nested. Zone E along the front: an everyday set with lids on for lunches and leftovers. Rules: every base needs a matching lid, nest by shape, file lids upright by size, and keep only what fits.</desc>
