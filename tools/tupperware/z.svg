<circle cx="802" cy="200" r="20" fill="#C85A32"/><text x="802" y="207" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">A</text>
<text x="836" y="207" font-size="23" font-weight="700" fill="#342E2A">Lids, filed upright</text>
<text x="836" y="236" font-size="18" fill="#6E645C">largest at the left, so the</text>
<text x="836" y="260" font-size="18" fill="#6E645C">right size is easy to spot</text>
<circle cx="802" cy="304" r="20" fill="#C85A32"/><text x="802" y="311" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">B</text>
<text x="836" y="311" font-size="23" font-weight="700" fill="#342E2A">Rectangles, nested</text>
<text x="836" y="340" font-size="18" fill="#6E645C">biggest at the bottom,</text>
<text x="836" y="364" font-size="18" fill="#6E645C">two stacks side by side</text>
<circle cx="802" cy="408" r="20" fill="#C85A32"/><text x="802" y="415" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">C</text>
<text x="836" y="415" font-size="23" font-weight="700" fill="#342E2A">Squares, nested</text>
<text x="836" y="444" font-size="18" fill="#6E645C">one shape family</text>
<text x="836" y="468" font-size="18" fill="#6E645C">per section</text>
<circle cx="802" cy="512" r="20" fill="#C85A32"/><text x="802" y="519" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">D</text>
<text x="836" y="519" font-size="23" font-weight="700" fill="#342E2A">Rounds, nested</text>
<text x="836" y="548" font-size="18" fill="#6E645C">bowls and soup tubs</text>
<text x="836" y="572" font-size="18" fill="#6E645C">fit inside each other</text>
<circle cx="802" cy="616" r="20" fill="#C85A32"/><text x="802" y="623" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">E</text>
<text x="836" y="623" font-size="23" font-weight="700" fill="#342E2A">Everyday set, lids on</text>
<text x="836" y="652" font-size="18" fill="#6E645C">lunch and leftover boxes</text>
<text x="836" y="676" font-size="18" fill="#6E645C">you grab most often</text>
<rect x="780" y="700" width="360" height="86" rx="12" fill="#DCE5D6"/>
<text x="800" y="734" font-size="19" font-weight="700" fill="#342E2A">Match test: every base</text>
<text x="800" y="764" font-size="19" font-weight="700" fill="#342E2A">needs a lid, or it goes</text>
<text x="60" y="868" font-size="16" fill="#6E645C">Works the same on a cabinet shelf: lids at the back, nested bases in the middle, everyday set at the front.</text>
