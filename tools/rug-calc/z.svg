<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" font-family="Poppins, sans-serif" role="img" aria-labelledby="rg-t rg-d"><title id="rg-t">Rug size rules by room</title><desc id="rg-d">Four rooms drawn from above showing how big a rug should be. Living room: the rug sits under the front legs of the sofa and chairs, with about 12 to 18 inches of bare floor to the walls. Dining room: the rug extends 24 to 36 inches past every side of the table so pulled-out chairs stay on it. Bedroom: the rug lies across the lower two-thirds of the bed and extends at least 24 inches past each side. Hallway: a runner stops about 4 to 6 inches from each wall and each end.</desc><rect width="1200" height="900" fill="#F7F1E9"/><text x="60" y="88" font-size="44" font-weight="700" fill="#342E2A">Rug Size Rules by Room</text><text x="60" y="130" font-size="22" fill="#6E645C">Seen from above. Size the rug to the furniture, then check the border.</text><text x="1140" y="60" font-size="18" fill="#6E645C" text-anchor="end">dailyspacehacks.com</text><text x="60" y="184" font-size="24" font-weight="700" fill="#342E2A">Living room</text><rect x="60" y="200" width="500" height="290" fill="#fff" stroke="#342E2A" stroke-width="5"/><text x="60" y="524" font-size="17" font-weight="700" fill="#C85A32">Front legs on the rug, 12–18 in of floor to the walls</text><rect x="120" y="250" width="380" height="190" fill="#DCE5D6" stroke="#8FA689" stroke-width="3" stroke-dasharray="10 6"/><rect x="170" y="410" width="280" height="70" rx="12" fill="#B98A5E"/><rect x="250" y="310" width="120" height="60" rx="8" fill="#D9B48A"/><rect x="155" y="230" width="70" height="60" rx="10" fill="#B98A5E"/><rect x="395" y="230" width="70" height="60" rx="10" fill="#B98A5E"/><line x1="60" y1="220" x2="120" y2="220" stroke="#C85A32" stroke-width="3"/><text x="0" y="0" font-size="16" font-weight="700" fill="#C85A32" text-anchor="middle"></text><text x="126" y="226" font-size="15" fill="#C85A32" font-weight="700">border</text><text x="640" y="184" font-size="24" font-weight="700" fill="#342E2A">Dining room</text><rect x="640" y="200" width="500" height="290" fill="#fff" stroke="#342E2A" stroke-width="5"/><text x="640" y="524" font-size="17" font-weight="700" fill="#C85A32">24–36 in of rug past every side of the table</text><rect x="690" y="230" width="400" height="230" fill="#DCE5D6" stroke="#8FA689" stroke-width="3" stroke-dasharray="10 6"/><rect x="790" y="305" width="200" height="80" rx="6" fill="#D9B48A"/><rect x="805" y="262" width="40" height="36" rx="6" fill="#B98A5E"/><rect x="805" y="392" width="40" height="36" rx="6" fill="#B98A5E"/><rect x="870" y="262" width="40" height="36" rx="6" fill="#B98A5E"/><rect x="870" y="392" width="40" height="36" rx="6" fill="#B98A5E"/><rect x="935" y="262" width="40" height="36" rx="6" fill="#B98A5E"/><rect x="935" y="392" width="40" height="36" rx="6" fill="#B98A5E"/><line x1="990" y1="345" x2="1090" y2="345" stroke="#C85A32" stroke-width="3"/><text x="1040" y="337" font-size="16" font-weight="700" fill="#C85A32" text-anchor="middle">24–36 in</text><text x="60" y="569" font-size="24" font-weight="700" fill="#342E2A">Bedroom</text><rect x="60" y="585" width="500" height="235" fill="#fff" stroke="#342E2A" stroke-width="5"/><text x="60" y="854" font-size="17" font-weight="700" fill="#C85A32">At least 24 in past each side, under the lower two-thirds</text><rect x="150" y="645" width="320" height="165" fill="#DCE5D6" stroke="#8FA689" stroke-width="3" stroke-dasharray="10 6"/><rect x="235" y="591" width="150" height="174" rx="10" fill="#B98A5E" opacity=".95"/><rect x="245" y="599" width="130" height="40" rx="8" fill="#F3EDE4"/><rect x="170" y="593" width="50" height="40" rx="4" fill="#D9B48A"/><rect x="400" y="593" width="50" height="40" rx="4" fill="#D9B48A"/><line x1="385" y1="715" x2="470" y2="715" stroke="#C85A32" stroke-width="3"/><text x="428" y="707" font-size="16" font-weight="700" fill="#C85A32" text-anchor="middle">24 in+</text><text x="640" y="644" font-size="24" font-weight="700" fill="#342E2A">Hallway runner</text><rect x="640" y="660" width="500" height="110" fill="#fff" stroke="#342E2A" stroke-width="5"/><text x="640" y="804" font-size="17" font-weight="700" fill="#C85A32">4–6 in of floor at each side and end</text><rect x="662" y="682" width="456" height="66" fill="#DCE5D6" stroke="#8FA689" stroke-width="3" stroke-dasharray="10 6"/><line x1="1118" y1="715.0" x2="1140" y2="715.0" stroke="#C85A32" stroke-width="3"/><text x="0" y="0" font-size="16" font-weight="700" fill="#C85A32" text-anchor="middle"></text><text x="1114" y="707.0" font-size="15" fill="#C85A32" font-weight="700" text-anchor="end">4–6 in</text><text x="60" y="892" font-size="14" fill="#6E645C">Rules of thumb from The Home Depot rug size guide and Fibreworks custom rug guide. Measure your own furniture before you buy.</text></svg>