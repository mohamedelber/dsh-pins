<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" font-family="Poppins, sans-serif" role="img" aria-labelledby="lf-t lf-d"><title id="lf-t">How to board a loft for storage</title><desc id="lf-d">Cross-section of a loft boarded for storage. Ceiling joists sit on the ceiling below. Insulation fills between the joists and a cross layer goes on top, about 270 mm in total for mineral wool. Loft legs raise the storage boards above the insulation so it is not squashed. A gap is left at the eaves so air can flow and stop condensation. Light storage boxes go on the boards; keep loads light, keep clear of flues, and check with building control before converting the loft into a room.</desc>
<rect width="1200" height="900" fill="#F7F1E9"/>
<text x="60" y="88" font-size="44" font-weight="700" fill="#342E2A">Board a Loft for Storage</text>
<text x="60" y="128" font-size="22" fill="#6E645C">Raise the boards so the insulation stays full depth</text>
<text x="1140" y="60" font-size="18" fill="#6E645C" text-anchor="end">dailyspacehacks.com</text>
