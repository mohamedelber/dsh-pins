<text x="822" y="456" font-size="21" font-weight="700" fill="#342E2A">On the rug</text><text x="822" y="484" font-size="17" fill="#6E645C">sofa and chairs both touch it</text>
<rect x="670" y="524" width="470" height="92" rx="14" fill="#fff" stroke="#D8CBBB" stroke-width="2"/>
