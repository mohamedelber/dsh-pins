<text x="822" y="564" font-size="21" font-weight="700" fill="#342E2A">TV size</text><text x="822" y="592" font-size="17" fill="#6E645C">about 52 in at 7 ft away</text>
<rect x="670" y="632" width="470" height="92" rx="14" fill="#fff" stroke="#D8CBBB" stroke-width="2"/>
