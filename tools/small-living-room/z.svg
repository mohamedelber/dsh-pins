<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" font-family="Poppins, sans-serif" role="img" aria-labelledby="lr-t lr-d"><title id="lr-t">Small living room spacing guide</title><desc id="lr-d">Top-down plan of an example 12 by 13 foot apartment living room with spacing rules. A sofa sits against the bottom wall with a coffee table 16 to 18 inches in front of it. A 6 by 9 foot rug sits under the front legs of the sofa and the armchair. The TV hangs on the opposite wall above a low console. A 30 to 36 inch walkway runs from the door on the right wall past the end of the sofa. Anchor the TV and tall shelves to the wall.</desc>
