<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" font-family="Poppins, sans-serif" role="img" aria-labelledby="rl-t rl-d"><title id="rl-t">Recessed lighting spacing guide</title><desc id="rl-d">Side view of a room with an 8 ft ceiling and three recessed lights. The lights are 4 ft apart, half the ceiling height, and the first light is 2 ft from the wall, half the spacing, so the cones of light meet evenly on the floor. A table shows the spacing and wall distance for 8, 9, 10 and 12 ft ceilings and how many lumens per square foot each room needs.</desc><rect width="1200" height="900" fill="#F7F1E9"/><text x="60" y="84" font-size="44" font-weight="700" fill="#342E2A">Recessed Lighting Spacing</text><text x="60" y="124" font-size="22" fill="#6E645C">Half the ceiling height apart, half that from the walls</text><text x="1140" y="60" font-size="18" fill="#6E645C" text-anchor="end">dailyspacehacks.com</text><rect x="110" y="270" width="600" height="400" fill="#fff"/><clipPath id="rl-c"><rect x="110" y="270" width="600" height="400"/></clipPath><g clip-path="url(#rl-c)"><polygon points="200,278 220,278 322.5,670 97.5,670" fill="#E9C46A" fill-opacity="0.28"/><polygon points="400,278 420,278 522.5,670 297.5,670" fill="#E9C46A" fill-opacity="0.28"/><polygon points="600,278 620,278 722.5,670 497.5,670" fill="#E9C46A" fill-opacity="0.28"/></g><line x1="90" y1="270" x2="730" y2="270" stroke="#342E2A" stroke-width="6"/><line x1="90" y1="670" x2="730" y2="670" stroke="#B98A5E" stroke-width="6"/><line x1="110" y1="270" x2="110" y2="670" stroke="#342E2A" stroke-width="6"/><line x1="710" y1="270" x2="710" y2="670" stroke="#342E2A" stroke-width="6"/><rect x="194" y="270" width="32" height="9" rx="3" fill="#E9C46A" stroke="#B98A5E" stroke-width="2"/><rect x="394" y="270" width="32" height="9" rx="3" fill="#E9C46A" stroke="#B98A5E" stroke-width="2"/><rect x="594" y="270" width="32" height="9" rx="3" fill="#E9C46A" stroke="#B98A5E" stroke-width="2"/><rect x="150" y="600" width="190" height="70" rx="14" fill="#CFDDCB"/><rect x="150" y="560" width="40" height="110" rx="12" fill="#CFDDCB"/><rect x="440" y="622" width="150" height="10" rx="3" fill="#D9B48A"/><line x1="455" y1="632" x2="455" y2="670" stroke="#B98A5E" stroke-width="6"/><line x1="575" y1="632" x2="575" y2="670" stroke="#B98A5E" stroke-width="6"/><line x1="110" y1="236" x2="210" y2="236" stroke="#3F5E39" stroke-width="3" stroke-dasharray="8 6"/><line x1="110" y1="226" x2="110" y2="246" stroke="#3F5E39" stroke-width="3"/><line x1="210" y1="226" x2="210" y2="246" stroke="#3F5E39" stroke-width="3"/><text x="160.0" y="220" font-size="20" font-weight="700" fill="#3F5E39" text-anchor="middle">2 ft</text><line x1="210" y1="236" x2="410" y2="236" stroke="#C85A32" stroke-width="3"/><line x1="210" y1="226" x2="210" y2="246" stroke="#C85A32" stroke-width="3"/><line x1="410" y1="226" x2="410" y2="246" stroke="#C85A32" stroke-width="3"/><text x="310.0" y="220" font-size="20" font-weight="700" fill="#C85A32" text-anchor="middle">4 ft apart</text><line x1="410" y1="236" x2="610" y2="236" stroke="#C85A32" stroke-width="3"/><line x1="410" y1="226" x2="410" y2="246" stroke="#C85A32" stroke-width="3"/><line x1="610" y1="226" x2="610" y2="246" stroke="#C85A32" stroke-width="3"/><text x="510.0" y="220" font-size="20" font-weight="700" fill="#C85A32" text-anchor="middle">4 ft apart</text><line x1="610" y1="236" x2="710" y2="236" stroke="#3F5E39" stroke-width="3" stroke-dasharray="8 6"/><line x1="610" y1="226" x2="610" y2="246" stroke="#3F5E39" stroke-width="3"/><line x1="710" y1="226" x2="710" y2="246" stroke="#3F5E39" stroke-width="3"/><text x="660.0" y="220" font-size="20" font-weight="700" fill="#3F5E39" text-anchor="middle">2 ft</text><line x1="60" y1="270" x2="60" y2="670" stroke="#342E2A" stroke-width="3"/><line x1="50" y1="270" x2="70" y2="270" stroke="#342E2A" stroke-width="3"/><line x1="50" y1="670" x2="70" y2="670" stroke="#342E2A" stroke-width="3"/><text x="46" y="470.0" font-size="20" font-weight="700" fill="#342E2A" text-anchor="middle" transform="rotate(-90 46 470.0)">8 ft ceiling</text><text x="410" y="716" font-size="21" font-weight="700" fill="#C85A32" text-anchor="middle">Spacing = ceiling height ÷ 2</text><text x="410" y="746" font-size="21" font-weight="700" fill="#3F5E39" text-anchor="middle">Wall distance = spacing ÷ 2</text><text x="410" y="776" font-size="17" fill="#6E645C" text-anchor="middle">so the cones of light meet evenly</text><rect x="790" y="190" width="360" height="610" rx="18" fill="#fff" stroke="#E6DCCF" stroke-width="2"/><text x="814" y="234" font-size="22" font-weight="700" fill="#342E2A">Spacing by ceiling</text><text x="814" y="270" font-size="15" font-weight="700" fill="#6E645C">Ceiling</text><text x="920" y="270" font-size="15" font-weight="700" fill="#6E645C">Apart</text><text x="1026" y="270" font-size="15" font-weight="700" fill="#6E645C">To wall</text><rect x="802" y="280" width="336" height="44" rx="10" fill="#CFDDCB" fill-opacity="0.5"/><text x="814" y="310" font-size="17" font-weight="700" fill="#342E2A">8 ft</text><text x="920" y="310" font-size="17" font-weight="700" fill="#C85A32">4 ft</text><text x="1026" y="310" font-size="17" font-weight="700" fill="#3F5E39">2 ft</text><text x="814" y="358" font-size="17" font-weight="700" fill="#342E2A">9 ft</text><text x="920" y="358" font-size="17" font-weight="700" fill="#C85A32">4 ft 6 in</text><text x="1026" y="358" font-size="17" font-weight="700" fill="#3F5E39">2 ft 3 in</text><rect x="802" y="376" width="336" height="44" rx="10" fill="#CFDDCB" fill-opacity="0.5"/><text x="814" y="406" font-size="17" font-weight="700" fill="#342E2A">10 ft</text><text x="920" y="406" font-size="17" font-weight="700" fill="#C85A32">5 ft</text><text x="1026" y="406" font-size="17" font-weight="700" fill="#3F5E39">2 ft 6 in</text><text x="814" y="454" font-size="17" font-weight="700" fill="#342E2A">12 ft</text><text x="920" y="454" font-size="17" font-weight="700" fill="#C85A32">6 ft</text><text x="1026" y="454" font-size="17" font-weight="700" fill="#3F5E39">3 ft</text><text x="814" y="540" font-size="22" font-weight="700" fill="#342E2A">Light per room</text><text x="814" y="568" font-size="14" fill="#6E645C">lumens per sq ft</text><text x="814" y="608" font-size="17" fill="#342E2A">Hallway</text><text x="1126" y="608" font-size="17" font-weight="700" fill="#C85A32" text-anchor="end">5 to 10</text><text x="814" y="650" font-size="17" fill="#342E2A">Living, bedroom</text><text x="1126" y="650" font-size="17" font-weight="700" fill="#C85A32" text-anchor="end">10 to 20</text><text x="814" y="692" font-size="17" fill="#342E2A">Kitchen, dining</text><text x="1126" y="692" font-size="17" font-weight="700" fill="#C85A32" text-anchor="end">30 to 40</text><text x="814" y="734" font-size="17" fill="#342E2A">Bathroom</text><text x="1126" y="734" font-size="17" font-weight="700" fill="#C85A32" text-anchor="end">20 to 50+</text><text x="814" y="780" font-size="14" fill="#6E645C">Room area x lumens = total light</text></svg>