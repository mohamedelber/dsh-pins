<text x="84" y="198" font-size="19" fill="#342E2A"><tspan font-weight="700" fill="#C85A32">Rule of thumb:</tspan> a 10 x 10 ft room fits a queen and a nightstand; under 9 ft wide, pick a full, twin or daybed.</text>
