<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" font-family="Poppins, sans-serif" role="img" aria-labelledby="gb-t gb-d"><title id="gb-t">Smallest guest room for each bed size</title><desc id="gb-d">Top-down diagram comparing the smallest guest room for each standard US bed size, with 24 inches of walking space on both sides and at the foot of the bed. Twin bed 38 by 75 inches needs a room about 7'2" wide by 8'3" long. Full bed 54 by 75 inches needs a room about 8'6" wide by 8'3" long. Queen bed 60 by 80 inches needs a room about 9' wide by 8'8" long. King bed 76 by 80 inches needs a room about 10'4" wide by 8'8" long. Add space for a nightstand, a dresser and the door swing.</desc>
