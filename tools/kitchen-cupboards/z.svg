<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" font-family="Poppins, sans-serif" role="img" aria-labelledby="kc-t kc-d"><title id="kc-t">Kitchen cupboard zones by height</title><desc id="kc-d">Side view of a standard UK kitchen wall with typical sizes. Worktop at about 900 mm. Base units about 560 mm deep below it. Wall units start about 450 to 500 mm above the worktop, so their bottom shelf sits at about 1350 to 1400 mm, and a 720 mm wall unit reaches about 2070 mm. Zone 1, everyday items: top drawers, the worktop and the lowest wall shelf, roughly between waist and shoulder height. Zone 2, heavy and bulky items: base cupboards and deep drawers. Zone 3, rarely used light items: the top wall shelf and above. Cleaning products high up and locked if children visit, away from food.</desc><rect width="1200" height="900" fill="#F7F1E9"/><text x="60" y="80" font-size="40" font-weight="700" fill="#342E2A">What Goes Where in Kitchen Cupboards</text><text x="60" y="118" font-size="22" fill="#6E645C">Side view of a standard UK kitchen, typical heights in mm</text><text x="1140" y="30" font-size="18" fill="#6E645C" text-anchor="end">dailyspacehacks.com</text><rect x="150" y="155.0" width="40" height="675.0" fill="#E9DFD2"/><line x1="130" y1="830" x2="480" y2="830" stroke="#342E2A" stroke-width="4"/><rect x="190" y="569.0" width="168.0" height="231.0" fill="#8FA689" stroke="#342E2A" stroke-width="2"/><rect x="190" y="800.0" width="156.0" height="30.0" fill="#A9B8A3"/><rect x="190" y="560.0" width="188.0" height="9.0" fill="#D9B48A" stroke="#B98A5E" stroke-width="2"/><line x1="194" y1="614.0" x2="354.0" y2="614.0" stroke="#342E2A" stroke-width="1.5"/><line x1="194" y1="701.0" x2="354.0" y2="701.0" stroke="#342E2A" stroke-width="1.5" stroke-dasharray="4 3"/><rect x="190" y="209.0" width="90.0" height="216.0" fill="#DCE5D6" stroke="#342E2A" stroke-width="2"/><line x1="193" y1="353.0" x2="277.0" y2="353.0" stroke="#342E2A" stroke-width="1.5"/><line x1="193" y1="281.0" x2="277.0" y2="281.0" stroke="#342E2A" stroke-width="1.5"/><rect x="428.0" y="134.0" width="330" height="147.0" rx="10" fill="#EFE6DA" opacity="0.9"/><circle cx="456.0" cy="164.0" r="17" fill="#C85A32"/><text x="456.0" y="170.0" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="484.0" y="171.0" font-size="20" font-weight="700" fill="#342E2A">Rarely used, light</text><text x="448.0" y="200.0" font-size="16" fill="#342E2A">Top shelf and above:</text><text x="448.0" y="223.0" font-size="16" fill="#342E2A">party glasses, spare jars</text><rect x="428.0" y="281.0" width="330" height="333.0" rx="10" fill="#DCE5D6" opacity="0.9"/><circle cx="456.0" cy="311.0" r="17" fill="#C85A32"/><text x="456.0" y="317.0" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="484.0" y="318.0" font-size="20" font-weight="700" fill="#342E2A">Every day</text><text x="448.0" y="347.0" font-size="16" fill="#342E2A">Lowest wall shelf, worktop,</text><text x="448.0" y="370.0" font-size="16" fill="#342E2A">top drawers: plates, mugs,</text><text x="448.0" y="393.0" font-size="16" fill="#342E2A">cutlery, oil, everyday food</text><rect x="428.0" y="614.0" width="330" height="216.0" rx="10" fill="#ECCDA0" opacity="0.9"/><circle cx="456.0" cy="644.0" r="17" fill="#C85A32"/><text x="456.0" y="650.0" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="484.0" y="651.0" font-size="20" font-weight="700" fill="#342E2A">Heavy and bulky</text><text x="448.0" y="680.0" font-size="16" fill="#342E2A">Base cupboards and deep</text><text x="448.0" y="703.0" font-size="16" fill="#342E2A">drawers: pans, mixing bowls,</text><text x="448.0" y="726.0" font-size="16" fill="#342E2A">small appliances, tins</text><line x1="136" y1="209.0" x2="150" y2="209.0" stroke="#C85A32" stroke-width="2"/><text x="130" y="215.0" font-size="16" font-weight="700" fill="#C85A32" text-anchor="end">~2,070</text><line x1="136" y1="425.0" x2="150" y2="425.0" stroke="#C85A32" stroke-width="2"/><text x="130" y="431.0" font-size="16" font-weight="700" fill="#C85A32" text-anchor="end">~1,350</text><line x1="136" y1="560.0" x2="150" y2="560.0" stroke="#C85A32" stroke-width="2"/><text x="130" y="566.0" font-size="16" font-weight="700" fill="#C85A32" text-anchor="end">~900</text><line x1="136" y1="830.0" x2="150" y2="830.0" stroke="#C85A32" stroke-width="2"/><text x="130" y="836.0" font-size="16" font-weight="700" fill="#C85A32" text-anchor="end">0</text><line x1="306.0" y1="425.0" x2="306.0" y2="560.0" stroke="#C85A32" stroke-width="2"/><line x1="298.0" y1="425.0" x2="314.0" y2="425.0" stroke="#C85A32" stroke-width="2"/><line x1="298.0" y1="560.0" x2="314.0" y2="560.0" stroke="#C85A32" stroke-width="2"/><text x="318.0" y="498.5" font-size="15" font-weight="700" fill="#C85A32">450–500</text><text x="274.0" y="856" font-size="15" fill="#6E645C" text-anchor="middle">base ~560 deep</text><text x="235.0" y="197.0" font-size="15" fill="#6E645C" text-anchor="middle">wall ~300 deep</text><rect x="788.0" y="134.0" width="250" height="230" rx="12" fill="#FFFFFF" stroke="#D8CBBB" stroke-width="2"/><rect x="788.0" y="134.0" width="8" height="230" rx="4" fill="#C85A32"/><text x="812.0" y="170.0" font-size="19" font-weight="700" fill="#342E2A">Cleaning products</text><text x="812.0" y="209.0" font-size="16" font-weight="400" fill="#342E2A">Keep them away from</text><text x="812.0" y="234.0" font-size="16" font-weight="400" fill="#342E2A">food, in their original</text><text x="812.0" y="259.0" font-size="16" font-weight="400" fill="#342E2A">containers, and high up</text><text x="812.0" y="284.0" font-size="16" font-weight="400" fill="#342E2A">and locked if children</text><text x="812.0" y="309.0" font-size="16" font-weight="400" fill="#342E2A">visit (RoSPA).</text><rect x="788.0" y="384.0" width="250" height="170" rx="12" fill="#FFFFFF" stroke="#D8CBBB" stroke-width="2"/><rect x="788.0" y="384.0" width="8" height="170" rx="4" fill="#8FA689"/><text x="812.0" y="420.0" font-size="19" font-weight="700" fill="#342E2A">Near where you use it</text><text x="812.0" y="459.0" font-size="16" font-weight="400" fill="#342E2A">Mugs by the kettle,</text><text x="812.0" y="484.0" font-size="16" font-weight="400" fill="#342E2A">plates by the dishwasher,</text><text x="812.0" y="509.0" font-size="16" font-weight="400" fill="#342E2A">spices by the hob.</text><text x="60" y="878" font-size="14" fill="#6E645C">Typical UK sizes from cutmy.co.uk and Worktop Express; your kitchen may differ. Zone 1 builds on NHS advice to keep everyday items at waist or worktop level.</text></svg>