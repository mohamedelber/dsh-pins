<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" font-family="Poppins, sans-serif" role="img" aria-labelledby="bs-t bs-d"><title id="bs-t">Blanket storage: will it fit?</title><desc id="bs-d">Left: measuring under a bed. Two IKEA bed frames list 7 7/8 and 8 1/4 inches of clearance underneath. A 6.3-inch drawer unit and a 7-inch wheeled box fit; a 7 1/2-inch case is tight on the lower frame. Bed risers that add 5 1/4 inches raise an 8 1/4-inch clearance to 13 1/2 inches. Right: inside storage space, calculated from listed dimensions (inside for the ottoman and bench, outside for the soft case): a 32-inch storage ottoman holds about 2.4 cubic feet, a 40-inch storage bench about 3.4, and a 35 1/2-inch under-bed case about 3.2. Bottom: a folded duvet needs 14 to 16 inches between shelves, against a typical fixed 12; the three blanket ladders we checked list load limits from 2.2 pounds per bar to 20 pounds; keep blankets at least 3 feet from space heaters.</desc><rect width="1200" height="900" fill="#F7F1E9"/><text x="60" y="78" font-size="40" font-weight="700" fill="#342E2A">Blanket Storage: Will It Fit?</text><text x="60" y="114" font-size="20" fill="#6E645C">Measure the space first; real product sizes in inches</text><text x="1140" y="30" font-size="18" fill="#6E645C" text-anchor="end">dailyspacehacks.com</text><rect x="40" y="140" width="580" height="500" rx="16" fill="#FFFFFF" stroke="#D8CBBB" stroke-width="2"/><text x="64" y="180" font-size="20" font-weight="700" fill="#C85A32">Under the bed</text><line x1="60" y1="560" x2="600" y2="560" stroke="#342E2A" stroke-width="3"/><rect x="70" y="344.5" width="300" height="34" rx="4" fill="#C9A06B" stroke="#A97F4C" stroke-width="2"/><rect x="70" y="378.5" width="12" height="181.5" fill="#A97F4C"/><rect x="358" y="378.5" width="12" height="181.5" fill="#A97F4C"/><text x="220.0" y="334.5" font-size="14" font-weight="700" fill="#342E2A" text-anchor="middle">IKEA frame: 8 1/4 in clear</text><rect x="92" y="421.4" width="80" height="138.6" rx="4" fill="#E9DFD2" stroke="#6E645C" stroke-width="1.5"/><text x="132" y="495.7" font-size="12" font-weight="700" fill="#342E2A" text-anchor="middle">6.3 in unit</text><rect x="182" y="406" width="80" height="154" rx="4" fill="#9DB4C0" stroke="#6E645C" stroke-width="1.5"/><text x="222" y="488.0" font-size="12" font-weight="700" fill="#342E2A" text-anchor="middle">7 in box</text><rect x="272" y="395.0" width="80" height="165.0" rx="4" fill="#B9C9AE" stroke="#6E645C" stroke-width="1.5"/><text x="312" y="482.5" font-size="12" font-weight="700" fill="#342E2A" text-anchor="middle">7 1/2 in case</text><line x1="385" y1="378.5" x2="385" y2="560" stroke="#C85A32" stroke-width="2"/><text x="392" y="469.25" font-size="14" font-weight="700" fill="#C85A32">8 1/4</text><rect x="440" y="229.0" width="150" height="34" rx="4" fill="#C9A06B" stroke="#A97F4C" stroke-width="2"/><rect x="440" y="263.0" width="12" height="297.0" fill="#A97F4C"/><rect x="578" y="263.0" width="12" height="297.0" fill="#A97F4C"/><text x="515.0" y="219.0" font-size="14" font-weight="700" fill="#342E2A" text-anchor="middle">+ 5 1/4 in risers</text><line x1="428" y1="263.0" x2="428" y2="560" stroke="#C85A32" stroke-width="2"/><text x="515" y="411.5" font-size="15" font-weight="700" fill="#C85A32" text-anchor="middle">13 1/2 in</text><text x="64" y="600" font-size="14" fill="#342E2A">Another IKEA frame lists just 7 7/8 in: the 7 1/2 in case is tight there.</text><text x="64" y="622" font-size="14" fill="#342E2A">Measure from the floor to the lowest rail, not to the mattress.</text><rect x="650" y="140" width="510" height="500" rx="16" fill="#FFFFFF" stroke="#D8CBBB" stroke-width="2"/><text x="674" y="180" font-size="20" font-weight="700" fill="#C85A32">Space inside (cubic feet)</text><text x="674" y="204" font-size="13" fill="#6E645C">From listed sizes: inside for ottoman and bench, outside for the case</text><text x="674" y="250" font-size="16" font-weight="700" fill="#342E2A">Storage ottoman, 32 in</text><text x="674" y="270" font-size="13" fill="#6E645C">28.4 x 12.25 x 11.75 in inside</text><rect x="674" y="282" width="284.40000000000003" height="28" rx="6" fill="#8FA689"/><text x="968.4000000000001" y="302" font-size="16" font-weight="700" fill="#342E2A">2.4</text><text x="674" y="368" font-size="16" font-weight="700" fill="#342E2A">Storage bench, 40 in</text><text x="674" y="388" font-size="13" fill="#6E645C">37.75 x 15.75 x 9.75 in inside</text><rect x="674" y="400" width="402.0" height="28" rx="6" fill="#8FA689"/><text x="1086.0" y="420" font-size="16" font-weight="700" fill="#342E2A">3.4</text><text x="674" y="486" font-size="16" font-weight="700" fill="#342E2A">Under-bed case, 35 1/2 in</text><text x="674" y="506" font-size="13" fill="#6E645C">35.5 x 20.75 x 7.5 in</text><rect x="674" y="518" width="384.0" height="28" rx="6" fill="#8FA689"/><text x="1068.0" y="538" font-size="16" font-weight="700" fill="#342E2A">3.2</text><text x="674" y="608" font-size="13" fill="#6E645C">The inside size, not the outside size, decides what fits.</text><rect x="40" y="665" width="1120" height="140" rx="16" fill="#FFFFFF" stroke="#D8CBBB" stroke-width="2"/><text x="70" y="723" font-size="34" font-weight="700" fill="#C85A32">14–16 in</text><text x="70" y="755" font-size="15" fill="#342E2A">between shelves for a</text><text x="70" y="777" font-size="15" fill="#342E2A">folded duvet (fixed: often 12 in)</text><text x="440" y="723" font-size="34" font-weight="700" fill="#C85A32">2.2–20 lb</text><text x="440" y="755" font-size="15" fill="#342E2A">load limits listed on the</text><text x="440" y="777" font-size="15" fill="#342E2A">three ladders we checked</text><text x="810" y="723" font-size="34" font-weight="700" fill="#C85A32">3 ft</text><text x="810" y="755" font-size="15" fill="#342E2A">clear between blankets</text><text x="810" y="777" font-size="15" fill="#342E2A">and any space heater</text><text x="60" y="846" font-size="14" fill="#6E645C">Sources: IKEA US (MALM and NEIDEN frames, SKUBB), Sterilite, Brightroom and Mainstays listings, Target (Linon and HomePop), Closet World,</text><text x="60" y="868" font-size="14" fill="#6E645C">Yamazaki, VASAGLE and DecMode listings, U.S. Fire Administration. Checked Oct 26, 2026. Sizes vary by model: measure yours.</text></svg>