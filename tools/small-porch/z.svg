<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" font-family="Poppins, sans-serif" role="img" aria-labelledby="po-t po-d"><title id="po-t">A 3 square metre porch, measured</title><desc id="po-d">Left: plan of an example small porch measuring 2.0 by 1.5 metres externally, which is 3 square metres, the most a porch can have under permitted development in England. With single-skin walls about 10 cm thick, the inside is about 1.8 by 1.4 metres, or 2.5 square metres. A bench 40 cm deep sits on one side, coat hooks on the other, and a 60 by 85 cm doormat inside the outer door. Right: the permitted development checks for a porch in England (3 square metres measured externally, no more than 3 metres high, at least 2 metres from a boundary next to a highway, not for flats, maisonettes or where an Article 4 direction or condition applies), when a porch is normally exempt from Building Regulations (ground level, under 30 square metres, front door kept, heating not extended into it, glazing and electrics still comply), and where safety glass is needed.</desc><rect width="1200" height="900" fill="#F7F1E9"/><text x="60" y="80" font-size="42" font-weight="700" fill="#342E2A">A Small Porch, Measured</text><text x="60" y="116" font-size="21" fill="#6E645C">What fits in 3 m², and the rules that decide its size</text><text x="1140" y="30" font-size="18" fill="#6E645C" text-anchor="end">dailyspacehacks.com</text><rect x="30" y="200" width="540.0" height="40" fill="#B5654A"/><text x="300.0" y="226" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700">HOUSE WALL</text><rect x="80" y="240" width="440.00000000000006" height="330.0" fill="#B5654A"/><rect x="102.0" y="240" width="396.00000000000006" height="308.0" fill="#FBF7F0"/><rect x="207.60000000000002" y="200" width="184.8" height="40" fill="#E8D9C4"/><text x="300.0" y="190" font-size="14" fill="#342E2A" text-anchor="middle">front door stays</text><rect x="207.60000000000002" y="548.0" width="184.8" height="22.0" fill="#BFD9E6" stroke="#342E2A" stroke-width="1"/><text x="300.0" y="592.0" font-size="14" fill="#342E2A" text-anchor="middle">glazed outer door</text><rect x="206.5" y="416.0" width="187.00000000000003" height="132.0" fill="#D9B98A" stroke="#A9895A" stroke-width="2"/><text x="300.0" y="487.0" font-size="14" fill="#342E2A" text-anchor="middle">mat 60 x 85 cm</text><rect x="102.0" y="284.0" width="88.0" height="220.00000000000003" fill="#C9A06B"/><text x="146.0" y="394.0" font-size="14" fill="#342E2A" text-anchor="middle" transform="rotate(-90 146.0 394.0)">bench 40 cm deep</text><circle cx="490.00000000000006" cy="295.0" r="6" fill="#342E2A"/><circle cx="490.00000000000006" cy="334.6" r="6" fill="#342E2A"/><circle cx="490.00000000000006" cy="374.20000000000005" r="6" fill="#342E2A"/><circle cx="490.00000000000006" cy="413.8" r="6" fill="#342E2A"/><text x="478.00000000000006" y="350.0" font-size="14" fill="#342E2A" text-anchor="end" transform="rotate(-90 478.00000000000006 350.0)">coat hooks</text><line x1="80" y1="622.0" x2="520.0" y2="622.0" stroke="#C85A32" stroke-width="2"/><line x1="80" y1="616.0" x2="80" y2="628.0" stroke="#C85A32" stroke-width="2"/><line x1="520.0" y1="616.0" x2="520.0" y2="628.0" stroke="#C85A32" stroke-width="2"/><text x="300.0" y="644.0" font-size="15" font-weight="700" fill="#C85A32" text-anchor="middle">2.0 m outside</text><line x1="540.0" y1="240" x2="540.0" y2="570.0" stroke="#C85A32" stroke-width="2"/><line x1="534.0" y1="240" x2="546.0" y2="240" stroke="#C85A32" stroke-width="2"/><line x1="534.0" y1="570.0" x2="546.0" y2="570.0" stroke="#C85A32" stroke-width="2"/><text x="552.0" y="410.0" font-size="15" font-weight="700" fill="#C85A32">1.5 m outside</text><line x1="102.0" y1="670.0" x2="498.00000000000006" y2="670.0" stroke="#6E645C" stroke-width="2"/><line x1="102.0" y1="664.0" x2="102.0" y2="676.0" stroke="#6E645C" stroke-width="2"/><line x1="498.00000000000006" y1="664.0" x2="498.00000000000006" y2="676.0" stroke="#6E645C" stroke-width="2"/><text x="300.0" y="692.0" font-size="15" font-weight="700" fill="#6E645C" text-anchor="middle">about 1.8 m inside</text><rect x="80" y="710.0" width="440.00000000000006" height="70" rx="10" fill="#DCE5D6"/><text x="300.0" y="740.0" font-size="17" font-weight="700" fill="#342E2A" text-anchor="middle">3.0 m² outside = about 2.5 m² inside</text><text x="300.0" y="765.0" font-size="14" fill="#6E645C" text-anchor="middle">The 3 m² limit is measured externally, so walls eat into it.</text><rect x="690" y="150" width="450" height="660" rx="16" fill="#FFFFFF" stroke="#D8CBBB" stroke-width="2"/><text x="714" y="190" font-size="19" font-weight="700" fill="#C85A32">No planning permission (England) if:</text><text x="714" y="220" font-size="15" fill="#342E2A" xml:space="preserve">✓ 3 m² or less, measured outside</text><text x="714" y="247" font-size="15" fill="#342E2A" xml:space="preserve">✓ no part higher than 3 m</text><text x="714" y="274" font-size="15" fill="#342E2A" xml:space="preserve">✓ 2 m or more from a boundary next</text><text x="714" y="301" font-size="15" fill="#342E2A" xml:space="preserve">   to a highway (a road or public path)</text><text x="714" y="328" font-size="15" fill="#342E2A" xml:space="preserve">✓ a house, not a flat or maisonette</text><text x="714" y="355" font-size="15" fill="#342E2A" xml:space="preserve">✓ no Article 4 direction or condition</text><text x="714" y="382" font-size="15" fill="#342E2A" xml:space="preserve">Listed building? Consent still needed.</text><text x="714" y="431" font-size="19" font-weight="700" fill="#C85A32">Building Regs: normally exempt if:</text><text x="714" y="461" font-size="15" fill="#342E2A" xml:space="preserve">✓ at ground level and under 30 m²</text><text x="714" y="488" font-size="15" fill="#342E2A" xml:space="preserve">✓ the front door stays in place</text><text x="714" y="515" font-size="15" fill="#342E2A" xml:space="preserve">✓ house heating not extended into it</text><text x="714" y="542" font-size="15" fill="#342E2A" xml:space="preserve">Glazing and fixed wiring must still comply.</text><text x="714" y="591" font-size="19" font-weight="700" fill="#C85A32">Safety glass needed:</text><text x="714" y="621" font-size="15" fill="#342E2A" xml:space="preserve">• in doors, below 1500 mm</text><text x="714" y="648" font-size="15" fill="#342E2A" xml:space="preserve">• within 300 mm of a door edge</text><text x="714" y="675" font-size="15" fill="#342E2A" xml:space="preserve">• other glazing below 800 mm</text><text x="60" y="850" font-size="14" fill="#6E645C">Example only. Sources: Planning Portal and legislation.gov.uk (Class D), Planning Portal (Building Regulations), gov.uk circular on porches,</text><text x="60" y="872" font-size="14" fill="#6E645C">Lancaster City Council (safety glass), First Mats (mat size). Wall thickness and inside size: our worked example. Wales has the same limits.</text></svg>