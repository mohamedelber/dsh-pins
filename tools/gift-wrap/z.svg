<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" font-family="Poppins, sans-serif" role="img" aria-labelledby="gw-t gw-d"><title id="gw-t">How to size gift wrap storage</title><desc id="gw-d">How to size gift wrap storage. Step 1: measure your longest roll; common roll widths are 24, 30 and 36 inches. Step 2: an upright bin should be at least two thirds as tall as the roll, for example 20 inches or more for a 30-inch roll. Step 3: a flat under-bed box needs an inside length of at least the roll length plus 1 inch, for example 31 inches or more for a 30-inch roll, and must be lower than the gap under the bed. Gift bags are filed upright by size and tissue paper is stored flat. Keep wrap at least 3 feet from heaters and out of attics and basements.</desc>
<rect width="1200" height="900" fill="#F7F1E9"/>
<text x="60" y="88" font-size="44" font-weight="700" fill="#342E2A">Size Your Gift Wrap Storage</text>
<text x="60" y="128" font-size="22" fill="#6E645C">Measure the longest roll first, then pick a container that fits it</text>
<text x="1140" y="60" font-size="18" fill="#6E645C" text-anchor="end">dailyspacehacks.com</text>
<rect x="60" y="165" width="340" height="440" rx="16" fill="#FFFFFF" stroke="#D8CBBB" stroke-width="2"/>
<circle cx="96" cy="205" r="20" fill="#C85A32"/>
<text x="96" y="213" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="128" y="214" font-size="25" font-weight="700" fill="#342E2A">Measure the roll</text>
<rect x="100" y="275.0" width="160" height="40" fill="#DCE5D6" stroke="#6E645C" stroke-width="1.5"/>
<ellipse cx="260" cy="295" rx="8.0" ry="20.0" fill="#DCE5D6" stroke="#6E645C" stroke-width="1.5"/>
<ellipse cx="260" cy="295" rx="3.3333333333333335" ry="8.0" fill="#B98A5E"/>
<text x="282" y="302" font-size="20" font-weight="700" fill="#342E2A">24 in</text>
<rect x="100" y="370.0" width="200" height="40" fill="#ECCDA0" stroke="#6E645C" stroke-width="1.5"/>
<ellipse cx="300" cy="390" rx="8.0" ry="20.0" fill="#ECCDA0" stroke="#6E645C" stroke-width="1.5"/>
<ellipse cx="300" cy="390" rx="3.3333333333333335" ry="8.0" fill="#B98A5E"/>
<text x="322" y="397" font-size="20" font-weight="700" fill="#342E2A">30 in</text>
<rect x="100" y="465.0" width="240" height="40" fill="#E8B9A3" stroke="#6E645C" stroke-width="1.5"/>
<ellipse cx="340" cy="485" rx="8.0" ry="20.0" fill="#E8B9A3" stroke="#6E645C" stroke-width="1.5"/>
<ellipse cx="340" cy="485" rx="3.3333333333333335" ry="8.0" fill="#B98A5E"/>
<text x="362" y="492" font-size="20" font-weight="700" fill="#342E2A">36 in</text>
<text x="90" y="570" font-size="18" fill="#6E645C">Common roll widths. Measure</text>
<text x="90" y="594" font-size="18" fill="#6E645C">your longest roll: that is L.</text>
<rect x="430" y="165" width="340" height="440" rx="16" fill="#FFFFFF" stroke="#D8CBBB" stroke-width="2"/>
<circle cx="466" cy="205" r="20" fill="#C85A32"/>
<text x="466" y="213" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="498" y="214" font-size="25" font-weight="700" fill="#342E2A">Upright bin</text>
<rect x="510.0" y="310" width="24" height="225" fill="#DCE5D6" stroke="#6E645C" stroke-width="1.5"/>
<ellipse cx="522" cy="310" rx="12.0" ry="4.8" fill="#DCE5D6" stroke="#6E645C" stroke-width="1.5"/>
