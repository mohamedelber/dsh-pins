<ellipse cx="549" cy="310" rx="12.0" ry="4.8" fill="#ECCDA0" stroke="#6E645C" stroke-width="1.5"/>
<ellipse cx="549" cy="310" rx="4.8" ry="2.0" fill="#B98A5E"/>
<rect x="564.0" y="310" width="24" height="225" fill="#E8B9A3" stroke="#6E645C" stroke-width="1.5"/>
<ellipse cx="576" cy="310" rx="12.0" ry="4.8" fill="#E8B9A3" stroke="#6E645C" stroke-width="1.5"/>
<ellipse cx="576" cy="310" rx="4.8" ry="2.0" fill="#B98A5E"/>
