<line x1="666" y1="535" x2="682" y2="535" stroke="#6E645C" stroke-width="2"/>
<text x="688" y="428.5" font-size="18" font-weight="700" fill="#6E645C" text-anchor="start">L</text>
<line x1="720" y1="385" x2="720" y2="535" stroke="#C85A32" stroke-width="2"/>
<line x1="712" y1="385" x2="728" y2="385" stroke="#C85A32" stroke-width="2"/>
<line x1="712" y1="535" x2="728" y2="535" stroke="#C85A32" stroke-width="2"/>
<text x="734" y="466.0" font-size="18" font-weight="700" fill="#C85A32" text-anchor="start">2/3 L</text>
<text x="460" y="570" font-size="18" fill="#6E645C">At least 2/3 of L tall, e.g.</text>
<text x="460" y="594" font-size="18" fill="#6E645C">20 in+ for 30-inch rolls.</text>
<rect x="800" y="165" width="340" height="440" rx="16" fill="#FFFFFF" stroke="#D8CBBB" stroke-width="2"/>
<circle cx="836" cy="205" r="20" fill="#C85A32"/>
<text x="836" y="213" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="868" y="214" font-size="25" font-weight="700" fill="#342E2A">Under-bed box</text>
<rect x="825" y="285" width="290" height="26" rx="6" fill="#D9B48A" stroke="#B98A5E" stroke-width="2"/>
<rect x="825" y="255" width="290" height="30" rx="8" fill="#FFFFFF" stroke="#D8CBBB" stroke-width="2"/>
<rect x="831" y="311" width="14" height="170" fill="#B98A5E"/>
