<ellipse cx="630" cy="310" rx="4.8" ry="2.0" fill="#B98A5E"/>
<path d="M500 385 L650 385 L640 535 L510 535 Z" fill="#D9B48A" stroke="#B98A5E" stroke-width="3"/>
<line x1="504" y1="415" x2="646" y2="415" stroke="#B98A5E" stroke-width="1.5"/>
