<ellipse cx="603" cy="310" rx="12.0" ry="4.8" fill="#DCE5D6" stroke="#6E645C" stroke-width="1.5"/>
<ellipse cx="603" cy="310" rx="4.8" ry="2.0" fill="#B98A5E"/>
