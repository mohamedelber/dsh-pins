<ellipse cx="1072" cy="423" rx="3.6" ry="9.0" fill="#DCE5D6" stroke="#6E645C" stroke-width="1.5"/>
<ellipse cx="1072" cy="423" rx="1.5" ry="3.6" fill="#B98A5E"/>
<rect x="872" y="435.0" width="200" height="18" fill="#ECCDA0" stroke="#6E645C" stroke-width="1.5"/>
<ellipse cx="1072" cy="444" rx="3.6" ry="9.0" fill="#ECCDA0" stroke="#6E645C" stroke-width="1.5"/>
<ellipse cx="1072" cy="444" rx="1.5" ry="3.6" fill="#B98A5E"/>
<rect x="872" y="456.0" width="200" height="18" fill="#E8B9A3" stroke="#6E645C" stroke-width="1.5"/>
<ellipse cx="1072" cy="465" rx="3.6" ry="9.0" fill="#E8B9A3" stroke="#6E645C" stroke-width="1.5"/>
<ellipse cx="1072" cy="465" rx="1.5" ry="3.6" fill="#B98A5E"/>
<line x1="862" y1="387" x2="1092" y2="387" stroke="#C85A32" stroke-width="2"/>
<line x1="862" y1="379" x2="862" y2="395" stroke="#C85A32" stroke-width="2"/>
<line x1="1092" y1="379" x2="1092" y2="395" stroke="#C85A32" stroke-width="2"/>
<text x="977.0" y="375" font-size="18" font-weight="700" fill="#C85A32" text-anchor="middle">L + 1 in</text>
<text x="830" y="546" font-size="18" fill="#6E645C">Inside length L + 1 in,</text>
<text x="830" y="570" font-size="18" fill="#6E645C">e.g. 31 in+ for 30-inch rolls;</text>
<text x="830" y="594" font-size="18" fill="#6E645C">must fit the gap under the bed.</text>
<rect x="60" y="640" width="340" height="170" rx="16" fill="#DCE5D6" stroke="#D8CBBB" stroke-width="2"/>
<text x="86" y="692" font-size="25" font-weight="700" fill="#342E2A">Gift bags</text>
<text x="86" y="738" font-size="19" fill="#342E2A">File upright by size:</text>
<text x="86" y="768" font-size="19" fill="#342E2A">small, medium, large.</text>
<rect x="430" y="640" width="340" height="170" rx="16" fill="#DCE5D6" stroke="#D8CBBB" stroke-width="2"/>
<text x="456" y="692" font-size="25" font-weight="700" fill="#342E2A">Tissue paper</text>
<text x="456" y="738" font-size="19" fill="#342E2A">Store flat in a shallow</text>
<text x="456" y="768" font-size="19" fill="#342E2A">box or drawer.</text>
<rect x="800" y="640" width="340" height="170" rx="16" fill="#F6E1D6" stroke="#D8CBBB" stroke-width="2"/>
<text x="826" y="692" font-size="25" font-weight="700" fill="#C85A32">Where to keep it</text>
<text x="826" y="738" font-size="19" fill="#342E2A">Indoors, 3 ft+ from heaters,</text>
<text x="826" y="768" font-size="19" fill="#342E2A">not attic or basement.</text>
<text x="60" y="868" font-size="16" fill="#6E645C">2/3 and +1 in are practical rules of thumb. Heater distance: USFA. Avoid attics and basements for paper: Library of Congress.</text>
</svg>