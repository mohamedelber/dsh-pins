<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" font-family="Poppins, sans-serif" role="img" aria-labelledby="bb-t bb-d"><title id="bb-t">Board and batten spacing guide</title><desc id="bb-d">Front view of a 123 1/2 in wide wall with board and batten 60 in high: seven 1x4 battens, 3 1/2 in wide, with a batten in each corner and 16 1/2 in gaps between them, under a 1x4 top rail with a 1x2 ledge, above the baseboard. The formula box shows gap = (wall width minus battens times batten width) divided by (battens minus 1), the actual widths of 1x2 to 1x6 boards and the common 12 to 24 in gap.</desc><rect width="1200" height="900" fill="#F7F1E9"/><text x="60" y="84" font-size="44" font-weight="700" fill="#342E2A">Board and Batten Spacing</text><text x="60" y="124" font-size="22" fill="#6E645C">Battens in both corners, equal gaps in between</text><text x="1140" y="60" font-size="18" fill="#6E645C" text-anchor="end">dailyspacehacks.com</text><rect x="70" y="211.20000000000005" width="654.55" height="508.79999999999995" fill="#FBF8F3" stroke="#342E2A" stroke-width="3"/><rect x="70" y="402.0" width="654.55" height="318.0" fill="#DCE6D8"/><rect x="70" y="690.85" width="654.55" height="29.15" fill="#B9CBB3" stroke="#8FA689" stroke-width="1.5"/><rect x="70" y="402.0" width="654.55" height="18.55" fill="#B9CBB3" stroke="#8FA689" stroke-width="1.5"/><rect x="64" y="394.0" width="666.55" height="8" fill="#8FA689"/><rect x="70.0" y="420.55" width="18.55" height="270.3" fill="#B9CBB3" stroke="#8FA689" stroke-width="1.5"/><rect x="176.0" y="420.55" width="18.55" height="270.3" fill="#B9CBB3" stroke="#8FA689" stroke-width="1.5"/><rect x="282.0" y="420.55" width="18.55" height="270.3" fill="#B9CBB3" stroke="#8FA689" stroke-width="1.5"/><rect x="388.0" y="420.55" width="18.55" height="270.3" fill="#B9CBB3" stroke="#8FA689" stroke-width="1.5"/><rect x="494.0" y="420.55" width="18.55" height="270.3" fill="#B9CBB3" stroke="#8FA689" stroke-width="1.5"/><rect x="600.0" y="420.55" width="18.55" height="270.3" fill="#B9CBB3" stroke="#8FA689" stroke-width="1.5"/><rect x="706.0" y="420.55" width="18.55" height="270.3" fill="#B9CBB3" stroke="#8FA689" stroke-width="1.5"/><line x1="50" y1="720" x2="744.55" y2="720" stroke="#B98A5E" stroke-width="6"/><line x1="88.55" y1="561.0" x2="176.0" y2="561.0" stroke="#C85A32" stroke-width="3"/><line x1="88.55" y1="551.0" x2="88.55" y2="571.0" stroke="#C85A32" stroke-width="3"/><line x1="176.0" y1="551.0" x2="176.0" y2="571.0" stroke="#C85A32" stroke-width="3"/><text x="132.275" y="523.0" font-size="20" font-weight="700" fill="#C85A32" text-anchor="middle">16 1/2 in</text><text x="132.275" y="545.0" font-size="18" font-weight="700" fill="#C85A32" text-anchor="middle">gap</text><line x1="406.55" y1="491.4" x2="416.55" y2="491.4" stroke="#3F5E39" stroke-width="2"/><text x="420.55" y="497.4" font-size="16" font-weight="700" fill="#3F5E39">1x4</text><text x="420.55" y="517.4" font-size="14" fill="#3F5E39">3 1/2 in</text><line x1="70" y1="754" x2="724.55" y2="754" stroke="#342E2A" stroke-width="3"/><line x1="70" y1="744" x2="70" y2="764" stroke="#342E2A" stroke-width="3"/><line x1="724.55" y1="744" x2="724.55" y2="764" stroke="#342E2A" stroke-width="3"/><text x="397.275" y="786" font-size="20" font-weight="700" fill="#342E2A" text-anchor="middle">Wall 123 1/2 in: 7 battens, 6 gaps</text><text x="397.275" y="380.0" font-size="18" font-weight="700" fill="#3F5E39" text-anchor="middle">1x4 top rail + 1x2 ledge at 60 in</text><text x="397.275" y="714.4" font-size="15" font-weight="700" fill="#3F5E39" text-anchor="middle">baseboard</text><rect x="790" y="170" width="360" height="640" rx="18" fill="#fff" stroke="#E6DCCF" stroke-width="2"/><text x="814" y="214" font-size="22" font-weight="700" fill="#342E2A">The gap formula</text><text x="814" y="252" font-size="18" font-weight="700" fill="#C85A32" xml:space="preserve">Gap = (wall width</text><text x="814" y="280" font-size="18" font-weight="700" fill="#C85A32" xml:space="preserve">  − battens × batten width)</text><text x="814" y="308" font-size="18" font-weight="700" fill="#C85A32" xml:space="preserve">  ÷ (battens − 1)</text><text x="814" y="350" font-size="16" fill="#342E2A">(123.5 − 7 × 3.5) ÷ 6</text><text x="814" y="376" font-size="16" font-weight="700" fill="#342E2A">= 99 ÷ 6 = 16.5 in</text><text x="814" y="432" font-size="22" font-weight="700" fill="#342E2A">Actual board widths</text><rect x="802" y="446" width="336" height="38" rx="9" fill="#CFDDCB" fill-opacity="0.5"/><text x="814" y="472" font-size="17" font-weight="700" fill="#342E2A">1x2</text><text x="1126" y="472" font-size="17" font-weight="700" fill="#3F5E39" text-anchor="end">1 1/2 in (38 mm)</text><text x="814" y="512" font-size="17" font-weight="700" fill="#342E2A">1x3</text><text x="1126" y="512" font-size="17" font-weight="700" fill="#3F5E39" text-anchor="end">2 1/2 in (64 mm)</text><rect x="802" y="526" width="336" height="38" rx="9" fill="#CFDDCB" fill-opacity="0.5"/><text x="814" y="552" font-size="17" font-weight="700" fill="#342E2A">1x4</text><text x="1126" y="552" font-size="17" font-weight="700" fill="#3F5E39" text-anchor="end">3 1/2 in (89 mm)</text><text x="814" y="592" font-size="17" font-weight="700" fill="#342E2A">1x6</text><text x="1126" y="592" font-size="17" font-weight="700" fill="#3F5E39" text-anchor="end">5 1/2 in (140 mm)</text><text x="814" y="660" font-size="22" font-weight="700" fill="#342E2A">Common gaps</text><text x="814" y="696" font-size="17" fill="#342E2A">12 to 24 in (30 to 60 cm)</text><text x="814" y="726" font-size="17" fill="#342E2A">most popular: 16 to 20 in</text><text x="814" y="774" font-size="14" fill="#6E645C">Add 10% extra boards for cuts</text></svg>